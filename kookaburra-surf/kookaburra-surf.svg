<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0077be"/>
      <stop offset="60%" stop-color="#00a8e8"/>
      <stop offset="100%" stop-color="#005fa3"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d03f"/>
      <stop offset="50%" stop-color="#e6b800"/>
      <stop offset="100%" stop-color="#c78a00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="#0c1a2e"/>
  <circle cx="680" cy="120" r="60" fill="#ffd966" opacity="0.9" filter="url(#glow)"/>

  <!-- Distant clouds -->
  <g fill="#e6f2ff" opacity="0.6">
    <ellipse cx="150" cy="140" rx="70" ry="25"/>
    <ellipse cx="230" cy="150" rx="60" ry="20"/>
    <ellipse cx="580" cy="100" rx="80" ry="28"/>
  </g>

  <!-- Ocean background waves -->
  <path d="M0 320 Q100 280, 200 330 T400 310 T600 340 T800 300 V600 H0 Z" fill="url(#waveGrad)" opacity="0.4"/>
  <path d="M0 380 Q150 340, 300 390 T600 370 T800 400 V600 H0 Z" fill="#0066aa" opacity="0.6"/>

  <!-- Main wave with spray -->
  <path d="M-20 420 Q150 350, 350 410 T750 380 T820 440 V600 H-20 Z" fill="#009aec"/>
  <path d="M-20 430 Q200 370, 400 430 T850 400 V600 H-20 Z" fill="#0077be"/>

  <!-- White wave crest -->
  <path d="M-20 410 Q100 360, 250 400 T500 380 T850 410" stroke="#e8f6ff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M-20 420 Q100 370, 250 410 T500 390 T850 420" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Spray droplets -->
  <g fill="#e8f6ff">
    <circle cx="180" cy="375" r="4"/>
    <circle cx="210" cy="360" r="6"/>
    <circle cx="240" cy="385" r="3"/>
    <circle cx="500" cy="390" r="5"/>
    <circle cx="540" cy="375" r="4"/>
    <circle cx="580" cy="395" r="3"/>
  </g>

  <!-- Longboard -->
  <g>
    <!-- Board shadow -->
    <ellipse cx="400" cy="470" rx="220" ry="18" fill="#000" opacity="0.25" transform="rotate(-4 400 470)"/>
    <!-- Board body -->
    <ellipse cx="400" cy="465" rx="210" ry="22" fill="url(#boardGrad)" transform="rotate(-3 400 465)"/>
    <!-- Board stripe / design -->
    <ellipse cx="400" cy="465" rx="190" ry="8" fill="none" stroke="#bfae00" stroke-width="2" transform="rotate(-3 400 465)"/>
    <ellipse cx="400" cy="465" rx="170" ry="4" fill="none" stroke="#fff8e7" stroke-width="1.5" transform="rotate(-3 400 465)"/>
    <!-- Board fins -->
    <path d="M520 475 L525 495 L535 495 Z" fill="#e6b800"/>
    <path d="M540 474 L545 492 L552 492 Z" fill="#e6b800"/>
  </g>

  <!-- Kookaburra -->
  <g transform="translate(0, -10)">
    <!-- Tail feathers -->
    <path d="M420 425 Q380 430, 360 410 Q370 440, 410 445 Z" fill="#6b4226"/>
    <path d="M410 435 Q370 440, 350 415 Q370 450, 410 445 Z" fill="#8a5a3a"/>

    <!-- Body -->
    <ellipse cx="430" cy="410" rx="35" ry="28" fill="#5c3a1e" transform="rotate(-15 430 410)"/>

    <!-- White belly -->
    <ellipse cx="435" cy="418" rx="16" ry="12" fill="#fdf6e3" transform="rotate(-15 435 418)"/>

    <!-- Wing -->
    <path d="M410 400 Q390 385, 400 410 Q420 420, 410 430 Z" fill="#8a5a3a"/>
    <path d="M415 405 Q395 395, 405 415 Z" fill="#6b4226"/>

    <!-- Head -->
    <circle cx="465" cy="385" r="22" fill="#5c3a1e"/>

    <!-- Large eyes -->
    <circle cx="475" cy="380" r="7" fill="#fff"/>
    <circle cx="477" cy="380" r="3" fill="#2a1a0a"/>
    <circle cx="473" cy="378" r="2" fill="#fff" opacity="0.9"/>

    <!-- Beak -->
    <path d="M480 388 Q510 395, 510 405 Q490 410, 475 395 Z" fill="#5a3a0a"/>
    <path d="M480 392 Q505 398, 505 402 Q485 405, 475 398 Z" fill="#c49a2e"/>

    <!-- Eye stripe (kookaburra marking) -->
    <path d="M455 385 L475 385 L485 395 L475 400 Z" fill="#3a2a1a"/>

    <!-- Crest / top of head -->
    <path d="M460 365 Q465 350, 475 360 L485 365 Z" fill="#4a3218"/>

    <!-- Feet / legs -->
    <path d="M420 435 L410 455 L425 455 Z" fill="#bfae00"/>
    <path d="M440 438 L430 455 L445 455 Z" fill="#bfae00"/>

    <!-- Surf stance arm -->
    <path d="M455 395 Q445 410, 460 420" stroke="#5c3a1e" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="465" cy="420" r="5" fill="#5c3a1e"/>
  </g>

  <!-- Hair / wind effect -->
  <path d="M350 390 Q300 370, 280 390 Q300 410, 350 410" stroke="#fdf6e3" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M340 385 Q290 365, 270 380" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>