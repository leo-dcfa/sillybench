<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noosa Little Cove</title>
<style>
  :root {
    --sky-top: #7ec8f5;
    --sky-bottom: #eaf8ff;
    --sea-deep: #0e5a7c;
    --sea-mid: #1f8fb0;
    --sea-near: #3bc0c8;
    --beach: #f2dfb4;
    --beach-wet: #d9c48f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, var(--sky-top) 0%, #b6e3f8 40%, var(--sky-bottom) 62%, var(--sky-bottom) 100%);
    overflow: hidden;
  }

  /* ---------- Sun ---------- */
  .sun {
    position: absolute;
    top: 10%;
    right: 12%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fffbe8, #ffe9a8 55%, #ffd37a 100%);
    box-shadow: 0 0 60px 18px rgba(255, 220, 130, .55);
    animation: sunGlow 6s ease-in-out infinite;
  }
  @keyframes sunGlow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.12); }
  }

  /* ---------- Distant headlands (Noosa National Park ridges) ---------- */
  .headland-far {
    position: absolute;
    bottom: 34%;
    left: -4%;
    width: 55%;
    height: 26%;
    background: linear-gradient(to bottom, #2f8a93, #23737e);
    border-radius: 0 0 0 0;
    clip-path: polygon(0 100%, 0 45%, 12% 40%, 24% 58%, 38% 34%, 56% 55%, 72% 30%, 86% 52%, 100% 38%, 100% 100%);
    opacity: .8;
  }
  .headland-far-right {
    position: absolute;
    bottom: 34%;
    right: -6%;
    width: 50%;
    height: 22%;
    background: linear-gradient(to bottom, #2f8a93, #23737e);
    clip-path: polygon(0 55%, 16% 38%, 34% 60%, 52% 32%, 68% 54%, 84% 40%, 100% 50%, 100% 100%, 0 100%);
    opacity: .8;
  }
  .headland-near {
    position: absolute;
    bottom: 30%;
    left: -5%;
    width: 42%;
    height: 22%;
    background: linear-gradient(to bottom, #1f6e79, #17545e);
    clip-path: polygon(0 100%, 0 60%, 18% 52%, 40% 66%, 62% 46%, 82% 60%, 100% 55%, 100% 100%);
  }
  .headland-near-right {
    position: absolute;
    bottom: 30%;
    right: -6%;
    width: 46%;
    height: 20%;
    background: linear-gradient(to bottom, #1f6e79, #17545e);
    clip-path: polygon(0 62%, 22% 52%, 42% 68%, 62% 48%, 82% 62%, 100% 54%, 100% 100%, 0 100%);
  }

  /* -------- vegetation scrubs on the headlands (Little Cove's national park bush) -------- */
  .scrub {
    position: absolute;
    border-radius: 50% 60% 50% 55%;
    background: radial-gradient(circle at 40% 30%, #3f9c47, #2c7d35);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.05);
  }

  /* ---------- Ocean ---------- */
  .ocean {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 62%;
  }

  .sea-deep {
    position: absolute;
    left: 0; right: 0; bottom: 34%;
    height: 66%;
    background: linear-gradient(to bottom, var(--sea-mid) 0%, var(--sea-deep) 100%);
  }

  /* gentle swell lines on the open water */
  .swell {
    position: absolute;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,.16);
  }
  .swell.s1 { top: 42%; left: 6%;  width: 26%; animation: drift 26s linear infinite; }
  .swell.s2 { top: 56%; left: 40%; width: 30%; animation: drift 32s linear infinite reverse; }
  .swell.s3 { top: 70%; left: 68%; width: 18%; animation: drift 22s linear infinite; }
  @keyframes drift {
    from { transform: translateX(-20%); opacity: 0; }
    10% { opacity: .9; }
    90% { opacity: .9; }
    to { transform: translateX(140%); opacity: 0; }
  }

  /* ---------- Waves ---------- */
  .wave-band {
    position: absolute;
    left: -5%;
    width: 110%;
  }

  /* soft open-water rolling bands (the "easy waves") */
  .wave-band.open { height: 46px; }
  .wave-band.open .wave-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.10) 12%, rgba(28,138,162,.85) 55%, rgba(14,90,124,1) 100%);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    animation: swellMove 7s ease-in-out infinite;
  }

  /* breaking waves a little further out — soft peeling white-lip reefs */
  .wave-band.peek {
    bottom: 30%;
    height: 26px;
    animation: bob 4.5s ease-in-out infinite;
  }
  .peek .foam {
    position: absolute;
    top: 0; width: 100%; height: 14px;
    background: radial-gradient(circle at 30% 100%, #fff 0%, #e6f7ff 55%, rgba(255,255,255,0) 100%);
    filter: blur(.5px);
    border-radius: 0 0 40% 40%;
    animation: lipPulse 4.5s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(5px);} }
  @keyframes lipPulse { 0%,100% { opacity:.55; } 50% { opacity:.95; } }

  @keyframes swellMove {
    0%, 100% { transform: scaleY(.9) translateY(2px); }
    50% { transform: scaleY(1.08) translateY(-3px); }
  }

  /* foreground foreshore waves rolling onto the sand (long, mushy and easy) */
  .foreshore {
    position: absolute;
    bottom: 11%;
    left: -5%;
    width: 110%;
    height: 48px;
    animation: rollIn 11s ease-in-out infinite;
  }
  .foreshore .outer {
    width: 100%;
    height: 100%;
    border-radius: 50% 50% 0 0;
    background: linear-gradient(to bottom,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,.35) 18%,
      rgba(59,192,200,.9) 55%,
      rgba(24,148,170,1) 100%);
  }
  .foreshore .lip {
    position: absolute;
    top: 2px; left: 0; width: 100%; height: 20px;
    background: linear-gradient(to bottom, #ffffff, rgba(255,255,255,.55));
    border-radius: 50% 50% 0 0;
    filter: blur(.4px);
    opacity: .9;
  }
  @keyframes rollIn {
    0%   { transform: translateY(8px) scaleY(.92); opacity:.85; }
    50%  { transform: translateY(-4px) scaleY(1.05); opacity:1; }
    100% { transform: translateY(8px) scaleY(.92); opacity:.85; }
  }

  /* ---------- Longboarder riding the break ---------- */
  .longboarder {
    position: absolute;
    bottom: 27%;
    left: 46%;
    width: 150px;
    height: 120px;
    animation: ride 12s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(0,40,60,.35));
  }
  @keyframes ride {
    0%   { transform: translateX(-60px) translateY(0px); }
    30%  { transform: translateX(8px)  translateY(-14px) rotate(-2deg); }
    50%  { transform: translateX(-6px)  translateY(-6px); }
    70%  { transform: translateX(24px)  translateY(-16px) rotate(2deg); }
    100% { transform: translateX(-60px) translateY(0px); }
  }

  .board-svg {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
  }

  /* ---------- Beach ---------- */
  .beach {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 12%;
    background: linear-gradient(to bottom, var(--beach-wet) 0%, var(--beach) 45%, #f7e9c6 100%);
  }
  .beach-wet {
    position: absolute;
    left: 0; right: 0; bottom: 12%;
    height: 3.5%;
    background: linear-gradient(to bottom, rgba(30,120,140,.35), rgba(217,196,143,.9));
    border-radius: 0 0 60% 60% / 0 0 100% 100%;
  }
  .wet-line {
    position: absolute;
    left: 0; right: 0; bottom: 13%;
    height: 2px;
    border-radius: 50%;
    background: linear-gradient(to right, rgba(20,100,130,.5), rgba(20,100,130,.15), rgba(20,100,130,.5));
  }

  /* Tide marks / ripples across the sand */
  .tide {
    position: absolute;
    left: 0; right: 0;
    height: 1.5px;
    border-radius: 50%;
    background: rgba(180,150,95,.35);
  }

  /* ---------- Palm — a couple screening the cove ---------- */
  .palm {
    position: absolute;
    bottom: 12%;
    right: 18%;
    width: 60px;
    height: 130px;
    transform-origin: bottom center;
    animation: sway 6s ease-in-out infinite;
  }
  @keyframes sway { 0%,100% { transform: rotate(-2deg);} 50% { transform: rotate(2.5deg);} }
  .palm .trunk {
    position: absolute;
    bottom: 0; left: 50%;
    width: 10px; height: 100px;
    margin-left: -5px;
    background: linear-gradient(to bottom, #a9743c, #8a5a28);
    border-radius: 6px 6px 2px 2px;
    transform: rotate(10deg);
    box-shadow: inset -2px 0 rgba(0,0,0,.15);
  }
  .palm .fronds {
    position: absolute;
    top: 0; left: 50%;
    width: 86px; height: 70px;
    margin-left: -43px;
  }
  .frond {
    position: absolute;
    width: 56px; height: 18px;
    background: radial-gradient(ellipse at 0% 50%, #3f9c47, #2c7d35);
    border-radius: 60% 10% 10% 60%;
    transform-origin: 0% 50%;
  }
  .frond.f1 { top: 6px;  left: 4px;  transform: rotate(8deg);   }
  .frond.f2 { top: 22px; left: 30px; transform: rotate(60deg);  height: 14px; }
  .frond.f3 { top: 30px; left: 2px;  transform: rotate(-18deg); }
  .frond.f4 { top: 40px; left: 26px; transform: rotate(-55deg); height: 14px; }
  .frond.f5 { top: 16px; left: 0px;  transform: rotate(38deg);  height: 12px; }
  .coconut {
    position: absolute;
    width: 12px; height: 11px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9a6a35, #6f4a20);
  }
  .coconut.c1 { top: 34px; left: 38px; }
  .coconut.c2 { top: 42px; left: 26px; }

  /* a second, smaller palm on the other headland */
  .palm.small { right: auto; left: 8%; bottom: 30%; transform: scale(.7); }

  /* ---------- birds ---------- */
  .bird {
    position: absolute;
    width: 30px; height: 12px;
    opacity: .7;
  }
  .bird::before, .bird::after {
    content: "";
    position: absolute;
    top: 5px; width: 14px; height: 2px;
    background: #23444d;
    border-radius: 2px;
  }
  .bird::before { left: 0;  transform: rotate(-20deg); }
  .bird::after  { left: 15px; transform: rotate(20deg); }
  .bird.b1 { top: 12%; left: 20%; animation: fly 26s linear infinite; }
  .bird.b2 { top: 20%; left: 60%; animation: fly 34s linear infinite reverse; }
  @keyframes fly {
    from { transform: translateX(-8%) translateY(0); }
    25%  { transform: translateX(12%) translateY(-14px); }
    50%  { transform: translateX(30%) translateY(4px); }
    75%  { transform: translateX(12%) translateY(-10px); }
    to   { transform: translateX(-8%) translateY(0); }
  }

  /* ---------- subtle light glints on the water ---------- */
  .glint {
    position: absolute;
    width: 4px; height: 2px;
    border-radius: 50%;
    background: rgba(255,255,255,.7);
    animation: sparkle 3s ease-in-out infinite;
  }
  @keyframes sparkle {
    0%,100% { opacity: 0; transform: scale(.6); }
    50% { opacity: .9; transform: scale(1.2); }
  }

  /* ---------- caption ---------- */
  .title {
    position: absolute;
    top: 18px; left: 24px;
    color: rgba(10,45,60,.9);
    text-shadow: 0 1px 0 rgba(255,255,255,.4);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  .title small {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: rgba(10,45,60,.7);
    letter-spacing: .3px;
  }
</style>
</head>
<body>
  <div class="scene">

    <div class="title">
      Noosa — Little Cove
      <small>golden sand, turquoise water, mellow longboard glass</small>
    </div>

    <!-- sun & sky -->
    <div class="sun"></div>
    <div class="bird b1"></div>
    <div class="bird b2"></div>

    <!-- headlands -->
    <div class="headland-far"></div>
    <div class="headland-far-right"></div>
    <div class="headland-near"></div>
    <div class="headland-near-right"></div>

    <!-- scrub on the near headlands -->
    <div class="scrub" style="bottom:30%; left:1%; width:26px; height:26px;"></div>
    <div class="scrub" style="bottom:31%; left:7%; width:20px; height:20px;"></div>
    <div class="scrub" style="bottom:30%; right:1%; width:24px; height:24px;"></div>
    <div class="scrub" style="bottom:31%; right:9%; width:18px; height:18px;"></div>

    <!-- ocean -->
    <div class="ocean">
      <div class="sea-deep"></div>

      <div class="swell s1"></div>
      <div class="swell s2"></div>
      <div class="swell s3"></div>

      <!-- a few star glints on the water -->
      <div class="glint" style="bottom:46%; left:18%; animation-delay:.2s;"></div>
      <div class="glint" style="bottom:52%; left:34%; animation-delay:1.1s;"></div>
      <div class="glint" style="bottom:49%; left:58%; animation-delay:.6s;"></div>
      <div class="glint" style="bottom:55%; left:74%; animation-delay:1.6s;"></div>
      <div class="glint" style="bottom:62%; left:46%; animation-delay:.9s;"></div>
      <div class="glint" style="bottom:43%; left:84%; animation-delay:2.1s;"></div>

      <!-- open-water rolling swell -->
      <div class="wave-band open" style="bottom:44%;">
        <div class="wave-fill"></div>
      </div>
      <div class="wave-band open" style="bottom:52%; opacity:.75;">
        <div class="wave-fill"></div>
      </div>
      <div class="wave-band open" style="bottom:60%; opacity:.5;">
        <div class="wave-fill"></div>
      </div>

      <!-- peeling reef breaks (the longboard line-up) -->
      <div class="wave-band peek" style="bottom:29%; left:2%;">
        <div class="foam"></div>
      </div>
      <div class="wave-band peek" style="bottom:29%; left:52%; animation-delay:1.4s;">
        <div class="foam" style="animation-delay:1.4s;"></div>
      </div>

      <!-- longboarder riding the inside wave -->
      <div class="longboarder">
        <svg class="board-svg" viewBox="0 0 150 120" xmlns="http://www.w3.org/2000/svg">
          <!-- longboard (long, rounded, classic log) -->
          <ellipse cx="75" cy="104" rx="62" ry="9" fill="#fff7de" stroke="#d8c48c" stroke-width="1.5"/>
          <ellipse cx="75" cy="102" rx="55" ry="6" fill="#ffe295"/>
          <ellipse cx="40" cy="102" rx="6" ry="2.6" fill="#8a5a28" opacity=".85"/>
          <ellipse cx="92" cy="102" rx="6" ry="2.6" fill="#8a5a28" opacity=".85"/>
          <ellipse cx="66" cy="102" rx="6" ry="2.6" fill="#8a5a28" opacity=".85"/>

          <!-- rider silhouette (cross-stepping toward the nose) -->
          <g fill="#123440">
            <!-- legs -->
            <rect x="66" y="82" width="7" height="18" rx="3" transform="rotate(8 69 90)"/>
            <rect x="80" y="80" width="7" height="20" rx="3" transform="rotate(-6 83 90)"/>
            <!-- torso leaning into a trimmed turn -->
            <ellipse cx="76" cy="70" rx="11" ry="18" transform="rotate(-6 76 72)"/>
            <!-- trailing arm -->
            <path d="M64 66 q-16 -4 -12 -14 q3 -6 12 0" stroke="#123440" stroke-width="5" fill="none" stroke-linecap="round"/>
            <!-- leading arm outstretched cross-stepping -->
            <path d="M86 62 q18 2 26 -4" stroke="#123440" stroke-width="5" fill="none" stroke-linecap="round"/>
            <!-- head -->
            <circle cx="78" cy="48" r="8" fill="#123440"/>
          </g>
        </svg>
      </div>

      <!-- foreshore waves rolling onto the beach -->
      <div class="foreshore" style="bottom:11%; animation-delay:0s;"></div>
      <div class="foreshore" style="bottom:11.4%; animation-delay:2.1s; opacity:.8;"></div>
      <div class="foreshore" style="bottom:11.8%; animation-delay:4.4s; opacity:.6;"></div>
    </div>

    <!-- wet sand + tide marks -->
    <div class="beach-wet"></div>
    <div class="wet-line"></div>
    <div class="tide" style="bottom:6%;   transform: scaleY(1.6);"></div>
    <div class="tide" style="bottom:3.4%; transform: scaleY(1.2); opacity:.7;"></div>
    <div class="tide" style="bottom:1.6%; opacity:.5;"></div>

    <!-- beach -->
    <div class="beach"></div>

    <!-- palms -->
    <div class="palm">
      <div class="fronds">
        <div class="frond f1"></div>
        <div class="frond f2"></div>
        <div class="frond f3"></div>
        <div class="frond f4"></div>
        <div class="frond f5"></div>
      </div>
      <div class="trunk"></div>
      <div class="coconut c1"></div>
      <div class="coconut c2"></div>
    </div>
    <div class="palm small">
      <div class="fronds">
        <div class="frond f1"></div>
        <div class="frond f2"></div>
        <div class="frond f3"></div>
        <div class="frond f4"></div>
        <div class="frond f5"></div>
      </div>
      <div class="trunk"></div>
      <div class="coconut c1"></div>
      <div class="coconut c2"></div>
    </div>

  </div>
</body>
</html>
