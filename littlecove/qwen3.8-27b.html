<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Cove — Noosa Heads</title>
<style>
  html,body{height:100%;margin:0;background:#0c1114;overflow:hidden}
  svg{display:block;width:100vw;height:100vh}

  .wave{animation:waveRun 14s linear infinite}
  .w2{animation-delay:-3.5s}
  .w3{animation-delay:-7s}
  .w4{animation-delay:-10.5s}
  @keyframes waveRun{
    0%{transform:translateY(-96px);opacity:0}
    10%{opacity:.9}
    55%{opacity:.65}
    100%{transform:translateY(54px);opacity:0}
  }

  .swash{animation:swash 3.6s ease-in-out infinite}
  .swash2{animation:swash 3.6s ease-in-out infinite;animation-delay:-1.8s}
  @keyframes swash{
    0%,100%{transform:translateY(0);opacity:.22}
    50%{transform:translateY(5px);opacity:.55}
  }

  .foamR{animation:foamR 4.5s ease-in-out infinite}
  @keyframes foamR{0%,100%{opacity:.25}50%{opacity:.55}}

  .driftA{animation:drift 130s linear infinite}
  .driftB{animation:drift 210s linear infinite}
  @keyframes drift{to{transform:translateX(-1400px)}}

  .g{opacity:0;animation:glint 5s ease-in-out infinite}
  @keyframes glint{0%,100%{opacity:0}50%{opacity:.55}}

  .swell{animation:swellDrift 9s ease-in-out infinite}
  @keyframes swellDrift{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  .bob{animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}

  .cap{font:600 14px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.35em;fill:#f5f7f8;opacity:0;animation:capIn 2.4s ease 1.2s forwards}
  @keyframes capIn{to{opacity:.75}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg viewBox="0 0 1400 525" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animated recreation of Little Cove, Noosa Heads: pandanus and scrub framing a crescent beach, cobbled foreshore, a rocky point to the right and gentle longboarder waves rolling in.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ba3c4"/>
      <stop offset=".45" stop-color="#b6c9d6"/>
      <stop offset=".8" stop-color="#dfe8ee"/>
      <stop offset="1" stop-color="#eef2f4"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54707b"/>
      <stop offset=".55" stop-color="#5e7c86"/>
      <stop offset="1" stop-color="#75949b"/>
    </linearGradient>
    <linearGradient id="wetG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6ae87"/>
      <stop offset="1" stop-color="#d2bd94"/>
    </linearGradient>
    <linearGradient id="sandG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2cb98"/>
      <stop offset="1" stop-color="#eed9ab"/>
    </linearGradient>
    <linearGradient id="vegL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c5236"/>
      <stop offset="1" stop-color="#1e3a27"/>
    </linearGradient>
    <linearGradient id="vegR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33593c"/>
      <stop offset="1" stop-color="#1d3a28"/>
    </linearGradient>
    <linearGradient id="cobShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".8">
      <stop offset=".62" stop-color="#08131a" stop-opacity="0"/>
      <stop offset="1" stop-color="#08131a" stop-opacity=".28"/>
    </radialGradient>

    <filter id="soft" x="-20%" y="-120%" width="140%" height="340%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="haze" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="foam" x="-10%" y="-300%" width="120%" height="700%"><feGaussianBlur stdDeviation=".7"/></filter>

    <pattern id="peb" width="54" height="40" patternUnits="userSpaceOnUse">
      <rect width="54" height="40" fill="#9aa0a4"/>
      <ellipse cx="9" cy="8" rx="7" ry="5" fill="#b7bbbe" transform="rotate(12 9 8)"/>
      <ellipse cx="27" cy="6" rx="6" ry="4.5" fill="#878d91" transform="rotate(-18 27 6)"/>
      <ellipse cx="45" cy="10" rx="7" ry="5" fill="#c2c6c9" transform="rotate(24 45 10)"/>
      <ellipse cx="16" cy="20" rx="6.5" ry="4.8" fill="#a3a9ad" transform="rotate(-8 16 20)"/>
      <ellipse cx="36" cy="22" rx="7" ry="5" fill="#8d9397" transform="rotate(16 36 22)"/>
      <ellipse cx="51" cy="24" rx="5.5" ry="4" fill="#b0b4b7" transform="rotate(-24 51 24)"/>
      <ellipse cx="6" cy="32" rx="6" ry="4.5" fill="#878d91" transform="rotate(20 6 32)"/>
      <ellipse cx="24" cy="34" rx="6.5" ry="4.8" fill="#bdc1c4" transform="rotate(-14 24 34)"/>
      <ellipse cx="44" cy="34" rx="6" ry="4.5" fill="#989ea2" transform="rotate(8 44 34)"/>
    </pattern>
    <pattern id="peb2" width="36" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(8) scale(.8)">

      <ellipse cx="24" cy="14" rx="6" ry="4" fill="#d8dcdf" opacity=".3"/>
      <ellipse cx="10" cy="22" rx="5" ry="3.5" fill="#767c80" opacity=".3"/>
      <ellipse cx="30" cy="4" rx="5" ry="3.5" fill="#c8ccd0" opacity=".3"/>
    </pattern>

    <path id="leaf" d="M0 0 C-3 -12 -4 -26 -2 -40 C0 -46 2 -45 3 -38 C3 -24 2 -12 0 0 Z"/>
    <g id="pan">
      <use href="#leaf" transform="rotate(-74)"/>
      <use href="#leaf" transform="rotate(-50)"/>
      <use href="#leaf" transform="rotate(-26)"/>
      <use href="#leaf"/>
      <use href="#leaf" transform="rotate(26)"/>
      <use href="#leaf" transform="rotate(50)"/>
      <use href="#leaf" transform="rotate(74)"/>
    </g>

    <path id="seaShape" d="M0 208 H1400 V246 C1340 264 1290 286 1252 297 C1075 315 890 327 710 327 C540 327 320 316 118 298 C80 292 40 288 0 286 Z"/>
    <clipPath id="seaClip"><use href="#seaShape"/></clipPath>

    <path id="cob" d="M0 322 C160 336 340 350 560 360 C720 361 900 361 1150 336 C1180 318 1210 304 1245 296 C1290 286 1340 264 1400 246 L1400 525 L0 525 Z"/>
    <path id="sand" d="M150 312 C340 330 560 342 710 342 C860 342 1000 334 1120 318 C1136 336 1138 356 1124 376 C990 420 800 442 600 440 C420 436 260 405 175 356 C158 342 150 328 150 312 Z"/>
    <clipPath id="sandClip"><use href="#sand"/></clipPath>

    <path id="foamTop" d="M118 298 C320 316 540 327 710 327 C890 327 1075 315 1252 297" fill="none"/>
    <path id="foamBand" d="M118 298 C320 316 540 327 710 327 C890 327 1075 315 1252 297 L1252 318 C1075 336 890 348 710 348 C540 348 320 337 118 319 Z"/>

    <g id="cloudSetA">

      <ellipse cx="520" cy="78" rx="150" ry="28" fill="#ffffff"/>
      <ellipse cx="720" cy="50" rx="130" ry="26" fill="#edf1f4"/>
      <ellipse cx="910" cy="80" rx="160" ry="30" fill="#f7f9fa"/>

      <ellipse cx="1280" cy="82" rx="140" ry="28" fill="#f0f3f5"/>
      <ellipse cx="60" cy="120" rx="110" ry="22" fill="#e8edf0"/>
      <ellipse cx="1200" cy="120" rx="120" ry="22" fill="#e9eef1"/>

    <g id="cloudSetB">
      <ellipse cx="250" cy="140" rx="180" ry="30" fill="#dfe6ea"/>

      <ellipse cx="950" cy="140" rx="170" ry="28" fill="#e2e8ec"/>

      <ellipse cx="80" cy="170" rx="120" ry="24" fill="#dde4e8"/>

  </defs>

  <!-- SKY -->
  <rect x="0" y="0" width="1400" height="215" fill="url(#sky)"/>

  <g class="driftA" opacity=".95"><g filter="url(#soft)"><use href="#cloudSetA"/><use href="#cloudSetA" x="1400"/></g></g>

  <!-- OCEAN -->

  <g clip-path="url(#seaClip)" stroke="#fff" fill="none" stroke-linecap="round">

  </g>

  <!-- light glints -->
  <g clip-path="url(#seaClip)" stroke="#fff" stroke-width="1.4" stroke-linecap="round">

    <line class="g" x1="700" y1="250" x2="720" y2="251" style="animation-duration:4.8s;animation-delay:-.6s"/>

    <line class="g" x1="760" y1="282" x2="778" y2="283" style="animation-duration:5.8s;animation-delay:-.9s"/>
    <line class="g" x1="940" y1="276" x2="952" y2="277" style="animation-duration:4.6s;animation-delay:-3s"/>
  </g>

  <!-- gentle longboarder waves -->
  <g clip-path="url(#seaClip)">

    <g class="wave w2"><use href="#foamBand" fill="#fff" opacity=".12"/><use href="#foamTop" stroke="#fff" stroke-width="2.4" opacity=".7" filter="url(#foam)"/></g>

    <g class="wave w4"><use href="#foamBand" fill="#fff" opacity=".1"/><use href="#foamTop" stroke="#fff" stroke-width="2.2" opacity=".6" filter="url(#foam)"/></g>
  </g>

  <!-- people in the shallows -->
  <g>
    <g transform="translate(259,291)"><circle cy="-6.5" r="2.1" fill="#cfa071"/><path d="M-2 -5 h4 v4.5 h-4z" fill="#5a616a"/></g>
    <g transform="translate(586,300)"><circle cy="-6.5" r="2.1" fill="#cfa071"/><path d="M-2 -5 h4 v4.5 h-4z" fill="#4c5560"/></g>
    <g transform="translate(612,300)"><circle cy="-6.5" r="2.1" fill="#cfa071"/><path d="M-2 -5 h4 v4.5 h-4z" fill="#5f4a44"/></g>
    <g transform="translate(986,267)"><circle cy="-6.5" r="2" fill="#cfa071"/><path d="M-1.8 -5 h3.6 v4.2 h-3.6z" fill="#3f4750"/></g>
    <g transform="translate(1011,265)"><circle cy="-6.5" r="2" fill="#cfa071"/><path d="M-1.8 -5 h3.6 v4.2 h-3.6z" fill="#57504a"/></g>
    <g transform="translate(1030,267)"><circle cy="-6.5" r="2" fill="#cfa071"/><path d="M-1.8 -5 h3.6 v4.2 h-3.6z" fill="#4a4f57"/></g>
  </g>

  <!-- WET SAND -->
  <path d="M118 298 C320 316 540 327 710 327 C860 327 1000 318 1150 302 L1150 336 C1000 352 860 361 710 361 C540 361 340 350 118 331 Z" fill="url(#wetG)"/>
  <path class="swash" d="M118 331 C340 350 560 360 710 360 C860 360 1000 351 1150 335" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path class="swash2" d="M118 322 C340 341 560 352 710 352 C860 352 1000 343 1150 327" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".4"/>
  <path class="foamR" d="M1150 302 C1185 296 1215 292 1245 296 C1280 288 1320 270 1372 250" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- COBBLED FORESHORE + rocky point -->
  <use href="#cob" fill="url(#peb)"/>
  <use href="#cob" fill="url(#peb2)"/>
  <use href="#cob" fill="url(#cobShade)"/>

  <!-- DRY SAND crescent -->
  <use href="#sand" fill="url(#sandG)"/>
  <g clip-path="url(#sandClip)">
    <g opacity=".5" fill="#f4e6bd">
      <ellipse cx="480" cy="380" rx="60" ry="10"/>
      <ellipse cx="760" cy="400" rx="80" ry="12"/>
      <ellipse cx="330" cy="360" rx="40" ry="8"/>
    </g>
    <g opacity=".4" fill="#d0b587">
      <ellipse cx="600" cy="415" rx="70" ry="9"/>
      <ellipse cx="880" cy="380" rx="55" ry="8"/>
    </g>
    <path d="M585 372 C610 400 625 420 640 442" fill="none" stroke="#cbb088" stroke-width="3" opacity=".5"/>
  </g>
  <g fill="#989ea2" stroke="#7c8286" stroke-width=".5">
    <ellipse cx="405" cy="412" rx="3" ry="2.2"/>
    <ellipse cx="452" cy="424" rx="2.6" ry="2"/>
    <ellipse cx="520" cy="432" rx="3.2" ry="2.3"/>
    <ellipse cx="700" cy="434" rx="2.8" ry="2"/>
    <ellipse cx="836" cy="416" rx="3" ry="2.2"/>
    <ellipse cx="948" cy="398" rx="2.6" ry="2"/>
    <ellipse cx="300" cy="398" rx="2.4" ry="1.8"/>
  </g>

  <!-- longboards on the sand -->
  <g>
    <ellipse cx="1000" cy="356" rx="31" ry="4" fill="#00000022"/>
    <g transform="translate(1000,352) rotate(-7)">
      <ellipse rx="30" ry="5.5" fill="#f2f4f5" stroke="#c9ced2" stroke-width=".8"/>
      <line x1="-26" x2="26" stroke="#dfe3e6" stroke-width="1"/>
    </g>
    <ellipse cx="1024" cy="364" rx="31" ry="4" fill="#00000022"/>
    <g transform="translate(1022,360) rotate(-4)">
      <ellipse rx="30" ry="5.5" fill="#eef1f2" stroke="#c9ced2" stroke-width=".8"/>
      <line x1="-26" x2="26" stroke="#d6dbde" stroke-width="1"/>
    </g>
  </g>

  <!-- people on the sand -->
  <g>
    <g transform="translate(184,307) scale(.9)">
      <circle cy="-12.5" r="2.4" fill="#d3a06f"/>
      <path d="M-2.5 -10 H2.5 V-3 L2 4 H.8 L.5 -1 H-.5 L-.8 4 H-2 V-3 Z" fill="#7a4a3a"/>

    <g transform="translate(258,404)">

    <g transform="translate(274,406)">

    </g>
    <g transform="translate(532,374)">
      <circle cy="-12.5" r="2.4" fill="#d3a06f"/>
      <path d="M-2.5 -10 H2.5 V-3 L2 4 H.8 L.5 -1 H-.5 L-.8 4 H-2 V-3 Z" fill="#5c646e"/>
      <rect x="-7" y="-3" width="5" height="4.5" rx="1" fill="#8a5a3a"/>

    <g transform="translate(712,426)">
      <rect x="-10" y="-2" width="20" height="5" rx="1" fill="#efe9df"/>

      <path d="M-3 -6 H3 V-2 H-1 L3 1 H-4 Z" fill="#4a4f57"/>

    <g transform="translate(502,456) rotate(-6)"><rect x="-14" y="-4" width="28" height="8" rx="1.5" fill="#e86a9a"/></g>
  </g>

  <!-- longboarders riding the line -->
  <g>
    <g class="bob">
      <ellipse rx="15" ry="2.6" fill="#f6f8f9" stroke="#c2c9cd" stroke-width=".8"/>
      <line x1="-12" x2="12" stroke="#d8dde0" stroke-width=".8"/>

      <path d="M1 -5 L4.5 -2.6" stroke="#cfa071" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <animateMotion dur="17s" repeatCount="indefinite" path="M170 300 C360 318 560 328 720 328 C880 328 1040 316 1190 299"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.06;.16;.84;1" dur="17s" repeatCount="indefinite"/>
  </g>
  <g>
    <g class="bob" style="animation-delay:-.9s">
      <ellipse rx="14" ry="2.4" fill="#f6f8f9" stroke="#c2c9cd" stroke-width=".8"/>
      <line x1="-11" x2="11" stroke="#d8dde0" stroke-width=".8"/>

      <path d="M-1.5 -5.4 L1.5 -5.4 L1.8 -1 L-1.8 -1 Z" fill="#3a3f47"/>

    <animateMotion dur="21s" begin="-9s" repeatCount="indefinite" path="M1190 299 C1040 316 880 328 720 328 C560 328 360 318 170 399"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.06;.16;.84;1" dur="21s" begin="-9s" repeatCount="indefinite"/>
  </g>

  <!-- viewing platform + railings, bottom left -->
  <g>
    <polygon points="0,470 256,470 300,525 0,525" fill="#cdd2d5"/>
    <line x1="0" y1="470" x2="256" y2="470" stroke="#9aa1a6" stroke-width="2"/>
    <g stroke="#9aa1a6" stroke-width="2">
      <line x1="258" y1="486" x2="276" y2="486"/>
      <line x1="262" y1="500" x2="288" y2="500"/>
      <line x1="268" y1="514" x2="298" y2="514"/>
    </g>
    <g fill="#b6bcc0" stroke="#8b9298" stroke-width=".6">
      <rect x="10" y="412" width="5" height="58"/>
      <rect x="90" y="412" width="5" height="58"/>
      <rect x="170" y="412" width="5" height="58"/>
      <rect x="248" y="412" width="5" height="58"/>
    </g>
    <rect x="0" y="409" width="256" height="6" fill="#c6ccd0"/>
    <rect x="0" y="438" width="256" height="3" fill="#a9b0b5"/>

  </g>

  <!-- LEFT: scrub + pandanus framing -->
  <g>

    <path d="M0 150 C40 140 70 170 74 210 C76 246 56 276 28 288 L0 292 Z" fill="#1d3a27" opacity=".8"/>
    <use href="#pan" transform="translate(92,40) scale(1.1)" fill="#2e5a3b"/>
    <use href="#pan" transform="translate(128,118) rotate(12) scale(1.25)" fill="#2e5a3b"/>
    <use href="#pan" transform="translate(58,178) scale(1.05)" fill="#2e5a3b"/>
    <use href="#pan" transform="translate(112,232) rotate(-8) scale(.95)" fill="#2e5a3b"/>
    <use href="#pan" transform="translate(34,86) scale(.9)" fill="#2e5a3b"/>
    <use href="#pan" transform="translate(140,180) scale(.8)" fill="#356a44"/>
    <use href="#pan" transform="translate(120,60) scale(.8)" fill="#4a7d55"/>
    <use href="#pan" transform="translate(70,252) scale(.85)" fill="#4a7d55"/>
    <path d="M-4 14 C70 26 150 24 214 44" fill="none" stroke="#5b4834" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 28 C150 34 170 40 190 52" fill="none" stroke="#5b4834" stroke-width="2.5" stroke-linecap="round"/>
    <use href="#pan" transform="translate(218,46) scale(1.35)" fill="#2b5638"/>
    <use href="#pan" transform="translate(160,32) scale(.9)" fill="#356a44"/>
  </g>
