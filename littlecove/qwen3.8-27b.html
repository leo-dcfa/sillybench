<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Cove — the long, long peel</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #08222a;
    overflow: hidden;
  }
  svg {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  @keyframes crest {
    0%   { transform: translateX(0px);     opacity: 0; }
    12%  { opacity: 1; }
    72%  { opacity: 1; }
    100% { transform: translateX(-180px);  opacity: 0; }
  }
  @keyframes rider {
    0%   { transform: translate(1142px, 505px) rotate(-2deg) scale(1);    opacity: 0; }
    12%  { opacity: 1; }
    30%  { transform: translate(1080px, 538px) rotate(-8deg) scale(0.97); }
    52%  { transform: translate(955px, 578px)  rotate(-13deg) scale(0.94); }
    68%  { transform: translate(854px, 607px)  rotate(-10deg) scale(0.92); }
    82%  { transform: translate(764px, 630px)  rotate(-6deg)  scale(0.9); opacity: 1; }
    92%  { opacity: 0; }
    100% { transform: translate(700px, 644px)  rotate(-4deg)  scale(0.9); opacity: 0; }
  }
  @keyframes bulge {
    0%   { transform: translateX(0px);    opacity: 0; }
    25%  { opacity: 0.85; }
    70%  { opacity: 0.45; }
    100% { transform: translateX(-1080px); opacity: 0; }
  }
  @keyframes scroll {
    to { stroke-dashoffset: -240px; }
  }
  @keyframes drift {
    0%   { transform: translateX(0px); }
    100% { transform: translateX(-130px); }
  }
  @keyframes wet {
    0%, 100% { opacity: 0.5;  transform: translateY(0px); }
    45%      { opacity: 0.95; transform: translateY(-5px); }
  }
  @keyframes foamline {
    0%   { opacity: 0.35; }
    45%  { opacity: 0.95; }
  }
  @keyframes bubble {
    0%, 100% { opacity: 0.2;  transform: translateY(0px); }
    45%      { opacity: 0.85; transform: translateY(-3px); }
  }
  @keyframes shimmer {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 0.9; }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50%      { transform: translateY(3px) rotate(1.5deg); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(2.2deg); }
  }
  .crestA { animation: crest 9s linear infinite; }
  .crestB { animation: crest 9s linear -3s infinite; opacity: 0; }
  .crestC { animation: crest 9s linear -6s infinite; opacity: 0; }
  .riderA { animation: rider 9s linear 0.3s infinite; opacity: 0; }
  .bulgeA { animation: bulge 9s linear -0.6s infinite; opacity: 0; }
  .bulgeB { animation: bulge 9s linear -3.6s infinite; opacity: 0; }
  .bulgeC { animation: bulge 9s linear -6.6s infinite; opacity: 0; }
  .drift1 { animation: drift 14s linear infinite alternate; }
  .drift2 { animation: drift 19s linear infinite alternate-reverse; }
  .drift3 { animation: drift 23s linear infinite alternate; }
  .wet    { animation: wet 9s linear infinite; }
  .foamline { animation: foamline 9s linear infinite; }
  .bub1   { animation: bubble 9s linear 0.2s infinite; }
  .bub2   { animation: bubble 9s linear -1.4s infinite; }
  .bub3   { animation: bubble 9s linear -3.1s infinite; }
  .bub4   { animation: bubble 9s linear -4.8s infinite; }
  .bub5   { animation: bubble 9s linear -6.5s infinite; }
  .bub6   { animation: bubble 9s linear -8.0s infinite; }
  .shine  { animation: shimmer 7s ease-in-out infinite; }
  .scroll { animation: scroll 30s linear infinite; }
  .bobA   { animation: bob 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 60%; }
  .bobB   { animation: bob 5.1s ease-in-out -1.3s infinite; transform-box: fill-box; transform-origin: 50% 60%; }
  .bobC   { animation: bob 4.7s ease-in-out -2.2s infinite; transform-box: fill-box; transform-origin: 50% 60%; }
  .sway   { animation: sway 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .sway2  { animation: sway 7s ease-in-out -2s infinite; transform-box: fill-box; transform-origin: 50% 100%; }
</style>
</head>
<body>
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-label="Little Cove at Noosa Heads: a long peeling right-hander, morning glass, riders trimming for a hundred metres">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79b7d8"/>
      <stop offset="0.45" stop-color="#a3cde3"/>
      <stop offset="0.78" stop-color="#d3e4e6"/>
      <stop offset="1" stop-color="#f2e6cd"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f7490"/>
      <stop offset="0.18" stop-color="#1596ab"/>
      <stop offset="0.45" stop-color="#31b3b8"/>
      <stop offset="0.75" stop-color="#62d2c9"/>
      <stop offset="1" stop-color="#a5e9d9"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e6c6"/>
      <stop offset="1" stop-color="#ecd9ab"/>
    </linearGradient>
    <linearGradient id="wetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6b7e" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#35656e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4a6a5e" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7c4b"/>
      <stop offset="0.55" stop-color="#4a6b3e"/>
      <stop offset="1" stop-color="#3d5c37"/>
    </linearGradient>
    <linearGradient id="scrub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46704a"/>
      <stop offset="1" stop-color="#2f5236"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse" y1="500" y2="660">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#c4f0ec" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9fe5d8" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="bulgeG">
      <stop offset="0" stop-color="#f2fffd" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#c2efe8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c2efe8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff7dd" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff7dd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sparkle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fffbe8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig">
      <stop offset="0" stop-color="#06222b" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#06222b" stop-opacity="0"/>
      <stop offset="1" stop-color="#06222b" stop-opacity="0.22"/>
    </radialGradient>
    <filter id="soft8" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft12" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- ============ SKY ============ -->
  <rect x="0" y="0" width="1600" height="462" fill="url(#sky)"/>
  <circle cx="330" cy="148" r="170" fill="url(#sunGlow)"/>
  <circle cx="330" cy="148" r="42" fill="#fff6d8"/>
  <g fill="#ffffff" filter="url(#soft8)">
    <g class="drift1" opacity="0.75">
      <ellipse cx="560" cy="112" rx="110" ry="15"/>
      <ellipse cx="630" cy="100" rx="80" ry="12"/>
    </g>
    <g class="drift2" opacity="0.55">
      <ellipse cx="1050" cy="168" rx="140" ry="13"/>
      <ellipse cx="1130" cy="158" rx="70" ry="10"/>
    </g>
    <g class="drift3" opacity="0.4">
      <ellipse cx="300" cy="262" rx="170" ry="11"/>
    </g>
  </g>
  <!-- gulls -->
  <g stroke="#5a6a72" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.8">
    <g class="bobA"><path d="M468,124 q9,-8 17,0 q9,-8 17,0"/></g>
    <g class="bobB"><path d="M540,156 q7,-6 13,0 q7,-6 13,0"/></g>
    <g class="bobC"><path d="M420,192 q6,-5 11,0 q6,-5 11,0"/></g>
  </g>

  <!-- ============ WATER ============ -->
  <rect x="0" y="460" width="1600" height="440" fill="url(#water)"/>
  <!-- sun sparkle path on the glass -->
  <polygon points="300,462 365,462 430,700 205,700" fill="url(#sparkle)" class="shine" filter="url(#soft8)"/>
  <!-- clean lines of swell stacking out to the horizon -->
  <g fill="none" stroke="#eafffa" stroke-opacity="0.5" stroke-width="2.5" filter="url(#soft2)">
    <ellipse cx="820" cy="478" rx="900" ry="4.5" class="drift2"/>
    <ellipse cx="760" cy="497" rx="950" ry="5.5" class="drift3"/>
    <ellipse cx="830" cy="520" rx="980" ry="6.5" class="drift1"/>
    <ellipse cx="700" cy="548" rx="1000" ry="7.5" class="drift2"/>
  </g>
  <!-- glassy texture, slow -->
  <path d="M60,516 H1560" stroke="#eafffb" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="26 90" pathLength="240" class="scroll" fill="none"/>
  <path d="M30,586 H1560" stroke="#eafffb" stroke-opacity="0.14" stroke-width="2.5" stroke-dasharray="30 110" pathLength="240" class="scroll" style="animation-delay:-11s" fill="none"/>
  <path d="M80,668 H1560" stroke="#eafffb" stroke-opacity="0.10" stroke-width="3" stroke-dasharray="36 130" pathLength="240" class="scroll" style="animation-delay:-22s" fill="none"/>
  <!-- swell marching in: soft bulges rolling toward the point -->
  <ellipse class="bulgeA" cx="1750" cy="640" rx="160" ry="78" fill="url(#bulgeG)" filter="url(#soft12)"/>
  <ellipse class="bulgeB" cx="1760" cy="700" rx="140" ry="60" fill="url(#bulgeG)" filter="url(#soft12)"/>
  <ellipse class="bulgeC" cx="1720" cy="585" rx="110" ry="42" fill="url(#bulgeG)" filter="url(#soft12)"/>

  <!-- ============ THE WAVE — peeling right-hander ============ -->
  <!-- faint distant crest -->
  <g class="crestC" opacity="0">
    <path d="M1500,492 Q1360,478 1190,502 Q990,530 800,570" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.3" stroke-linecap="round" filter="url(#soft2)"/>
  </g>
  <!-- middle crest -->
  <g class="crestB" opacity="0">
    <path d="M1300,500 Q1160,486 980,512 Q770,542 560,586" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.45" stroke-linecap="round" filter="url(#soft2)"/>
    <path d="M1300,500 Q1160,486 980,512 Q770,542 560,586 L560,602 Q775,560 985,530 Q1160,505 1300,517 Z" fill="url(#face)" opacity="0.5"/>
  </g>
  <!-- the main wave: face + white leading edge -->
  <g class="crestA" opacity="0">
    <path d="M1168,514 Q1000,494 820,530 Q620,572 430,628 L430,650 Q625,596 825,556 Q1005,522 1168,530 Z" fill="url(#face)"/>
    <path d="M1168,514 Q1000,494 820,530 Q620,572 430,628" fill="none" stroke="#ffffff" stroke-width="10" stroke-opacity="0.35" stroke-linecap="round" filter="url(#soft2)"/>
    <path d="M1168,514 Q1000,494 820,530 Q620,572 430,628" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-opacity="0.95" stroke-linecap="round"/>
    <g fill="#ffffff" filter="url(#soft2)">
      <circle cx="1120" cy="514" r="7" opacity="0.8"/>
      <circle cx="1040" cy="502" r="6" opacity="0.7"/>
      <circle cx="940" cy="510" r="7" opacity="0.75"/>
      <circle cx="830" cy="528" r="6" opacity="0.7"/>
      <circle cx="720" cy="552" r="7" opacity="0.7"/>
      <circle cx="600" cy="586" r="6" opacity="0.65"/>
      <circle cx="500" cy="612" r="6" opacity="0.6"/>
    </g>
  </g>

  <!-- ============ SHALLOW WATER / SHORELINE ============ -->
  <path d="M0,712 Q300,700 620,708 Q900,714 1046,660" stroke="#bdeedd" stroke-width="16" fill="none" opacity="0.5" filter="url(#soft8)"/>
  <!-- foam running up the sand and draining back -->
  <path class="wet" d="M0,712 Q300,700 620,708 Q900,714 1046,660 L1046,676 Q900,728 620,722 Q300,714 0,724 Z" fill="url(#wetGrad)"/>
  <path class="foamline" d="M0,712 Q300,700 620,708 Q900,714 1046,660" stroke="#ffffff" stroke-width="5" fill="none" stroke-opacity="0.85" stroke-linecap="round"/>
  <g fill="#ffffff" filter="url(#soft2)">
    <circle class="bub1" cx="140" cy="714" r="5"/>
    <circle class="bub2" cx="320" cy="708" r="4"/>
    <circle class="bub3" cx="520" cy="710" r="5"/>
    <circle class="bub4" cx="700" cy="712" r="4"/>
    <circle class="bub5" cx="860" cy="708" r="5"/>
    <circle class="bub6" cx="980" cy="684" r="4"/>
  </g>

  <!-- ============ SAND ============ -->
  <path d="M0,712 Q300,700 620,708 Q900,714 1046,660 L1046,900 L0,900 Z" fill="url(#sand)"/>
  <g fill="#cbb488" opacity="0.35">
    <circle cx="180" cy="800" r="2.5"/>
    <circle cx="420" cy="840" r="2"/>
    <circle cx="640" cy="790" r="2.5"/>
    <circle cx="820" cy="820" r="2"/>
    <circle cx="260" cy="860" r="2"/>
    <circle cx="760" cy="870" r="2.5"/>
    <circle cx="950" cy="760" r="2"/>
    <circle cx="120" cy="760" r="2"/>
    <circle cx="560" cy="860" r="2"/>
    <circle cx="900" cy="860" r="2"/>
  </g>
  <!-- cobbled apron, left end of the cove -->
  <g stroke="#6b6252" stroke-width="1">
    <ellipse cx="60" cy="700" rx="40" ry="16" fill="#9a9184"/>
    <ellipse cx="128" cy="712" rx="44" ry="17" fill="#8a8172"/>
    <ellipse cx="196" cy="706" rx="38" ry="15" fill="#a39a8a"/>
    <ellipse cx="100" cy="736" rx="42" ry="15" fill="#8f8677"/>
    <ellipse cx="170" cy="734" rx="36" ry="13" fill="#9a9184"/>
    <ellipse cx="34" cy="736" rx="30" ry="12" fill="#8a8172"/>
    <ellipse cx="238" cy="722" rx="26" ry="11" fill="#a39a8a"/>
  </g>

  <!-- ============ HEADLAND ============ -->
  <path d="M1180,0 L1600,0 L1600,900 L1046,900 C1058,820 1074,740 1096,672 C1108,628 1122,580 1150,546 C1176,514 1204,486 1240,462 C1288,430 1330,404 1380,384 C1440,360 1500,344 1600,336 Z" fill="url(#land)"/>
  <!-- the low rock shelf the point runs out into -->
  <path d="M1150,546 C1176,514 1204,486 1240,462 C1288,430 1330,404 1380,384 C1440,360 1500,344 1600,336 L1600,420 C1500,428 1440,444 1380,468 C1330,488 1288,514 1240,546 C1204,570 1176,598 1150,630 Z" fill="#5a7a4e" opacity="0.35"/>
  <!-- thin sand strip at the foot of the headland -->
  <path d="M1046,660 C1058,820 1074,900 1074,900 L1130,900 C1112,830 1098,745 1086,678 C1072,690 1058,678 1046,660 Z" fill="#eeddb4" opacity="0.85"/>
  <!-- scrub down through which the stairs drop -->
  <path d="M1180,0 L1600,0 L1600,900 L1120,900 C1128,800 1140,700 1160,620 C1176,556 1210,500 1260,462 C1320,416 1400,380 1520,364 C1560,359 1585,358 1600,358 Z" fill="url(#scrub)"/>
  <!-- scrubs and rocks, mid-headland -->
  <g>
    <ellipse cx="1320" cy="380" rx="90" ry="26" fill="#3c5a38" opacity="0.8"/>
    <ellipse cx="1460" cy="330" rx="110" ry="30" fill="#41603c" opacity="0.8"/>
    <ellipse cx="1250" cy="520" rx="70" ry="22" fill="#33502f" opacity="0.85"/>
    <ellipse cx="1520" cy="500" rx="90" ry="26" fill="#3c5a38" opacity="0.8"/>
    <ellipse cx="1380" cy="620" rx="80" ry="24" fill="#33502f" opacity="0.8"/>
    <ellipse cx="1190" cy="640" rx="46" ry="16" fill="#3a5a3a" opacity="0.9"/>
    <ellipse cx="1240" cy="700" rx="60" ry="20" fill="#2f4d31" opacity="0.85"/>
    <ellipse cx="1180" cy="780" rx="55" ry="18" fill="#3a5a3a" opacity="0.9"/>
    <ellipse cx="1300" cy="800" rx="80" ry="24" fill="#2f4d31" opacity="0.85"/>
    <ellipse cx="1150" cy="860" rx="48" ry="16" fill="#33502f" opacity="0.9"/>
    <circle cx="1210" cy="580" r="14" fill="#7d7466"/>
    <circle cx="1290" cy="750" r="16" fill="#847a6a"/>
    <circle cx="1170" cy="720" r="12" fill="#7d7466"/>
  </g>
  <!-- hoop pines leaning out over the beach -->
  <g>
    <g class="sway" style="animation-duration:7s">
      <path d="M1166,448 L1150,420" stroke="#5b4632" stroke-width="5" stroke-linecap="round"/>
      <circle cx="1148" cy="408" r="17" fill="#3f6a41"/>
      <circle cx="1136" cy="402" r="12" fill="#4a784b"/>
    </g>
    <g class="sway2" style="animation-duration:8.5s">
      <path d="M1216,398 L1200,368" stroke="#5b4632" stroke-width="5" stroke-linecap="round"/>
      <circle cx="1196" cy="356" r="18" fill="#3f6a41"/>
      <circle cx="1184" cy="350" r="12" fill="#4a784b"/>
    </g>
    <g class="sway" style="animation-duration:6.2s">
      <path d="M1296,360 L1278,330" stroke="#5b4632" stroke-width="5" stroke-linecap="round"/>
      <circle cx="1274" cy="318" r="19" fill="#3a623c"/>
      <circle cx="1261" cy="312" r="13" fill="#457147"/>
    </g>
    <g class="sway2" style="animation-duration:9s">
      <path d="M1396,336 L1380,306" stroke="#5b4632" stroke-width="5" stroke-linecap="round"/>
      <circle cx="1376" cy="294" r="20" fill="#3f6a41"/>
      <circle cx="1362" cy="288" r="13" fill="#4a784b"/>
    </g>
    <g class="sway" style="animation-duration:7.6s">
      <path d="M1502,324 L1488,296" stroke="#5b4632" stroke-width="5" stroke-linecap="round"/>
      <circle cx="1486" cy="284" r="20" fill="#3a623c"/>
      <circle cx="1472" cy="278" r="13" fill="#457147"/>
    </g>
    <g class="sway2" style="animation-duration:8s">
      <path d="M1236,470 L1222,444" stroke="#5b4632" stroke-width="5" stroke-linecap="round"/>
      <circle cx="1220" cy="432" r="16" fill="#3f6a41"/>
      <circle cx="1209" cy="427" r="11" fill="#4a784b"/>
    </g>
    <g class="sway" style="animation-duration:6.8s">
      <path d="M1330,432 L1316,404" stroke="#5b4632" stroke-width="5" stroke-linecap="round"/>
      <circle cx="1314" cy="392" r="17" fill="#3a623c"/>
      <circle cx="1302" cy="386" r="11" fill="#457147"/>
    </g>
  </g>
  <!-- pandanus leaning out over the water -->
  <g stroke-linecap="round">
    <g class="sway2">
      <path d="M1198,462 C1192,486 1180,502 1164,514" stroke="#6d5b3e" stroke-width="6" fill="none"/>
      <g stroke="#4e7d4a" stroke-width="3.5" fill="none">
        <path d="M1164,514 Q1128,512 1104,534"/>
        <path d="M1164,514 Q1126,528 1108,552"/>
        <path d="M1164,514 Q1142,542 1130,566"/>
        <path d="M1164,514 Q1160,546 1156,572"/>
        <path d="M1164,514 Q1180,544 1186,568"/>
        <path d="M1164,514 Q1194,530 1196,556"/>
      </g>
    </g>
    <g class="sway" style="animation-duration:8s">
      <path d="M1252,424 C1246,448 1236,464 1222,476" stroke="#6d5b3e" stroke-width="6" fill="none"/>
      <g stroke="#4e7d4a" stroke-width="3.5" fill="none">
        <path d="M1222,476 Q1188,474 1166,494"/>
        <path d="M1222,476 Q1186,490 1170,514"/>
        <path d="M1222,476 Q1202,510 1192,532"/>
        <path d="M1222,476 Q1220,508 1218,532"/>
        <path d="M1222,476 Q1238,506 1244,528"/>
        <path d="M1222,476 Q1252,490 1254,516"/>
      </g>
    </g>
    <g class="sway2" style="animation-duration:6.4s">
      <path d="M1150,540 C1146,560 1138,574 1126,584" stroke="#6d5b3e" stroke-width="5.5" fill="none"/>
      <g stroke="#55854f" stroke-width="3.5" fill="none">
        <path d="M1126,584 Q1096,584 1076,602"/>
        <path d="M1126,584 Q1094,598 1080,620"/>
        <path d="M1126,584 Q1110,616 1102,636"/>
        <path d="M1126,584 Q1126,616 1126,638"/>
        <path d="M1126,584 Q1142,614 1148,634"/>
        <path d="M1126,584 Q1154,598 1158,622"/>
      </g>
    </g>
  </g>
  <!-- timber staircase dropping through the scrub onto the sand -->
  <g>
    <path d="M1210,470 Q1160,560 1136,640 Q1120,700 1100,742" stroke="#2c2318" stroke-width="30" fill="none" stroke-linecap="round"/>
