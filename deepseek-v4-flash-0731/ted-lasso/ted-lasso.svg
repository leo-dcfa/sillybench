<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Background -->
  <rect width="400" height="500" fill="#87CEEB" rx="10"/>

  <!-- Body -->
  <rect x="140" y="320" width="120" height="140" rx="10" fill="#1a5c2a"/>
  <rect x="140" y="320" width="120" height="30" rx="5" fill="#0d3d1a"/>
  <!-- AFC Richmond badge -->
  <circle cx="200" cy="350" r="15" fill="#0d3d1a" stroke="#FFD700" stroke-width="2"/>
  <text x="200" y="354" font-size="10" fill="#FFD700" text-anchor="middle" font-weight="bold">AFC</text>

  <!-- Arms -->
  <rect x="110" y="330" width="30" height="90" rx="10" fill="#1a5c2a"/>
  <rect x="260" y="330" width="30" height="90" rx="10" fill="#1a5c2a"/>

  <!-- Hands -->
  <circle cx="125" cy="425" r="12" fill="#f5c99a"/>
  <circle cx="275" cy="425" r="12" fill="#f5c99a"/>

  <!-- Playbook in left hand -->
  <rect x="108" y="410" width="35" height="45" rx="2" fill="#8B4513" transform="rotate(-10, 125, 425)"/>
  <rect x="111" y="413" width="29" height="39" rx="1" fill="#f5f0e0" transform="rotate(-10, 125, 425)"/>
  <line x1="115" y1="420" x2="133" y2="418" stroke="#333" stroke-width="1" transform="rotate(-10, 125, 425)"/>
  <line x1="115" y1="426" x2="133" y2="424" stroke="#333" stroke-width="1" transform="rotate(-10, 125, 425)"/>
  <line x1="115" y1="432" x2="130" y2="430" stroke="#333" stroke-width="1" transform="rotate(-10, 125, 425)"/>

  <!-- Neck -->
  <rect x="190" y="295" width="20" height="30" rx="3" fill="#f5c99a"/>

  <!-- Head -->
  <ellipse cx="200" cy="270" rx="55" ry="50" fill="#f5c99a"/>

  <!-- Ears -->
  <ellipse cx="145" cy="270" rx="10" ry="14" fill="#f5c99a"/>
  <ellipse cx="255" cy="270" rx="10" ry="14" fill="#f5c99a"/>
  <ellipse cx="145" cy="270" rx="5" ry="8" fill="#e8b88a"/>
  <ellipse cx="255" cy="270" rx="5" ry="8" fill="#e8b88a"/>

  <!-- Hair -->
  <ellipse cx="200" cy="235" rx="55" ry="35" fill="#4a3728"/>
  <ellipse cx="170" cy="225" rx="25" ry="20" fill="#5a4535"/>
  <ellipse cx="230" cy="225" rx="25" ry="20" fill="#5a4535"/>
  <ellipse cx="200" cy="220" rx="30" ry="18" fill="#5a4535"/>

  <!-- Mustache -->
  <ellipse cx="200" cy="285" rx="25" ry="6" fill="#4a3728"/>
  <ellipse cx="185" cy="283" rx="15" ry="5" fill="#5a4535"/>
  <ellipse cx="215" cy="283" rx="15" ry="5" fill="#5a4535"/>

  <!-- Eyes -->
  <ellipse cx="185" cy="265" rx="8" ry="9" fill="white"/>
  <ellipse cx="215" cy="265" rx="8" ry="9" fill="white"/>
  <circle cx="187" cy="264" r="4" fill="#3a6740"/>
  <circle cx="217" cy="264" r="4" fill="#3a6740"/>
  <circle cx="188" cy="263" r="2" fill="#1a1a1a"/>
  <circle cx="218" cy="263" r="2" fill="#1a1a1a"/>
  <circle cx="189" cy="261" r="1" fill="white"/>
  <circle cx="219" cy="261" r="1" fill="white"/>

  <!-- Eyebrows -->
  <path d="M172 253 Q185 248 195 253" stroke="#4a3728" stroke-width="3" fill="none"/>
  <path d="M205 253 Q215 248 228 253" stroke="#4a3728" stroke-width="3" fill="none"/>

  <!-- Nose -->
  <path d="M200 270 Q195 278 200 282 Q205 278 200 270" fill="#e8b88a"/>

  <!-- Smile -->
  <path d="M182 290 Q200 302 218 290" stroke="#c4756e" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nose wrinkle (laugh lines) -->
  <path d="M174 278 Q178 282 180 286" stroke="#e0a87a" stroke-width="1.5" fill="none"/>
  <path d="M226 278 Q222 282 220 286" stroke="#e0a87a" stroke-width="1.5" fill="none"/>

  <!-- Visor -->
  <ellipse cx="200" cy="218" rx="55" ry="8" fill="#2a1a0a" transform="rotate(-5, 200, 218)"/>
  <rect x="170" y="210" width="60" height="12" rx="3" fill="#3a2a1a" transform="rotate(-5, 200, 218)"/>
  <rect x="188" y="208" width="24" height="8" rx="2" fill="#3a2a1a" transform="rotate(-5, 200, 218)"/>

  <!-- Shorts -->
  <rect x="140" y="430" width="120" height="40" rx="5" fill="#1a5c2a"/>
  <rect x="140" y="430" width="120" height="10" fill="#0d3d1a"/>

  <!-- Legs -->
  <rect x="155" y="465" width="30" height="35" rx="5" fill="#f5c99a"/>
  <rect x="215" y="465" width="30" height="35" rx="5" fill="#f5c99a"/>

  <!-- Socks -->
  <rect x="153" y="470" width="34" height="15" rx="3" fill="white"/>
  <rect x="213" y="470" width="34" height="15" rx="3" fill="white"/>
  <rect x="153" y="470" width="34" height="5" rx="2" fill="#d32f2f"/>
  <rect x="213" y="470" width="34" height="5" rx="2" fill="#d32f2f"/>

  <!-- Shoes -->
  <ellipse cx="170" cy="503" rx="18" ry="6" fill="#2a2a2a"/>
  <ellipse cx="230" cy="503" rx="18" ry="6" fill="#2a2a2a"/>

  <!-- Whistle around neck -->
  <circle cx="200" cy="310" r="4" fill="#C0C0C0" stroke="#999" stroke-width="1"/>
  <path d="M196 310 Q190 305 192 298" stroke="#C0C0C0" stroke-width="2" fill="none"/>
  <circle cx="192" cy="296" r="2" fill="#C0C0C0"/>

  <!-- Lasso text/badge on chest -->
  <rect x="165" y="365" width="70" height="18" rx="3" fill="#FFD700" opacity="0.9"/>
  <text x="200" y="378" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-family="Arial">BELIEVE</text>

  <!-- Speech bubble -->
  <path d="M280 200 Q280 170 310 170 L350 170 Q370 170 370 190 Q370 210 350 210 L300 210 L285 225 L290 210 Z" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="325" y="190" font-size="9" fill="#333" text-anchor="middle" font-family="Arial" font-weight="bold">Believe!</text>
</svg>