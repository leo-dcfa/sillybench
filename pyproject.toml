[project]
name = "sillybench"
version = "0.1.0"
description = "Silly benchmarks to test models on."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12"]

[project.scripts]
sillybench = "harness.cli:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# the package is harness/ at the repo root, not src/sillybench/
[tool.uv.build-backend]
module-name = "harness"
module-root = ""
