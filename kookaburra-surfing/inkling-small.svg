<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%" aria-label="Kookaburra surfing a longboard">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB" />
      <stop offset="100%" stop-color="#E0F7FA" />
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DADE5F" />
      <stop offset="100%" stop-color="#2A7FDE" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="500" height="220" fill="url(#skyGrad)" />

  <!-- Sun -->
  <circle cx="420" cy="60" r="35" fill="#FFE066" opacity="0.9" />
  <circle cx="420" cy="60" r="50" fill="#FFE066" opacity="0.3" />

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.85">
    <ellipse cx="100" cy="70" rx="40" ry="15" />
    <ellipse cx="130" cy="80" rx="35" ry="12" />
    <ellipse cx="70" cy="80" rx="30" ry="10" />
    <ellipse cx="350" cy="50" rx="30" ry="10" />
    <ellipse cx="370" cy="55" rx="25" ry="8" />
  </g>

  <!-- Ocean -->
  <rect x="0" y="220" width="500" height="130" fill="url(#oceanGrad)" />

  <!-- Waves -->
  <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M-10,250 Q60,230 120,250 T240,250 T360,240 T480,250" />
    <path d="M-10,270 Q80,250 160,270 T320,270 T480,260" />
    <path d="M-10,290 Q100,270 200,290 T400,290" />
  </g>

  <!-- Longboard -->
  <g transform="rotate(-5 250 245)">
    <!-- Deck -->
    <rect x="120" y="240" width="260" height="30" rx="15" fill="#F4E1BC" stroke="#D49A6A" stroke-width="2" />
    <!-- Stripe -->
    <rect x="120" y="252" width="260" height="6" rx="3" fill="#4A90E2" />
    <!-- Nose curve -->
    <rect x="360" y="240" width="20" height="30" rx="15" fill="#F4E1BC" stroke="#D49A6A" stroke-width="2" />
    <!-- Tail curve -->
    <rect x="110" y="240" width="15" height="30" rx="7.5" fill="#F4E1BC" stroke="#D49A6A" stroke-width="2" />
    <!-- Fin -->
    <polygon points="220,240 235,210 250,240" fill="#2A7FDE" />
  </g>

  <!-- Kookaburra -->
  <g>
    <!-- Legs / Feet -->
    <line x1="245" y1="210" x2="245" y2="235" stroke="#5C3A21" stroke-width="3" stroke-linecap="round" />
    <line x1="275" y1="210" x2="275" y2="235" stroke="#5C3A21" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="245" cy="238" rx="10" ry="5" fill="#F5F0D8" transform="rotate(-5 245 238)" />
    <ellipse cx="275" cy="238" rx="10" ry="5" fill="#F5F0D8" transform="rotate(5 275 238)" />

    <!-- Tail -->
    <path d="M200,195 Q160,180 140,200 Q150,220 190,210 Z" fill="#6B3A2A" />

    <!-- Body -->
    <ellipse cx="255" cy="195" rx="42" ry="26" fill="#8B5A2B" />
    <!-- White belly -->
    <ellipse cx="255" cy="202" rx="22" ry="13" fill="#F5F5DC" />
    <!-- Wing -->
    <ellipse cx="215" cy="185" rx="14" ry="22" fill="#6B3A2A" transform="rotate(-15 215 185)" />

    <!-- Head -->
    <circle cx="295" cy="160" r="24" fill="#8B5A2B" />
    <!-- White eyebrow / crown stripe -->
    <path d="M278,150 Q290,140 305,148" stroke="#F5F5DC" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Eye -->
    <circle cx="302" cy="158" r="3.5" fill="#2A1A10" />
    <circle cx="303" cy="157" r="1" fill="#FFFFFF" />
    <!-- Beak -->
    <polygon points="320,162 345,168 322,174" fill="#E8962A" />
    <polygon points="322,174 345,168 330,178" fill="#C06A1B" opacity="0.3" />
    <!-- Head feather tuft -->
    <path d="M290,138 Q295,130 302,138" stroke="#6B3A2A" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Splash / Motion -->
  <g fill="#FFFFFF" opacity="0.7">
    <ellipse cx="100" cy="245" rx="15" ry="8" transform="rotate(-20 100 245)" />
    <ellipse cx="90" cy="255" rx="10" ry="5" transform="rotate(-10 90 255)" />
    <ellipse cx="400" cy="235" rx="12" ry="6" transform="rotate(15 400 235)" />
  </g>
</svg>
