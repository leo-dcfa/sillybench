<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Kookaburra surfing a longboard</title>
  <desc id="desc">A cartoon kookaburra with a big beak rides a coral longboard down the face of a curling ocean wave under a bright sunny sky.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb6dd"/>
      <stop offset="1" stop-color="#d7f2ff"/>
    </linearGradient>

    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d0"/>
      <stop offset="0.55" stop-color="#ffd97a"/>
      <stop offset="1" stop-color="#ffc247" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ea0c6"/>
      <stop offset="1" stop-color="#0a4a6e"/>
    </linearGradient>

    <linearGradient id="waveG" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#3ec6e0"/>
      <stop offset="1" stop-color="#137ba0"/>
    </linearGradient>

    <linearGradient id="boardG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a6a"/>
      <stop offset="0.5" stop-color="#ff6b3d"/>
      <stop offset="1" stop-color="#e8501f"/>
    </linearGradient>

    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b08046"/>
      <stop offset="1" stop-color="#6d4520"/>
    </linearGradient>

    <linearGradient id="bellyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9ea"/>
      <stop offset="1" stop-color="#efdcb6"/>
    </linearGradient>

    <linearGradient id="wingG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dd8f2"/>
      <stop offset="1" stop-color="#3d86bd"/>
    </linearGradient>

    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5147"/>
      <stop offset="1" stop-color="#241f1b"/>
    </linearGradient>
  </defs>

  <!-- ================= SKY ================= -->
  <rect width="800" height="340" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="655" cy="105" r="95" fill="url(#sun)"/>
  <circle cx="655" cy="105" r="46" fill="#ffe27a"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="90" rx="72" ry="26"/>
    <ellipse cx="205" cy="78" rx="52" ry="22"/>
    <ellipse cx="100" cy="82" rx="44" ry="19"/>
    <ellipse cx="565" cy="152" rx="60" ry="21"/>
    <ellipse cx="615" cy="144" rx="45" ry="19"/>
    <ellipse cx="520" cy="146" rx="34" ry="15"/>
  </g>

  <!-- ================= OCEAN ================= -->
  <rect y="330" width="800" height="270" fill="url(#ocean)"/>
  <rect y="330" width="800" height="2" fill="#c8ecf8" opacity="0.6"/>

  <!-- distant wave streaks -->
  <g stroke="#bfe8f5" stroke-width="3" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M60,352 C 100,350 140,352 175,351"/>
    <path d="M250,362 C 290,360 330,362 365,361"/>
    <path d="M480,368 C 520,366 560,368 595,367"/>
    <path d="M660,378 C 700,376 740,378 775,377"/>
  </g>

  <!-- back swell -->
  <path d="M0,600 L0,345 C 110,315 210,335 310,382 C 400,424 500,452 640,466 C 720,474 770,480 800,484 L800,600 Z"
        fill="#25a3c9"/>

  <!-- main wave -->
  <path d="M0,600 L0,368 C 120,340 200,352 290,398 C 380,444 470,470 600,482 C 700,491 760,498 800,502 L800,600 Z"
        fill="url(#waveG)"/>

  <!-- crest curl tendrils -->
  <g stroke="#ffffff" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M70,352 C 118,306 196,302 248,348" stroke-width="9"/>
    <path d="M112,340 C 158,314 212,320 248,358" stroke-width="6"/>
    <path d="M148,336 C 186,320 220,326 244,352" stroke-width="4"/>
  </g>

  <!-- foam line along the wave edge -->
  <path d="M0,368 C 120,340 200,352 290,398 C 380,444 470,470 600,482 C 700,491 760,498 800,502"
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.85"/>

  <!-- foam blobs -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="28" cy="364" r="10"/>
    <circle cx="56" cy="350" r="8"/>
    <circle cx="150" cy="342" r="7"/>
    <circle cx="255" cy="382" r="9"/>
    <circle cx="305" cy="404" r="7"/>
    <circle cx="345" cy="424" r="6"/>
    <circle cx="635" cy="484" r="8"/>
    <circle cx="700" cy="492" r="6"/>
  </g>

  <!-- spray in the air near crest -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="95" cy="300" r="5"/>
    <circle cx="128" cy="285" r="3.5"/>
    <circle cx="163" cy="292" r="3"/>
    <circle cx="196" cy="279" r="2.5"/>
    <circle cx="230" cy="300" r="3"/>
  </g>

  <!-- ================= LONGBOARD ================= -->
  <g>
    <!-- shadow on water -->
    <ellipse cx="424" cy="472" rx="172" ry="26" fill="#083a56" opacity="0.35"
             transform="rotate(7 424 472)"/>

    <!-- board -->
    <ellipse cx="420" cy="450" rx="178" ry="40" fill="url(#boardG)"
             transform="rotate(7 420 450)"/>

    <!-- deck stripe -->
    <ellipse cx="420" cy="450" rx="170" ry="8" fill="#fff3d6" opacity="0.9"
             transform="rotate(7 420 450)"/>
    <ellipse cx="420" cy="450" rx="168" ry="3" fill="#ffb37a" opacity="0.9"
             transform="rotate(7 420 450)"/>

    <!-- nose highlight -->
    <ellipse cx="575" cy="463" rx="24" ry="9" fill="#ffffff" opacity="0.35"
             transform="rotate(7 420 450)"/>

    <!-- fin -->
    <path d="M248,462 L256,506 L273,464 Z" fill="#c9431c"/>

    <!-- water lapping the board -->
    <path d="M252,470 C 330,494 520,496 585,478" fill="none"
          stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- ================= KOOKABURRA ================= -->
  <g>
    <!-- shadow of bird on board -->
    <ellipse cx="418" cy="412" rx="34" ry="7" fill="#000000" opacity="0.18"/>

    <!-- tail -->
    <path d="M368,380 C 344,404 314,446 298,486 C 322,470 356,438 386,402 C 380,394 374,386 368,380 Z"
          fill="#7a4f24"/>
    <g stroke="#5a3818" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round">
      <path d="M352,408 C 338,434 324,458 316,478"/>
      <path d="M368,402 C 356,430 344,456 336,478"/>
    </g>

    <!-- legs -->
    <path d="M398,392 L398,407" stroke="#e0913f" stroke-width="6" stroke-linecap="round"/>
    <path d="M430,394 L438,410" stroke="#e0913f" stroke-width="6" stroke-linecap="round"/>

    <!-- feet -->
    <g stroke="#e0913f" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M398,408 l-10,2"/>
      <path d="M398,408 l0,4"/>
      <path d="M398,408 l10,1"/>
      <path d="M438,411 l-10,2"/>
      <path d="M438,411 l0,4"/>
      <path d="M438,411 l10,1"/>
    </g>

    <!-- body -->
    <ellipse cx="408" cy="338" rx="52" ry="60" fill="url(#bodyG)"/>
    <!-- belly -->
    <ellipse cx="420" cy="345" rx="34" ry="44" fill="url(#bellyG)"/>

    <!-- wing -->
    <path d="M384,300 C 356,258 316,236 272,222 C 296,252 318,282 336,316
             C 350,342 366,360 386,368 C 380,342 380,320 384,300 Z"
          fill="url(#wingG)"/>
    <g stroke="#2c6c9e" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round">
      <path d="M330,262 C 342,290 356,320 372,344"/>
      <path d="M302,244 C 318,274 336,308 356,338"/>
    </g>
    <!-- brown shoulder coverts -->
    <ellipse cx="382" cy="312" rx="16" ry="24" fill="#8a5c2e" opacity="0.85"
             transform="rotate(-30 382 312)"/>

    <!-- head -->
    <circle cx="412" cy="272" r="38" fill="url(#bodyG)"/>

    <!-- dark eye stripe -->
    <path d="M446,258 C 420,246 392,246 372,252" fill="none"
          stroke="#4a2c10" stroke-width="9" stroke-linecap="round"/>

    <!-- cream face -->
    <ellipse cx="430" cy="284" rx="26" ry="24" fill="url(#bellyG)"/>

    <!-- true eye -->
    <circle cx="428" cy="268" r="6.5" fill="#241a12"/>
    <circle cx="426" cy="265.5" r="2" fill="#ffffff"/>

    <!-- beak -->
    <path d="M436,256 C 480,252 520,266 550,284 C 520,294 480,299 438,294 Z" fill="url(#beakG)"/>
    <path d="M440,275 C 480,276 515,280 548,284" fill="none"
          stroke="#131110" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="466" cy="264" r="2.2" fill="#1c1815"/>
  </g>

  <!-- ================= FOREGROUND WATER & SPRAY ================= -->
  <path d="M0,600 L0,520 C 120,500 260,512 400,532 C 540,552 680,556 800,548 L800,600 Z"
        fill="#1b8fb4"/>
  <path d="M0,520 C 120,500 260,512 400,532 C 540,552 680,556 800,548"
        fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.75"/>

  <!-- spray around the board -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="600" cy="440" r="5"/>
    <circle cx="622" cy="452" r="3.5"/>
    <circle cx="586" cy="453" r="3"/>
    <circle cx="637" cy="467" r="2.5"/>
    <circle cx="248" cy="498" r="6"/>
    <circle cx="232" cy="512" r="4"/>
    <circle cx="266" cy="512" r="3"/>
  </g>

  <!-- sun sparkles on water -->
  <g fill="#ffffff" opacity="0.5">
    <ellipse cx="700" cy="380" rx="14" ry="3"/>
    <ellipse cx="740" cy="398" rx="10" ry="2.5"/>
    <ellipse cx="672" cy="410" rx="8" ry="2"/>
  </g>
</svg>
