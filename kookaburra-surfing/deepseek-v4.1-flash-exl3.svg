<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A kookaburra riding a longboard on a breaking wave">
  <defs>
    <!-- SKY -->
    <linearGradient id="skyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="330">
      <stop offset="0" stop-color="#2E86C1"/>
      <stop offset="0.40" stop-color="#79C7E3"/>
      <stop offset="0.78" stop-color="#FAD79B"/>
      <stop offset="1" stop-color="#FDEBC9"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF7D6" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFE9A8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <!-- SEA -->
    <linearGradient id="oceanGrad" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="600">
      <stop offset="0" stop-color="#2AA0C6"/>
      <stop offset="1" stop-color="#08314A"/>
    </linearGradient>
    <linearGradient id="waveGrad" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="600">
      <stop offset="0" stop-color="#B7EEF7"/>
      <stop offset="0.35" stop-color="#57C9E3"/>
      <stop offset="1" stop-color="#10739F"/>
    </linearGradient>
    <linearGradient id="foreGrad" gradientUnits="userSpaceOnUse" x1="0" y1="460" x2="0" y2="600">
      <stop offset="0" stop-color="#3CB6D6"/>
      <stop offset="1" stop-color="#0A4A68"/>
    </linearGradient>
    <!-- BOARD -->
    <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC14D"/>
      <stop offset="0.45" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#F2545B"/>
    </linearGradient>
    <linearGradient id="railGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE0AE"/>
      <stop offset="1" stop-color="#C9541F"/>
    </linearGradient>
    <!-- BIRD -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#BE8C5C"/>
      <stop offset="1" stop-color="#83552F"/>
    </linearGradient>
    <linearGradient id="wingFarGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5D35"/>
      <stop offset="1" stop-color="#B98B58"/>
    </linearGradient>
    <linearGradient id="wingNearGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#C79E6D"/>
      <stop offset="1" stop-color="#946639"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FCF7EA"/>
      <stop offset="1" stop-color="#E7DAC0"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C5A56"/>
      <stop offset="1" stop-color="#2B2926"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9AE72"/>
      <stop offset="1" stop-color="#B98A4E"/>
    </linearGradient>
  </defs>

  <!-- ================= SKY ================= -->
  <rect x="0" y="0" width="800" height="330" fill="url(#skyGrad)"/>

  <!-- sun -->
  <circle cx="140" cy="108" r="120" fill="url(#sunGlow)"/>
  <circle cx="140" cy="108" r="48" fill="#FFF3C9"/>
  <circle cx="140" cy="108" r="36" fill="#FFE58F"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.72">
    <ellipse cx="255" cy="78" rx="62" ry="21"/>
    <ellipse cx="300" cy="70" rx="42" ry="16"/>
    <ellipse cx="212" cy="72" rx="38" ry="14"/>
    <ellipse cx="470" cy="128" rx="54" ry="18"/>
    <ellipse cx="512" cy="120" rx="34" ry="13"/>
    <ellipse cx="690" cy="180" rx="46" ry="15"/>
    <ellipse cx="722" cy="173" rx="30" ry="11"/>
  </g>

  <!-- distant birds -->
  <g fill="none" stroke="#5A6B78" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M330 168 q10 -9 20 0 q10 -9 20 0"/>
    <path d="M392 186 q7 -6 14 0 q7 -6 14 0"/>
  </g>

  <!-- ================= SEA ================= -->
  <rect x="0" y="290" width="800" height="310" fill="url(#oceanGrad)"/>

  <!-- horizon light -->
  <rect x="0" y="288" width="800" height="6" fill="#FFE8B8" opacity="0.5"/>

  <!-- distant swells -->
  <path d="M0 322 Q120 308 260 316 Q420 326 560 318 Q700 310 800 320 L800 360 L0 360 Z"
        fill="#4DB8D6" opacity="0.45"/>

  <!-- ================= MAIN WAVE ================= -->
  <path d="M-10 248
           C 60 242 120 262 180 296
           C 260 330 340 352 460 364
           C 580 376 680 392 800 408
           L 800 600 L -10 600 Z"
        fill="url(#waveGrad)"/>

  <!-- darker barrel shadow on the face -->
  <path d="M 120 600 C 130 470 200 340 400 316 C 300 356 230 430 215 600 Z"
        fill="#0C5F86" opacity="0.28"/>

  <!-- foam along the crest -->
  <path d="M-10 248 C 60 242 120 262 180 296 C 260 330 340 352 460 364 C 580 376 680 392 800 408"
        fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="0.9"/>
  <path d="M-10 248 C 60 242 120 262 180 296 C 260 330 340 352 460 364 C 580 376 680 392 800 408"
        fill="none" stroke="#D6F5FF" stroke-width="26" stroke-linecap="round" opacity="0.28"/>

  <!-- foam cap on the curl -->
  <path d="M -10 248 C 60 242 120 262 180 296 C 140 302 90 292 45 280 C 18 272 -2 260 -10 248 Z"
        fill="#FFFFFF" opacity="0.85"/>

  <!-- whitewater churn -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="30" cy="276" r="14"/>
    <circle cx="62" cy="270" r="10"/>
    <circle cx="92" cy="278" r="13"/>
    <circle cx="126" cy="290" r="11"/>
    <circle cx="158" cy="302" r="12"/>
    <circle cx="196" cy="318" r="10"/>
    <circle cx="234" cy="332" r="9"/>
    <circle cx="286" cy="346" r="8"/>
  </g>

  <!-- airborne spray -->
  <g fill="#FFFFFF" opacity="0.75">
    <circle cx="14" cy="222" r="6"/>
    <circle cx="38" cy="206" r="4"/>
    <circle cx="60" cy="214" r="5"/>
    <circle cx="88" cy="230" r="4"/>
    <circle cx="112" cy="244" r="3"/>
  </g>

  <!-- flow streaks down the face -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.45">
    <path d="M150 520 C 175 460 200 400 236 356"/>
    <path d="M250 560 C 275 490 300 430 336 380"/>
    <path d="M370 590 C 390 520 410 460 440 416"/>
    <path d="M560 600 C 590 530 620 470 660 430"/>
    <path d="M700 590 C 720 540 745 490 780 452"/>
  </g>

  <!-- ================= FOREGROUND WAVE ================= -->
  <path d="M0 600 L0 494
           C 120 470 260 466 400 482
           C 540 498 680 516 800 526
           L 800 600 Z"
        fill="url(#foreGrad)"/>
  <path d="M0 494 C 120 470 260 466 400 482 C 540 498 680 516 800 526"
        fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.4">
    <path d="M60 546 C 110 528 170 518 240 514"/>
    <path d="M330 552 C 400 536 470 528 540 530"/>
    <path d="M620 556 C 680 546 740 544 790 548"/>
  </g>

  <!-- ================= SURFER ================= -->
  <!-- splash behind the board -->
  <g fill="#FFFFFF" opacity="0.75">
    <ellipse cx="450" cy="358" rx="70" ry="16" transform="rotate(-8 450 358)"/>
    <circle cx="404" cy="336" r="13"/>
    <circle cx="384" cy="326" r="9"/>
    <circle cx="428" cy="344" r="10"/>
    <circle cx="466" cy="352" r="12"/>
    <circle cx="500" cy="358" r="9"/>
    <circle cx="366" cy="314" r="6"/>
    <circle cx="346" cy="304" r="4"/>
  </g>

  <!-- ---------- LONGBOARD ---------- -->
  <g transform="translate(600,364) rotate(7)">
    <!-- deck -->
    <path d="M -190 0
             C -190 -14 -160 -15 -120 -15
             L 130 -15
             C 172 -15 190 -9 190 0
             C 190 9 172 15 130 15
             L -120 15
             C -160 15 -190 14 -190 0 Z"
          fill="url(#boardGrad)"/>
    <!-- rail (bottom edge highlight) -->
    <path d="M -186 8 C -150 13 -100 15 -40 15 L 128 15 C 165 15 186 9 190 0"
          fill="none" stroke="url(#railGrad)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <!-- center stripe -->
    <path d="M -176 0 L 176 0" fill="none" stroke="#FFF7E8" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <!-- deck detail -->
    <path d="M -150 -10 L 150 -10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <path d="M -150 10 L 150 10" fill="none" stroke="#8A2B14" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- ---------- KOOKABURRA ---------- -->
  <g transform="translate(572,346) rotate(5) scale(0.85)">

    <!-- shadow on deck -->
    <ellipse cx="0" cy="4" rx="46" ry="7" fill="#3A1A0A" opacity="0.18"/>

    <!-- far wing (spread up and back) -->
    <path d="M -24 -98
             C -70 -124 -112 -162 -145 -200
             C -108 -188 -68 -160 -40 -128
             C -27 -114 -23 -104 -24 -98 Z"
          fill="url(#wingFarGrad)"/>
    <g fill="none" stroke="#6E4726" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <path d="M -32 -106 C -62 -128 -96 -156 -122 -184"/>
      <path d="M -28 -104 C -54 -124 -84 -150 -108 -178"/>
    </g>
    <!-- blue wing patch -->
    <path d="M -34 -104 C -52 -116 -72 -134 -86 -152 C -70 -146 -52 -134 -38 -118 C -33 -112 -32 -107 -34 -104 Z"
          fill="#5B9BD5" opacity="0.85"/>

    <!-- tail -->
    <path d="M -38 -58
             C -78 -46 -118 -30 -148 -12
             L -140 2
             C -108 -16 -70 -30 -34 -38 Z"
          fill="#8A5C38"/>
    <g fill="none" stroke="#5E3C22" stroke-width="3" stroke-linecap="round" opacity="0.65">
      <path d="M -40 -50 C -76 -40 -110 -26 -136 -12"/>
      <path d="M -40 -44 C -74 -34 -106 -22 -132 -8"/>
    </g>

    <!-- far leg + foot -->
    <path d="M -14 -40 L -20 0" fill="none" stroke="#B98A4E" stroke-width="9" stroke-linecap="round"/>
    <g transform="translate(-20,0)" fill="none" stroke="#B98A4E" stroke-width="6" stroke-linecap="round">
      <path d="M0 0 L30 4"/>
      <path d="M0 0 L28 -6"/>
      <path d="M0 0 L26 12"/>
      <path d="M0 0 L-24 6"/>
    </g>

    <!-- body -->
    <ellipse cx="2" cy="-86" rx="58" ry="50" fill="url(#bodyGrad)" transform="rotate(-10 2 -86)"/>

    <!-- cream belly -->
    <ellipse cx="20" cy="-74" rx="37" ry="35" fill="#F8F1DE" transform="rotate(-12 20 -74)"/>
    <path d="M 20 -109 C 42 -109 58 -94 58 -74 C 58 -54 42 -39 20 -39 C 4 -39 -6 -52 -6 -74 C -6 -96 4 -109 20 -109 Z"
          fill="#F8F1DE" opacity="0.0"/>

    <!-- brown breast barring hint -->
    <g fill="none" stroke="#B08A5E" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <path d="M -2 -62 C 14 -58 34 -60 50 -66"/>
      <path d="M 0 -50 C 16 -46 34 -48 48 -54"/>
    </g>

    <!-- near leg + foot -->
    <path d="M 20 -40 L 16 0" fill="none" stroke="url(#legGrad)" stroke-width="9" stroke-linecap="round"/>
    <g transform="translate(16,0)" fill="none" stroke="#D9AE72" stroke-width="6" stroke-linecap="round">
      <path d="M0 0 L30 4"/>
      <path d="M0 0 L28 -6"/>
      <path d="M0 0 L26 12"/>
      <path d="M0 0 L-24 6"/>
    </g>

    <!-- head -->
    <circle cx="26" cy="-150" r="42" fill="url(#headGrad)"/>

    <!-- dark eye stripe -->
    <path d="M 8 -148 C 22 -158 40 -164 56 -162" fill="none" stroke="#6B4423" stroke-width="9"
          stroke-linecap="round" opacity="0.9"/>

    <!-- brown crown -->
    <path d="M -16 -152
             C -14 -180 2 -194 26 -194
             C 50 -194 66 -182 68 -158
             C 56 -176 40 -184 24 -184
             C 6 -184 -8 -172 -16 -152 Z"
          fill="#8B5E3C"/>

    <!-- beak -->
    <path d="M 54 -166 C 86 -169 110 -159 120 -147 C 104 -148 82 -145 54 -141 Z" fill="url(#beakGrad)"/>
    <path d="M 54 -141 C 82 -145 104 -148 120 -147 C 104 -138 82 -134 54 -135 Z" fill="#3A3835"/>
    <path d="M 54 -141 C 82 -145 104 -148 120 -147" fill="none" stroke="#6E6B66" stroke-width="2" opacity="0.7"/>

    <!-- eye -->
    <circle cx="40" cy="-162" r="8.5" fill="#241E14"/>
    <circle cx="43" cy="-165" r="2.8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="37" cy="-159" r="1.4" fill="#FFFFFF" opacity="0.5"/>

    <!-- near wing (spread forward) -->
    <path d="M 28 -104
             C 68 -108 108 -98 148 -80
             C 128 -72 96 -78 62 -92
             C 42 -100 30 -104 28 -104 Z"
          fill="url(#wingNearGrad)"/>
    <g fill="none" stroke="#7A5130" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <path d="M 42 -100 C 72 -92 102 -86 128 -80"/>
      <path d="M 40 -94 C 68 -86 96 -80 120 -76"/>
    </g>
    <!-- blue wing patch -->
    <path d="M 60 -98 C 80 -94 100 -88 118 -82 C 104 -78 88 -82 72 -88 C 64 -92 60 -96 60 -98 Z"
          fill="#5B9BD5" opacity="0.85"/>
  </g>
</svg>
