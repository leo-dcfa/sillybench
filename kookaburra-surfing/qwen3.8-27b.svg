<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Kookaburra surfing a longboard</title>
  <desc>A blue and cinnamon kookaburra crouches on a coral longboard, riding a curling ocean wave under a sunny sky.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9be0"/>
      <stop offset="0.7" stop-color="#8ed0f2"/>
      <stop offset="1" stop-color="#d9f2fc"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9fd8"/>
      <stop offset="1" stop-color="#0a518d"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38b1ee"/>
      <stop offset="1" stop-color="#0d6cb4"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <g>
    <circle cx="688" cy="84" r="54" fill="#ffd95e" opacity="0.3"/>
    <circle cx="688" cy="84" r="40" fill="#ffd95e"/>
    <g stroke="#ffd95e" stroke-width="6" stroke-linecap="round">
      <line x1="740" y1="84" x2="754" y2="84"/>
      <line x1="724.8" y1="120.8" x2="735.4" y2="131.4"/>
      <line x1="688" y1="136" x2="688" y2="150"/>
      <line x1="651.2" y1="120.8" x2="640.6" y2="131.4"/>
      <line x1="636" y1="84" x2="622" y2="84"/>
      <line x1="651.2" y1="47.2" x2="640.6" y2="36.6"/>
      <line x1="688" y1="32" x2="688" y2="18"/>
      <line x1="724.8" y1="47.2" x2="735.4" y2="36.6"/>
    </g>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff">
    <g opacity="0.95">
      <ellipse cx="150" cy="98" rx="48" ry="17"/>
      <circle cx="126" cy="88" r="15"/>
      <circle cx="152" cy="80" r="20"/>
      <circle cx="180" cy="90" r="13"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="420" cy="72" rx="38" ry="13"/>
      <circle cx="402" cy="64" r="12"/>
      <circle cx="424" cy="57" r="15"/>
      <circle cx="444" cy="66" r="10"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="575" cy="155" rx="30" ry="10"/>
      <circle cx="562" cy="148" r="9"/>
      <circle cx="580" cy="144" r="12"/>
    </g>
  </g>

  <!-- Gulls -->
  <g stroke="#4f7ea3" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 236 148 C 244 140 254 140 260 146 C 266 140 276 140 284 147"/>
    <path d="M 300 120 C 306 114 314 114 319 119 C 324 114 332 114 338 119"/>
  </g>

  <!-- Sea -->
  <rect x="0" y="388" width="800" height="212" fill="url(#sea)"/>
  <rect x="0" y="388" width="800" height="6" fill="#9fe0f7" opacity="0.55"/>
  <g stroke="#bfe9f9" stroke-width="4" stroke-linecap="round" opacity="0.25" fill="none">
    <path d="M -10 505 C 150 490 300 512 460 520 C 580 526 690 518 810 524"/>
    <path d="M -10 560 C 140 548 300 566 470 572 C 600 576 700 570 810 574"/>
  </g>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.3" fill="none">
    <line x1="672" y1="468" x2="716" y2="470"/>
    <line x1="730" y1="498" x2="768" y2="500"/>
    <line x1="636" y1="526" x2="684" y2="530"/>
    <line x1="706" y1="556" x2="752" y2="558"/>
  </g>

  <!-- Big wave -->
  <path d="M -10 610 L -10 330 C 20 235 85 158 190 148 C 290 140 330 215 312 262 C 302 288 268 296 246 280 C 320 320 420 375 520 415 C 600 445 710 452 810 450 L 810 610 Z" fill="url(#wave)"/>
  <path d="M -8 330 C 22 235 88 158 190 148 C 262 141 306 174 312 220 C 314 238 310 250 302 258" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="140" cy="152" r="9"/>
    <circle cx="172" cy="144" r="11"/>
    <circle cx="206" cy="148" r="10"/>
    <circle cx="240" cy="162" r="9"/>
    <circle cx="272" cy="184" r="8"/>
    <circle cx="297" cy="212" r="7"/>
    <circle cx="309" cy="246" r="8"/>
    <circle cx="300" cy="264" r="9"/>
    <circle cx="282" cy="278" r="7"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M 330 315 C 420 360 500 400 590 428" stroke-width="6" opacity="0.45"/>
    <path d="M 292 300 C 360 345 430 390 505 425" stroke-width="5" opacity="0.3"/>
    <path d="M 520 418 C 565 428 610 434 655 438" stroke-width="5" opacity="0.4"/>
  </g>
  <g fill="#ffffff" opacity="0.6">
    <circle cx="345" cy="332" r="4"/>
    <circle cx="378" cy="354" r="3.5"/>
    <circle cx="415" cy="378" r="3"/>
  </g>

  <!-- Wake behind the board -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M 306 440 C 240 450 150 448 60 438 C 30 435 4 438 -8 442" stroke-width="7" opacity="0.55"/>
    <path d="M 296 454 C 220 464 140 460 60 450" stroke-width="4" opacity="0.35"/>
  </g>

  <!-- Board shadow -->
  <ellipse cx="462" cy="432" rx="150" ry="11" fill="#07395f" opacity="0.35"/>

  <!-- Longboard -->
  <g transform="translate(455 415) rotate(-6)">
    <path d="M -46 11 L -20 11 L -30 24 Z" fill="#d95536"/>
    <path d="M -140 0 C -140 -6 -128 -11 -96 -14 C -30 -19 60 -17 118 -10 C 138 -7 152 -4 158 -1 C 159 0 159 1 158 2 C 148 6 128 9 96 11 C 30 14 -40 13 -96 10 C -128 8 -140 4 -140 0 Z" fill="#ff7a54"/>
    <path d="M -62 -15 L -62 13 C -90 12 -118 9 -133 5 C -138 3 -140 1 -140 0 C -140 -6 -128 -11 -96 -14 C -84 -15 -73 -15 -62 -15 Z" fill="#ffe8cf"/>
    <line x1="-132" y1="0" x2="152" y2="0" stroke="#f2b48c" stroke-width="3" opacity="0.8"/>
    <circle cx="-15" cy="0" r="9" fill="#ffe8cf"/>
    <path d="M -21 1 C -17 -3 -12 -3 -9 0 C -12 3 -17 3 -21 1 Z" fill="#ff7a54"/>
    <path d="M 88 -12 L 98 11 M 104 -11 L 114 10" stroke="#ffe8cf" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Foam along the board's waterline -->
  <path d="M 312 447 C 400 436 520 419 620 415" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.7"/>

  <!-- Kookaburra -->
  <g>
    <!-- Far wing held out for balance -->
    <path d="M 485 312 C 445 288 395 265 345 256 C 332 253 326 262 335 269 C 372 292 425 312 468 326 Z" fill="#3a629c"/>
    <!-- Tail -->
    <path d="M 402 368 C 375 362 345 348 326 330 C 322 325 326 318 333 320 C 355 328 382 338 405 344 Z" fill="#4a7bb5"/>
    <g stroke="#d8e6f2" stroke-width="5" stroke-linecap="round">
      <line x1="352" y1="333" x2="362" y2="322"/>
      <line x1="370" y1="343" x2="380" y2="331"/>
    </g>
    <!-- Legs and webbed feet -->
    <g stroke="#c9822f" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M 432 372 C 424 382 421 390 422 398"/>
      <path d="M 468 368 C 478 376 484 382 485 390"/>
    </g>
    <g fill="#5d452f">
      <path d="M 411 406 L 437 406 L 430 398 L 418 398 Z"/>
      <path d="M 474 399 L 500 399 L 493 391 L 481 391 Z"/>
    </g>
    <g stroke="#3f2f20" stroke-width="1.5">
      <line x1="420" y1="406" x2="422" y2="399"/>
      <line x1="427" y1="406" x2="428" y2="399"/>
      <line x1="484" y1="399" x2="486" y2="392"/>
      <line x1="491" y1="399" x2="492" y2="392"/>
    </g>
    <!-- Body -->
    <path d="M 497 300 C 512 318 512 352 492 372 C 474 389 444 394 418 386 C 396 379 384 360 388 340 C 391 322 404 308 424 300 C 448 290 480 290 497 300 Z" fill="#fdf6ec"/>
    <!-- Blue back -->
    <path d="M 388 340 C 391 322 404 308 424 300 C 448 290 480 290 497 300 C 506 309 510 322 506 334 C 478 318 444 320 416 332 C 404 338 394 344 388 340 Z" fill="#4a7bb5"/>
    <!-- Folded wing -->
    <path d="M 494 310 C 502 320 500 336 486 346 C 460 362 422 358 400 344 C 391 338 391 328 400 322 C 428 308 470 302 494 310 Z" fill="#3a629c"/>
    <g fill="none" stroke="#bcd2ea" stroke-width="4" stroke-linecap="round">
      <path d="M 472 316 C 452 330 428 336 408 334" opacity="0.9"/>
      <path d="M 480 328 C 460 342 434 348 414 344" opacity="0.7"/>
    </g>
    <!-- White neck ring -->
    <ellipse cx="521" cy="301" rx="23" ry="10" fill="#fdf6ec" transform="rotate(-14 521 301)"/>
    <!-- Head -->
    <path d="M 508 288 C 504 264 518 247 538 246 C 559 245 570 261 568 281 C 566 300 550 310 532 308 C 518 306 511 300 508 288 Z" fill="#a9713c"/>
    <g fill="none" stroke="#7c4e22" stroke-width="3" stroke-linecap="round" opacity="0.45">
      <path d="M 516 259 C 526 251 544 249 557 255"/>
      <path d="M 513 270 C 526 260 549 258 563 266"/>
    </g>
    <!-- Beak -->
    <path d="M 558 290 C 578 292 594 297 604 302 C 607 306 603 310 596 308 C 580 303 566 298 556 296 C 554 294 555 291 558 290 Z" fill="#5f4636"/>
    <path d="M 560 268 C 584 264 602 277 610 291 C 612 296 607 299 601 297 C 585 291 568 288 557 289 C 554 281 556 272 560 268 Z" fill="#46332a"/>
    <!-- Eye -->
    <circle cx="535" cy="271" r="7.5" fill="#ffffff"/>
    <circle cx="538" cy="272.5" r="3.8" fill="#33241a"/>
    <circle cx="536.2" cy="269.8" r="1.4" fill="#ffffff"/>
  </g>

  <!-- Spray and splash -->
  <g fill="#ffffff">
    <path d="M 612 402 Q 632 392 652 397 Q 636 406 620 412 Z" opacity="0.9"/>
    <circle cx="632" cy="394" r="6" opacity="0.9"/>
    <circle cx="644" cy="384" r="4.5" opacity="0.85"/>
    <circle cx="654" cy="374" r="3" opacity="0.8"/>
    <path d="M 320 436 Q 298 428 282 432 Q 296 442 312 446 Z" opacity="0.85"/>
    <circle cx="300" cy="428" r="5.5" opacity="0.85"/>
    <circle cx="289" cy="418" r="4" opacity="0.8"/>
    <circle cx="280" cy="408" r="2.5" opacity="0.75"/>
  </g>
</svg>
