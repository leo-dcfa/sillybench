  <!-- leaping fish -->
  <path d="M600 384 Q612 358 622 344" fill="none" stroke="#cfeefa" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  <path d="M610 336 C618 328 630 328 636 336 C630 344 618 344 610 336 Z" fill="#ff9f43" stroke="#d97b26" stroke-width="1.5"/>
  <path d="M610 336 L601 329 L603 341 Z" fill="#ff9f43" stroke="#d97b26" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="628" cy="334" r="1.4" fill="#333333"/>
  <circle cx="614" cy="352" r="2.5" fill="#e8f7ff" opacity="0.9"/>
  <circle cx="628" cy="348" r="2" fill="#e8f7ff" opacity="0.9"/>

  <!-- wake behind the board -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M274 466 C240 468 208 476 180 494" stroke-width="7" opacity="0.85"/>
    <path d="M276 471 C252 473 230 479 210 491" stroke-width="4" opacity="0.6"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
