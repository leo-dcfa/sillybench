  <path d="M278 459 C344 453 412 447 470 444 C540 440 600 428 646 418"
        fill="none" stroke="#bff3ec" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <ellipse cx="449" cy="449" rx="26" ry="3" fill="#0a6e64" opacity="0.5"/>

  <!-- kookaburra -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- raised back wing -->
    <path d="M424 376 C404 366 382 348 366 328 C356 316 348 306 343 299 C338 293 342 287 349 291 C359 297 371 309 381 321 C395 337 412 354 428 366 C434 371 432 378 424 376 Z"
