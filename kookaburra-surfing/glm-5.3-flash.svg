    <circle cx="224" cy="474" r="4.5"/>
    <circle cx="198" cy="485" r="5"/>
    <circle cx="174" cy="500" r="4"/>
    <circle cx="158" cy="514" r="3"/>
  </g>
  <circle cx="672" cy="408" r="3" fill="#ffffff" opacity="0.85"/>
  <circle cx="686" cy="402" r="2" fill="#ffffff" opacity="0.85"/>

