<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>A kookaburra surfing a longboard on a wave</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CC9EC"/>
      <stop offset="55%" stop-color="#A9E1F6"/>
      <stop offset="100%" stop-color="#FBEBC2"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A8FC4"/>
      <stop offset="100%" stop-color="#135E96"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BC0E8"/>
      <stop offset="100%" stop-color="#2E86C1"/>
    </linearGradient>
  </defs>

  <!-- sky, sun, clouds -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="95" r="58" fill="#FFD97A" opacity="0.35"/>
  <circle cx="680" cy="95" r="36" fill="#FFD34E"/>
  <g fill="#FFFFFF" opacity="0.85">
    <ellipse cx="140" cy="88" rx="55" ry="16"/>
    <ellipse cx="110" cy="78" rx="30" ry="13"/>
    <ellipse cx="165" cy="76" rx="28" ry="12"/>
    <ellipse cx="380" cy="62" rx="34" ry="10"/>
    <ellipse cx="362" cy="55" rx="18" ry="8"/>
    <ellipse cx="398" cy="54" rx="16" ry="7"/>
    <ellipse cx="560" cy="132" rx="40" ry="12"/>
    <ellipse cx="538" cy="124" rx="22" ry="10"/>
    <ellipse cx="582" cy="122" rx="20" ry="9"/>
  </g>
  <g stroke="#5E8FAD" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M236 96 Q243 89 250 96 Q257 89 264 96"/>
    <path d="M268 108 Q274 102 280 108 Q286 102 292 108"/>
  </g>

  <!-- ocean -->
  <rect x="0" y="260" width="800" height="340" fill="url(#sea)"/>
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M60 285 h40"/>
    <path d="M640 290 h50"/>
    <path d="M720 276 h40"/>
    <path d="M580 305 h30"/>
  </g>

  <!-- big breaking wave -->
  <path d="M-20 480 L-20 330 C40 240 85 170 155 142 C215 120 258 168 264 215
           C268 248 246 264 222 258 C252 252 292 292 330 325 C395 375 470 405 560 425
           C640 442 730 445 820 432 L820 480 Z" fill="url(#wave)"/>
  <path d="M250 268 C300 300 350 330 420 358" stroke="#9FE0F5" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M232 288 C280 315 330 342 390 368" stroke="#9FE0F5" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.45"/>
  <path d="M244 214 C246 236 232 250 216 246" stroke="#A9E2F7" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- crest foam and spray -->
  <path d="M118 152 C175 122 240 150 258 210 C264 238 252 258 232 262" stroke="#FFFFFF" stroke-width="13" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M124 158 C176 132 232 156 250 208" stroke="#E8F8FF" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
  <g fill="#FFFFFF">
    <circle cx="125" cy="152" r="9"/><circle cx="150" cy="141" r="8"/>
    <circle cx="175" cy="136" r="9"/><circle cx="200" cy="138" r="8"/>
    <circle cx="222" cy="148" r="8"/><circle cx="240" cy="165" r="8"/>
    <circle cx="252" cy="187" r="8"/><circle cx="258" cy="210" r="8"/>
    <circle cx="258" cy="232" r="8"/><circle cx="248" cy="252" r="8"/>
    <circle cx="234" cy="262" r="7"/>
  </g>
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="285" cy="150" r="4"/><circle cx="305" cy="168" r="5"/>
    <circle cx="322" cy="190" r="4"/><circle cx="298" cy="132" r="3"/>
    <circle cx="330" cy="152" r="3"/><circle cx="287" cy="185" r="3"/>
    <circle cx="342" cy="176" r="3"/><circle cx="310" cy="205" r="4"/>
  </g>

  <!-- whitewater trailing behind the board -->
  <g fill="#FFFFFF" opacity="0.92">
    <circle cx="250" cy="420" r="16"/><circle cx="275" cy="432" r="14"/>
    <circle cx="300" cy="440" r="15"/><circle cx="325" cy="448" r="13"/>
    <circle cx="230" cy="440" r="12"/><circle cx="255" cy="455" r="10"/>
    <circle cx="285" cy="458" r="9"/><circle cx="310" cy="462" r="8"/>
    <circle cx="205" cy="455" r="8"/><circle cx="350" cy="452" r="10"/>
    <circle cx="185" cy="445" r="6"/><circle cx="225" cy="470" r="6"/>
    <circle cx="260" cy="472" r="5"/>
  </g>
  <g fill="#D7F3FC" opacity="0.8">
    <circle cx="240" cy="430" r="6"/><circle cx="290" cy="450" r="7"/><circle cx="215" cy="462" r="5"/>
  </g>

  <!-- longboard fin -->
  <path d="M398 410 C396 424 388 438 374 446 C380 434 381 422 378 410 Z"
        fill="#E76F51" stroke="#B34A33" stroke-width="2"/>

  <!-- longboard -->
  <path d="M652 346 C620 352 560 362 500 374 C448 384 395 396 346 408
           C336 411 336 418 348 421 C400 414 460 402 500 388
           C545 372 600 362 654 357 C662 355 662 348 652 346 Z"
        fill="#F4EBD9" stroke="#6B4A2F" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M350 413 C450 391.5 550 370.5 645 350.5" stroke="#2BA8A0" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M350 408 C450 386.5 550 365.5 645 345.5" stroke="#E76F51" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M350 418 C450 396.5 550 375.5 645 355.5" stroke="#E76F51" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="452" cy="390" rx="52" ry="6" fill="#3E2614" opacity="0.1" transform="rotate(-12 452 390)"/>

  <!-- kookaburra -->
  <g>
    <!-- far leg -->
    <path d="M448 348 L446 371" stroke="#7E6E56" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M446 376 L459 382 M446 376 L457 384 M446 376 L436 384" stroke="#7E6E56" stroke-width="4" stroke-linecap="round"/>
    <!-- tail -->
    <path d="M430 318 C402 322 376 334 358 352 C351 359 349 366 352 372 C365 373 381 367 395 357 C413 344 425 330 432 320 Z"
          fill="#8A5A32" stroke="#3E2614" stroke-width="2" stroke-linejoin="round"/>
    <path d="M352 372 C365 373 381 367 395 357 C390 364 383 370 374 373 C366 375 358 375 352 372 Z" fill="#4A2E17"/>
    <path d="M374 352 Q380 357 387 360 M388 342 Q394 347 401 350" stroke="#C97B4A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
    <!-- far wing tip -->
    <path d="M430 282 C420 278 408 277 398 280 C402 286 412 290 422 291 C426 289 429 286 430 282 Z" fill="#6B4423"/>
    <!-- body -->
    <path d="M468 254 C482 262 490 276 492 294 C494 316 486 336 468 346 C452 355 432 352 422 340
             C414 330 412 316 416 302 C420 286 430 268 446 258 C452 254 462 252 468 254 Z"
          fill="#FDF8EE" stroke="#3E2614" stroke-width="2"/>
    <path d="M446 258 C430 268 420 286 416 302 C412 316 414 330 422 340 C425 344 430 347 434 348
             C430 330 432 308 440 290 C446 276 454 266 464 258 C458 255 451 255 446 258 Z" fill="#8A5A32"/>
    <!-- near wing, thrown out for balance -->
    <path d="M458 272 C424 262 388 250 360 250 C350 250 346 258 353 264 C384 272 416 283 444 297 C452 290 458 282 458 272 Z"
          fill="#7A4E2B" stroke="#3E2614" stroke-width="2" stroke-linejoin="round"/>
    <path d="M448 268 C418 258 390 250 368 250 C362 250 360 255 365 258 C394 264 422 277 444 289 C448 283 450 276 448 268 Z"
          fill="#5D7FA8" opacity="0.9"/>
    <path d="M366 252 L374 262 M378 250 L386 263 M390 250 L398 264" stroke="#3A5A7E" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <!-- head -->
    <circle cx="486" cy="232" r="29" fill="#FDF8EE" stroke="#3E2614" stroke-width="2"/>
    <path d="M512 220 C508 206 498 200 486 200 C470 200 458 212 457 236 C462 238 466 238 470 236
             C470 224 476 216 486 215 C494 214 502 217 506 224 Z" fill="#6E4526"/>
    <path d="M508 224 C502 222 498 222 494 224 C486 227 480 230 474 236 C470 240 464 242 459 240
             C458 244 458 248 460 252 C468 254 476 250 482 244 C488 238 496 234 504 232 C508 231 511 228 508 224 Z"
          fill="#4A2A12"/>
    <circle cx="494" cy="228" r="4.2" fill="#26160C"/>
    <circle cx="495.5" cy="226.5" r="1.3" fill="#FFFFFF"/>
    <!-- big kookaburra beak -->
    <path d="M510 214 C536 218 560 228 574 242 C575 245 573 247 569 247 L512 242 C508 240 507 224 510 214 Z"
          fill="#3B2A1E" stroke="#2A1A10" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M512 242 L566 247 C560 254 546 258 530 256 C520 255 513 250 511 246 Z" fill="#9A8878"/>
    <circle cx="524" cy="221" r="1.2" fill="#1E120A"/>
    <!-- near leg -->
    <path d="M464 346 L474 366" stroke="#A09074" stroke-width="7" stroke-linecap="round"/>
    <path d="M474 371 L488 377 M474 371 L486 379 M474 371 L463 377" stroke="#A09074" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- foreground foam -->
  <g fill="#FFFFFF" opacity="0.95">
    <circle cx="352" cy="448" r="9"/><circle cx="326" cy="456" r="8"/>
    <circle cx="296" cy="452" r="7"/><circle cx="368" cy="452" r="7"/>
    <circle cx="600" cy="452" r="9"/><circle cx="638" cy="446" r="7"/>
    <circle cx="672" cy="452" r="6"/>
  </g>
  <path d="M380 470 C460 480 540 480 620 470" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
