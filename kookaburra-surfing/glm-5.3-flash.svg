    <path d="M158 246 C140 240 124 246 110 258" stroke-width="3"/>
    <path d="M170 230 C152 222 136 226 122 236" stroke-width="2.5"/>
  </g>

  <!-- whitewater at the wave base -->
  <path d="M776 448 C640 458 500 454 396 472 C296 490 190 532 118 586"
        fill="none" stroke="#eef9ff" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
  <g fill="#eef9ff" opacity="0.9">
    <circle cx="742" cy="452" r="6"/>
    <circle cx="660" cy="456" r="6"/>
    <circle cx="560" cy="454" r="5"/>
    <circle cx="470" cy="458" r="5"/>
    <circle cx="400" cy="472" r="6"/>
    <circle cx="330" cy="486" r="6"/>
    <circle cx="256" cy="504" r="6"/>
    <circle cx="196" cy="528" r="6"/>
    <circle cx="148" cy="556" r="6"/>
    <circle cx="116" cy="582" r="5"/>
    <circle cx="90" cy="600" r="7"/>
