<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d">
  <title id="t">Kookaburra surfing a longboard</title>
  <desc id="d">A cartoon kookaburra with outstretched wings rides a teal longboard down the face of a rolling blue wave under a sunny sky.</desc>

  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58b7e6"/>
      <stop offset="0.45" stop-color="#9ed2ef"/>
      <stop offset="0.8" stop-color="#d5eef8"/>
      <stop offset="1" stop-color="#ffe3b3"/>
    </linearGradient>
    <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9fd4"/>
      <stop offset="1" stop-color="#0b5688"/>
    </linearGradient>
    <linearGradient id="waveG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45b7e8"/>
      <stop offset="0.55" stop-color="#1e86c2"/>
      <stop offset="1" stop-color="#0d5e96"/>
    </linearGradient>
    <linearGradient id="boardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35cab9"/>
      <stop offset="1" stop-color="#0f9e90"/>
    </linearGradient>
    <linearGradient id="birdG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf7e8"/>
      <stop offset="1" stop-color="#ecd9b8"/>
    </linearGradient>
    <linearGradient id="wingG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a06f42"/>
      <stop offset="1" stop-color="#7a4d2b"/>
    </linearGradient>
    <radialGradient id="sunG">
      <stop offset="0" stop-color="#fff7cf"/>
      <stop offset="0.4" stop-color="#ffefa0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky & sun -->
  <rect x="0" y="0" width="900" height="302" fill="url(#skyG)"/>
  <circle cx="770" cy="108" r="72" fill="url(#sunG)"/>
  <circle cx="770" cy="108" r="34" fill="#ffd75e"/>

  <!-- clouds -->
  <g fill="#ffffff">
    <g opacity="0.95">
      <ellipse cx="196" cy="96" rx="30" ry="13"/>
      <ellipse cx="232" cy="88" rx="34" ry="16"/>
      <ellipse cx="268" cy="97" rx="26" ry="11"/>
    </g>
    <g opacity="0.9">
      <ellipse cx="556" cy="64" rx="26" ry="11"/>
      <ellipse cx="588" cy="58" rx="30" ry="13"/>
      <ellipse cx="620" cy="66" rx="22" ry="10"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="96" cy="176" rx="24" ry="10"/>
      <ellipse cx="124" cy="170" rx="26" ry="12"/>
    </g>
  </g>

  <!-- gulls -->
  <g fill="none" stroke="#607383" stroke-linecap="round">
    <path d="M596 128 C602 122 608 122 612 128 C616 122 622 122 628 128" stroke-width="2.5"/>
    <path d="M648 156 C653 151 658 151 662 156 C666 151 671 151 676 156" stroke-width="2"/>
  </g>

  <!-- sea -->
  <rect x="0" y="300" width="900" height="300" fill="url(#seaG)"/>
  <path d="M736 300 L806 300 L850 600 L692 600 Z" fill="#ffe9a8" opacity="0.12"/>
  <g fill="none" stroke="#bfe9fa" stroke-linecap="round" opacity="0.6">
    <path d="M792 372 C826 366 858 366 884 370" stroke-width="2.5"/>
    <path d="M806 396 C838 391 866 391 888 395" stroke-width="2.5"/>
  </g>
  <path d="M806 352 C816 344 830 344 838 352 C842 357 840 362 834 364" fill="none" stroke="#e8f7ff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <circle cx="842" cy="357" r="3" fill="#e8f7ff" opacity="0.85"/>
  <g fill="none" stroke="#0a4f7e" stroke-linecap="round" opacity="0.5">
    <path d="M700 520 C760 514 820 514 872 518" stroke-width="3"/>
    <path d="M660 560 C730 554 800 554 868 558" stroke-width="3"/>
    <path d="M340 560 C420 554 500 554 570 558" stroke-width="3"/>
  </g>

  <!-- distant island with palm -->
  <path d="M62 302 C84 278 122 274 150 298 C158 302 166 302 166 302 L62 302 Z" fill="#2f7f5f"/>
  <path d="M112 296 C114 284 118 272 126 262" fill="none" stroke="#4a3728" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="none" stroke="#3f9b6e" stroke-width="3.5" stroke-linecap="round">
    <path d="M126 262 C118 254 108 252 100 256"/>
    <path d="M126 262 C120 252 118 244 122 238"/>
    <path d="M126 262 C128 252 134 246 142 244"/>
    <path d="M126 262 C134 256 144 254 152 258"/>
    <path d="M126 262 C124 252 126 244 132 240"/>
  </g>
  <circle cx="123" cy="264" r="2" fill="#4a3728"/>
  <circle cx="130" cy="265" r="2" fill="#4a3728"/>

