    <path d="M420 368 C408 360 398 350 392 340 C402 346 412 356 420 364 Z" fill="#55a4e6" opacity="0.85"/>

    <!-- tail -->
    <path d="M410 402 C396 408 380 416 368 426 C364 429 365 434 371 434 C387 431 404 423 416 415 C420 412 418 404 410 402 Z"
          fill="#7a4d2b" stroke="#4a3222" stroke-width="2.5"/>
    <path d="M376 426 C386 420 396 414 404 409" fill="none" stroke="#55a4e6" stroke-width="2.5" opacity="0.8"/>

    <!-- body -->
    <ellipse cx="430" cy="388" rx="31" ry="28" transform="rotate(-14 430 388)" fill="url(#birdG)" stroke="#4a3222" stroke-width="3"/>
    <path d="M414 406 Q420 410 426 406 M421 412 Q427 416 433 412" fill="none" stroke="#dcc7a0" stroke-width="2" opacity="0.8"/>

    <!-- legs & feet -->
    <path d="M430 410 Q424 426 436 445 M452 412 Q464 426 462 444" fill="none" stroke="#7a5230" stroke-width="5.5"/>
    <ellipse cx="436" cy="446" rx="8" ry="3" fill="#7a5230" stroke="#4a3222" stroke-width="1.4"/>
    <ellipse cx="462" cy="445" rx="8" ry="3" fill="#7a5230" stroke="#4a3222" stroke-width="1.4"/>
    <path d="M429 447 L425 449 M436 448 L436 450 M443 447 L447 449 M455 446 L451 448 M462 447 L462 449 M469 446 L473 448"
          fill="none" stroke="#4a3222" stroke-width="1.6"/>

    <!-- forward wing -->
    <path d="M444 384 C462 370 484 348 502 326 C512 314 520 304 526 298 C531 294 535 298 532 305 C527 318 518 334 506 346 C494 358 476 372 460 388 C452 393 444 391 444 384 Z"
          fill="url(#wingG)" stroke="#4a3222" stroke-width="3"/>
    <path d="M530 300 C526 312 519 324 511 334 M519 316 C513 326 506 334 498 344"
          fill="none" stroke="#5f3a1c" stroke-width="2" opacity="0.55"/>
    <path d="M452 380 C462 370 472 358 480 348 C474 360 466 372 456 380 Z" fill="#55a4e6" opacity="0.85"/>

    <!-- neck & big head -->
    <circle cx="454" cy="360" r="15" fill="#f8efdb"/>
    <circle cx="470" cy="338" r="27" fill="url(#birdG)" stroke="#4a3222" stroke-width="3"/>
    <path d="M446 326 C450 312 460 306 472 307 C482 308 489 314 490 322 C480 316 468 315 458 320 C453 322 449 324 446 326 Z"
          fill="#8a5a33" stroke="#4a3222" stroke-width="2"/>
    <g fill="none" stroke="#8a5a33" stroke-width="4">
      <path d="M452 310 Q450 298 456 292"/>
      <path d="M462 306 Q462 294 469 290"/>
      <path d="M472 306 Q476 295 483 293"/>
      <path d="M481 310 Q488 301 494 300"/>
    </g>
    <!-- dark eye-stripe -->
    <path d="M488 334 C478 324 460 324 450 334" fill="none" stroke="#5d3a1e" stroke-width="11"/>
    <circle cx="472" cy="331" r="5.5" fill="#ffffff" stroke="#4a3222" stroke-width="1.4"/>
    <circle cx="474" cy="331.5" r="2.7" fill="#241812"/>
    <circle cx="475.5" cy="329.6" r="1" fill="#ffffff"/>

    <!-- heavy beak -->
    <path d="M486 324 C502 324 522 329 540 336 C543 337.5 542 340 538 340.5 L488 341 Z"
          fill="#4a4a4a" stroke="#2c2c2c" stroke-width="1.5"/>
    <path d="M488 342 C502 344 518 344 532 341.5 C534 344 531 347 526 348 C512 350.5 496 349 488 345 Z"
          fill="#303030" stroke="#2c2c2c" stroke-width="1.2"/>
    <path d="M488 341 L538 340" stroke="#1d1d1d" stroke-width="1"/>
    <circle cx="496" cy="328" r="1.2" fill="#1f1f1f"/>

    <!-- kookaburra laugh -->
    <g fill="none" stroke="#ffd166" stroke-width="2.5" opacity="0.85">
      <path d="M549 327 Q560 338 549 349"/>
      <path d="M558 320 Q574 338 558 356"/>
    </g>
  </g>
</svg>
