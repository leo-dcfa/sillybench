  <path d="M-20 620 L-20 438
           C44 406 116 348 162 278
           C182 246 218 236 238 254
           C256 270 258 292 244 304
           C234 312 218 315 206 311
           C200 309 196 304 197 298
           C232 322 292 346 356 352
           C446 372 556 396 664 414
           C700 421 740 434 776 444
           C640 456 500 452 396 470
           C296 488 190 530 118 584
           L64 620 Z" fill="url(#waveG)"/>
  <path d="M206 306 C224 316 246 314 254 298 C256 314 246 328 228 330 C214 331 206 320 206 306 Z" fill="#0a5a90" opacity="0.5"/>
  <g fill="none" stroke="#5fc0ea" stroke-linecap="round">
    <path d="M300 362 C360 378 430 392 500 404" stroke-width="3" opacity="0.5"/>
    <path d="M262 382 C330 402 410 418 480 430" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- foam on the wave face -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="262" cy="330" r="4"/>
    <circle cx="296" cy="342" r="3.5"/>
    <circle cx="332" cy="352" r="3.5"/>
    <circle cx="372" cy="360" r="3"/>
    <circle cx="412" cy="370" r="3"/>
    <circle cx="452" cy="380" r="3"/>
    <circle cx="520" cy="398" r="3"/>
  </g>

