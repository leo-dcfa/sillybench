<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Drop shadow for a pop-out flat vector effect -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="6" stdDeviation="0" flood-color="#1A1A1A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <g id="background">
    <!-- Sky -->
    <rect width="800" height="800" fill="#4FC3F7" />
    
    <!-- Sun -->
    <circle cx="150" cy="150" r="80" fill="#FFEB3B" stroke="#1A1A1A" stroke-width="8" filter="url(#shadow)" />
    
    <!-- Clouds -->
    <g id="clouds" filter="url(#shadow)">
      <!-- Cloud 1 (Top Right) -->
      <path d="M 550,150 C 550,100 600,90 630,110 C 650,60 730,60 750,110 C 800,100 800,160 750,170 L 550,170 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />
      <!-- Cloud 2 (Middle Left) -->
      <path d="M 120,300 C 120,260 160,250 180,270 C 200,230 260,230 280,270 C 320,260 320,310 280,320 L 120,320 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />
    </g>
  </g>

  <!-- BACK WAVE (The curl behind the surfer) -->
  <g id="back-wave" filter="url(#shadow)">
    <path d="M 600,450 C 750,550 750,750 750,750 L 400,750 C 400,650 450,550 600,450 Z" fill="#0096C7" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- SURFER (Kookaburra & Surfboard) -->
  <g id="surfer" filter="url(#shadow)">
    
    <!-- Surfboard -->
    <path d="M 280,600 C 350,630 550,630 680,550 C 720,530 730,550 700,570 C 580,650 380,670 280,600 Z" fill="#FFF3E0" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />
    <!-- Surfboard Stripe -->
    <path d="M 300,610 C 400,640 550,630 660,560" fill="none" stroke="#FF3D00" stroke-width="8" stroke-linecap="round" />
    <!-- Surfboard Fin -->
    <path d="M 580,630 L 560,660 L 600,630 Z" fill="#FF3D00" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />

    <!-- Bird Back Leg (Behind Board) -->
    <path d="M 400,580 L 420,610 L 450,600" fill="none" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bird Legs (Front) -->
    <path d="M 350,560 L 360,600 L 390,590" fill="none" stroke="#FF9800" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 420,580 L 440,620 L 470,610" fill="none" stroke="#FF9800" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bird Tail -->
    <path d="M 320,580 L 220,620 L 240,650 L 320,620 Z" fill="#FFC107" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />
    <!-- Tail Stripes -->
    <line x1="260" y1="625" x2="280" y2="640" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" />
    <line x1="280" y1="615" x2="300" y2="630" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" />

    <!-- Bird Body -->
    <path d="M 380,350 C 430,330 470,380 460,480 C 450,580 400,620 350,600 C 300,580 300,450 380,350 Z" fill="#FFC107" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Bird Belly -->
    <path d="M 380,450 C 420,450 440,500 430,560 C 420,600 380,600 360,580 C 340,550 350,480 380,450 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />

    <!-- Bird Wing (Overlapping the wave) -->
    <path d="M 380,420 C 340,450 320,520 350,560 C 380,600 420,580 440,520 C 450,480 420,440 380,420 Z" fill="#FF9800" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />

    <!-- Bird Neck -->
    <path d="M 380,350 C 400,280 440,260 470,280 C 490,300 470,350 430,380 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />

    <!-- Bird Head -->
    <path d="M 420,260 C 420,200 500,200 530,240 C 560,280 520,330 460,330 C 420,330 420,280 420,260 Z" fill="#FFC107" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Head Crest -->
    <path d="M 460,210 L 480,170 L 510,210 Z" fill="#FFC107" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />

    <!-- Eye Patch -->
    <path d="M 470,240 C 490,230 510,250 510,270 C 510,290 490,300 470,280 Z" fill="#1A1A1A" />
    <!-- Eye -->
    <circle cx="490" cy="255" r="8" fill="#FFFFFF" />
    <circle cx="492" cy="255" r="3" fill="#1A1A1A" />

    <!-- Beak -->
    <path d="M 510,260 C 560,250 590,280 580,300 C 570,320 530,320 500,300 Z" fill="#FF9800" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />
    <!-- Beak Highlight -->
    <path d="M 520,265 C 540,260 560,270 570,280" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

    <!-- Red Life Vest -->
    <!-- Back strap -->
    <path d="M 430,360 C 450,380 450,480 430,500" fill="none" stroke="#FF3D00" stroke-width="16" stroke-linecap="round" />
    <!-- Main vest body -->
    <path d="M 380,380 C 420,360 450,400 450,460 C 450,520 400,540 370,520 C 340,500 350,420 380,380 Z" fill="#FF3D00" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />
    <!-- Vest cutout -->
    <path d="M 390,420 C 410,410 430,430 430,460 C 430,490 410,500 390,480 C 370,460 370,430 390,420 Z" fill="#FFC107" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round" />
    <!-- Buckle -->
    <rect x="405" y="445" width="16" height="20" rx="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="6" />
    <line x1="405" y1="455" x2="421" y2="455" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- FRONT WAVE (Overlapping the surfboard and legs) -->
  <g id="front-wave" filter="url(#shadow)">
    <path d="M -50,500 C 150,350 400,300 600,450 C 750,550 750,750 750,750 L -50,750 Z" fill="#00B4D8" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- SPLASHES & WATER DETAILS -->
  <g id="splashes" filter="url(#shadow)">
    
    <!-- Foam Line on Wave -->
    <path d="M -50,500 C 150,350 400,300 600,450" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.8" />
    
    <!-- Water Droplets (Left Splash) -->
    <circle cx="250" cy="480" r="15" fill="#00B4D8" stroke="#1A1A1A" stroke-width="6" />
    <circle cx="220" cy="440" r="10" fill="#00B4D8" stroke="#1A1A1A" stroke-width="6" />
    <circle cx="280" cy="430" r="18" fill="#00B4D8" stroke="#1A1A1A" stroke-width="6" />
    <circle cx="310" cy="470" r="8" fill="#00B4D8" stroke="#1A1A1A" stroke-width="6" />
    <path d="M 260,460 Q 270,420 280,430 Q 270,440 260,460 Z" fill="#00B4D8" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round" />

    <!-- Water Droplets (Right Splash / Impact) -->
    <circle cx="650" cy="520" r="20" fill="#00B4D8" stroke="#1A1A1A" stroke-width="6" />
    <circle cx="700" cy="480" r="14" fill="#00B4D8" stroke="#1A1A1A" stroke-width="6" />
    <circle cx="620" cy="470" r="12" fill="#00B4D8" stroke="#1A1A1A" stroke-width="6" />
    <circle cx="730" cy="540" r="10" fill="#00B4D8" stroke="#1A1A1A" stroke-width="6" />
    <path d="M 640,500 Q 660,450 680,460 Q 660,480 640,500 Z" fill="#00B4D8" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Stylized Spray from the Nose of the Board -->
    <path d="M 680,550 C 720,500 780,480 820,520 C 780,550 720,580 680,550 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round" />
    <path d="M 690,540 C 730,490 780,470 810,500 C 770,530 730,550 690,540 Z" fill="#00B4D8" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round" />

  </g>
</svg>
