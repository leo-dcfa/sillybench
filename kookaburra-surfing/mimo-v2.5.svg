<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Gradients for water and sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#006994;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
    </linearGradient>
    <!-- Wood texture for the board -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D2B48C" />
      <stop offset="50%" style="stop-color:#DEB887" />
      <stop offset="100%" style="stop-color:#C19A6B" />
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="100%" height="100%" fill="url(#skyGrad)" />

  <!-- The Wave -->
  <path d="M0,220 Q50,160 100,200 T200,180 T300,220 T400,190 L400,300 L0,300 Z" fill="#006994" opacity="0.8" />
  <path d="M-20,250 Q80,200 150,240 T300,230 T420,200 L420,300 L-20,300 Z" fill="url(#waterGrad)" />
  
  <!-- Foam/Splash line -->
  <path d="M30,210 Q50,200 70,210 T110,210 T150,210 T190,210 T230,210" stroke="white" stroke-width="2" fill="none" opacity="0.7" />

  <!-- The Longboard -->
  <path d="M120,210 Q160,215 200,215 T280,210 Q260,220 120,220 Z" fill="url(#boardGrad)" stroke="#8B4513" stroke-width="2" />
  <!-- Board center line -->
  <line x1="130" y1="215" x2="270" y2="215" stroke="#CD853F" stroke-width="1.5" />
  <!-- Board Fin -->
  <path d="M250,220 L255,230 L265,225 Z" fill="#8B4513" />

  <!-- The Kookaburra (Standing on board) -->
  <g transform="translate(170, 195) scale(0.8)">
    <!-- Feet -->
    <line x1="-10" y1="15" x2="-10" y2="20" stroke="#555" stroke-width="2" />
    <line x1="10" y1="15" x2="10" y2="20" stroke="#555" stroke-width="2" />
    
    <!-- Tail -->
    <path d="M-20,5 L-35,-10 L-30,0 Z" fill="#8B4513" />
    
    <!-- Body (Brown) -->
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#8B4513" />
    
    <!-- Belly (White) -->
    <ellipse cx="2" cy="2" rx="15" ry="10" fill="#F5F5DC" />
    
    <!-- Wings (Flapping for balance) -->
    <path d="M10,-10 Q25,-20 40,-10 Q25,-12 10,-5 Z" fill="#7B3F00" />
    <path d="M-10,-10 Q-25,-20 -40,-10 Q-25,-12 -10,-5 Z" fill="#7B3F00" />
    
    <!-- Head -->
    <ellipse cx="15" cy="-12" rx="12" ry="10" fill="#8B4513" />
    
    <!-- Eye Stripe (Black keyhole shape typical of Kookaburra) -->
    <path d="M10,-15 Q15,-20 20,-15 Q15,-10 10,-15 Z" fill="#222" />
    <!-- Eye -->
    <circle cx="17" cy="-12" r="2.5" fill="black" />
    <circle cx="17.5" cy="-12.5" r="0.8" fill="white" />
    
    <!-- Beak (Big and sturdy) -->
    <path d="M22,-12 L38,-10 L35,-15 Z" fill="#333" />
    <!-- Beak highlight -->
    <path d="M22,-12 L38,-10 L28,-11 Z" fill="#555" />
  </g>

  <!-- Water Splash effects around feet -->
  <circle cx="150" cy="222" r="2" fill="white" opacity="0.9" />
  <circle cx="170" cy="225" r="3" fill="white" opacity="0.9" />
  <circle cx="190" cy="223" r="2" fill="white" opacity="0.9" />
  <path d="M140,220 Q145,215 150,220" stroke="white" stroke-width="2" fill="none" />
  <path d="M200,225 Q205,218 210,225" stroke="white" stroke-width="2" fill="none" />
  
  <!-- Sun -->
  <circle cx="320" cy="60" r="30" fill="#FFD700" opacity="0.5" />
  <circle cx="320" cy="60" r="22" fill="#FFD700" />
</svg>
