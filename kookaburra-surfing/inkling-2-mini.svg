<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Kookaburra surfing a longboard</title>
  <desc id="desc">A cheerful cartoon laughing kookaburra crouched on a longboard, riding a wave under a bright sun.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ec2f6"/>
      <stop offset="1" stop-color="#d8f3ff"/>
    </linearGradient>
    <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe3"/>
      <stop offset="0.6" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffc94d"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="405" x2="0" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fd1d9"/>
      <stop offset="1" stop-color="#0b6f92"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="-18" x2="0" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7ce8d"/>
      <stop offset="1" stop-color="#dd9a4e"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="-8" x2="0" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#e0305b"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="820" height="620" fill="url(#sky)"/>

  <!-- Sun -->
  <g>
    <circle cx="140" cy="105" r="92" fill="#ffe27a" opacity="0.35"/>
    <g stroke="#ffd54d" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <line x1="140" y1="29" x2="140" y2="8"/>
      <line x1="140" y1="29" x2="140" y2="8" transform="rotate(45 140 105)"/>
      <line x1="140" y1="29" x2="140" y2="8" transform="rotate(90 140 105)"/>
      <line x1="140" y1="29" x2="140" y2="8" transform="rotate(135 140 105)"/>
      <line x1="140" y1="29" x2="140" y2="8" transform="rotate(180 140 105)"/>
      <line x1="140" y1="29" x2="140" y2="8" transform="rotate(225 140 105)"/>
      <line x1="140" y1="29" x2="140" y2="8" transform="rotate(270 140 105)"/>
      <line x1="140" y1="29" x2="140" y2="8" transform="rotate(315 140 105)"/>
    </g>
    <circle cx="140" cy="105" r="52" fill="url(#sunG)"/>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="612" cy="94" rx="44" ry="20"/>
    <ellipse cx="642" cy="86" rx="30" ry="17"/>
    <ellipse cx="582" cy="88" rx="26" ry="15"/>
  </g>
  <g fill="#ffffff" opacity="0.9" transform="translate(330,62) scale(0.72)">
    <ellipse cx="0" cy="8" rx="44" ry="20"/>
    <ellipse cx="30" cy="0" rx="30" ry="17"/>
    <ellipse cx="-30" cy="2" rx="26" ry="15"/>
  </g>

  <!-- Birds -->
  <path d="M 545 132 q 9 -9 18 0 q 9 -9 18 0" fill="none" stroke="#26343b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 600 168 q 7 -7 14 0 q 7 -7 14 0" fill="none" stroke="#26343b" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Ocean -->
  <rect x="0" y="405" width="820" height="215" fill="url(#water)"/>
  <rect x="0" y="400" width="820" height="6" fill="#e6fbff" opacity="0.55"/>

  <!-- Sun reflection -->
  <rect x="112" y="424" width="56" height="5" rx="2.5" fill="#ffffff" opacity="0.25"/>
  <rect x="120" y="452" width="40" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
  <rect x="112" y="482" width="56" height="4" rx="2" fill="#ffffff" opacity="0.18"/>
  <rect x="125" y="515" width="32" height="4" rx="2" fill="#ffffff" opacity="0.15"/>

  <!-- Waves -->
  <path d="M -20 448 q 55 -16 110 0 t 110 0 t 110 0 t 110 0 t 110 0 t 110 0 t 110 0" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.38"/>
  <path d="M -40 512 q 55 -16 110 0 t 110 0 t 110 0 t 110 0 t 110 0 t 110 0" fill="none" stroke="#bdeef7" stroke-width="4" opacity="0.4"/>
  <path d="M -20 585 q 80 -22 160 0 t 160 0 t 160 0 t 160 0 t 160 0" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.3"/>

  <!-- Board shadow -->
  <ellipse cx="425" cy="505" rx="240" ry="11" fill="#093f58" opacity="0.3"/>

  <!-- Longboard + Kookaburra -->
  <g transform="translate(420,470) rotate(13)">
    <rect x="-290" y="-18" width="580" height="36" rx="18" fill="url(#deck)" stroke="#8a5a24" stroke-width="3"/>
    <line x1="-272" y1="-11" x2="272" y2="-11" stroke="#fff6e0" stroke-width="2.5" opacity="0.85"/>
    <line x1="-272" y1="11" x2="272" y2="11" stroke="#fff6e0" stroke-width="2.5" opacity="0.85"/>
    <rect x="-279" y="-8" width="558" height="16" fill="url(#band)"/>
    <g transform="translate(-262,0)">
      <path d="M0,-6.5 L1.9,-2.1 L6.1,-2.1 L2.7,0.9 L4.2,5.2 L0,2.8 L-4.2,5.2 L-2.7,0.9 L-6.1,-2.1 L-1.9,-2.1 Z" fill="#fff6e0"/>
    </g>
    <circle cx="262" cy="0" r="4.5" fill="#fff6e0"/>
    <text x="0" y="4.5" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="13" font-weight="800" letter-spacing="2.5" fill="#fff6e0">KOKABURRA LONGBOARD</text>

    <!-- Kookaburra -->
    <g transform="translate(-18,-16)">
      <ellipse cx="0" cy="0" rx="34" ry="7" fill="#7a4a1e" opacity="0.35"/>

      <!-- Tail -->
      <path d="M 26,-152 Q 108,-146 124,-88 Q 72,-96 30,-112 Z" fill="#2e2119"/>
      <path d="M 104,-102 Q 124,-88 118,-70 Q 98,-80 90,-86 Z" fill="#f3e3cd"/>

      <!-- Legs -->
      <path d="M -10,-58 L -24,-2" stroke="#f08a3c" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M 12,-58 L 26,-2" stroke="#f08a3c" stroke-width="9" stroke-linecap="round" fill="none"/>

      <!-- Body -->
      <ellipse cx="2" cy="-122" rx="50" ry="60" transform="rotate(-8 2 -122)" fill="#7a5230"/>
      <ellipse cx="-14" cy="-104" rx="34" ry="48" transform="rotate(-8 -14 -104)" fill="#fff8ef"/>

      <!-- Wing -->
      <path d="M -2,-166 C 52,-178 88,-150 96,-92 C 56,-82 -4,-96 -16,-122 C -20,-142 -12,-158 -2,-166 Z" fill="#6d4527"/>
      <path d="M 10,-150 C 44,-152 68,-132 76,-104" fill="none" stroke="#f6e3c8" stroke-width="7" stroke-linecap="round"/>
      <path d="M 4,-126 C 34,-126 58,-108 68,-88" fill="none" stroke="#f6e3c8" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

      <!-- Head -->
      <g transform="translate(-14,-186) rotate(-7)">
        <circle cx="0" cy="0" r="33" fill="#fff8ef"/>
        <path d="M 18,-26 q 6,-11 14,-12" fill="none" stroke="#2b241e" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 6,-29 q 3,-11 11,-14" fill="none" stroke="#2b241e" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M -30,-10 A 30 30 0 0 1 30,-10" fill="none" stroke="#2b241e" stroke-width="13" stroke-linecap="round"/>
        <path d="M -30,7 Q 0,12 30,5" fill="none" stroke="#2b241e" stroke-width="8" stroke-linecap="round"/>
        <path d="M -26,-12 L -97,2 L -26,10 Z" fill="#2b241e"/>
        <path d="M -88,4 L -26,10 L -26,20 Z" fill="#f6a83c"/>
        <circle cx="-9" cy="5" r="7.5" fill="#ffffff"/>
        <circle cx="-10" cy="5" r="3.6" fill="#1f1a16"/>
        <circle cx="-8" cy="2.5" r="1.6" fill="#ffffff"/>
      </g>

      <!-- Feet -->
      <path d="M -24,-2 L -44,-3 M -24,-2 L -40,3 M -24,-2 L -36,8" stroke="#f08a3c" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M 26,-2 L 6,-3 M 26,-2 L 10,3 M 26,-2 L 14,8" stroke="#f08a3c" stroke-width="4" stroke-linecap="round" fill="none"/>
      <ellipse cx="-24" cy="-3" rx="12" ry="5.5" fill="#f08a3c"/>
      <ellipse cx="26" cy="-3" rx="12" ry="5.5" fill="#f08a3c"/>

      <!-- Nose splash & motion lines -->
      <path d="M -330,-4 h -26 M -330,8 h -34 M -330,20 h -22" stroke="#eaf9ff" stroke-width="5" stroke-linecap="round" opacity="0.8" fill="none"/>
      <path d="M -300,8 q -14,-26 -46,-24" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
      <circle cx="-305" cy="4" r="5" fill="#ffffff" opacity="0.9"/>
      <circle cx="-280" cy="-22" r="4.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="-300" cy="20" r="3.5" fill="#ffffff" opacity="0.9"/>

      <!-- Tail splash -->
      <circle cx="300" cy="2" r="4.5" fill="#ffffff" opacity="0.85"/>
      <circle cx="312" cy="-14" r="3.5" fill="#ffffff" opacity="0.85"/>
      <circle cx="322" cy="16" r="3" fill="#ffffff" opacity="0.85"/>
    </g>

    <!-- Foam streak over tail in front -->
    <path d="M 250,26 q 18,-16 40,-4" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Foreground foam -->
  <path d="M 250,545 q 90,-26 180,0 t 180,0" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.5"/>
</svg>
