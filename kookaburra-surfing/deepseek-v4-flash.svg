<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Sky background -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F0FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2E86C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B4F72;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1A5276;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="680" cy="80" r="50" fill="#F1C40F" opacity="0.9"/>
  <circle cx="680" cy="80" r="60" fill="#F1C40F" opacity="0.3"/>

  <!-- Clouds -->
  <g opacity="0.7">
    <ellipse cx="150" cy="80" rx="60" ry="25" fill="white"/>
    <ellipse cx="200" cy="70" rx="50" ry="20" fill="white"/>
    <ellipse cx="120" cy="75" rx="40" ry="18" fill="white"/>
  </g>
  <g opacity="0.5">
    <ellipse cx="500" cy="110" rx="55" ry="20" fill="white"/>
    <ellipse cx="550" cy="100" rx="45" ry="18" fill="white"/>
  </g>

  <!-- Ocean -->
  <rect x="0" y="380" width="800" height="220" fill="url(#ocean)"/>

  <!-- Wave -->
  <path d="M0 380 Q100 340 200 370 Q300 400 400 360 Q500 320 600 350 Q700 380 800 340 L800 400 Q700 420 600 390 Q500 360 400 400 Q300 440 200 410 Q100 380 0 420 Z" fill="url(#wave)"/>

  <!-- Wave foam -->
  <path d="M0 380 Q100 340 200 370 Q300 400 400 360 Q500 320 600 350 Q700 380 800 340" fill="none" stroke="white" stroke-width="4" opacity="0.6"/>
  <path d="M50 390 Q120 365 180 385 Q250 405 320 380 Q400 355 480 375 Q560 395 640 370 Q720 345 780 365" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>

  <!-- Spray/splash near board -->
  <g opacity="0.5">
    <circle cx="295" cy="355" r="3" fill="white"/>
    <circle cx="285" cy="348" r="2" fill="white"/>
    <circle cx="305" cy="350" r="2.5" fill="white"/>
    <circle cx="290" cy="342" r="2" fill="white"/>
    <circle cx="310" cy="345" r="1.5" fill="white"/>
  </g>

  <!-- Longboard -->
  <g transform="translate(350, 360) rotate(-12)">
    <ellipse cx="0" cy="0" rx="80" ry="14" fill="url(#board)" stroke="#A04000" stroke-width="1.5"/>
    <ellipse cx="0" cy="-2" rx="75" ry="11" fill="#F1C40F" opacity="0.3"/>
    <!-- Board stripe -->
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#E67E22" stroke-width="2" opacity="0.5"/>
    <!-- Board bottom detail -->
    <ellipse cx="0" cy="0" rx="80" ry="14" fill="none" stroke="#A04000" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Kookaburra -->
  <g transform="translate(345, 310)">
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="25" ry="30" fill="#8B7355" transform="rotate(-10)"/>
    <!-- Belly -->
    <ellipse cx="3" cy="25" rx="18" ry="22" fill="#F5DEB3" transform="rotate(-10)"/>

    <!-- Tail feathers -->
    <path d="M-15 40 L-35 55 L-30 45 L-40 50 L-32 40 L-42 40 L-28 35" fill="#6B5B45" stroke="#5C4A3A" stroke-width="1"/>
    <path d="M-18 38 L-38 48 L-33 42" fill="#8B7355" opacity="0.7"/>

    <!-- Left wing -->
    <path d="M-15 10 Q-40 5 -45 20 Q-40 25 -20 22 Z" fill="#7A6B4E" stroke="#6B5B45" stroke-width="1"/>
    <!-- Wing feather detail -->
    <path d="M-20 14 Q-35 10 -38 18" fill="none" stroke="#6B5B45" stroke-width="0.8"/>

    <!-- Right wing (surfing pose - extended) -->
    <path d="M15 8 Q45 -5 55 0 Q50 10 25 18 Z" fill="#7A6B4E" stroke="#6B5B45" stroke-width="1"/>
    <path d="M25 10 Q40 2 48 3" fill="none" stroke="#6B5B45" stroke-width="0.8"/>

    <!-- Neck -->
    <ellipse cx="5" cy="-5" rx="15" ry="12" fill="#8B7355"/>

    <!-- Head -->
    <ellipse cx="8" cy="-20" rx="20" ry="18" fill="#8B7355"/>

    <!-- Head markings - stripes -->
    <path d="M-5 -30 L-2 -22" stroke="#4A3728" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M2 -32 L5 -24" stroke="#4A3728" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M9 -33 L10 -25" stroke="#4A3728" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eye stripe -->
    <path d="M-8 -20 L20 -16" stroke="#4A3728" stroke-width="3" stroke-linecap="round"/>

    <!-- Eye -->
    <ellipse cx="12" cy="-22" rx="5" ry="5" fill="white"/>
    <circle cx="13" cy="-22" r="3" fill="#1A1A1A"/>
    <circle cx="14" cy="-23" r="1" fill="white"/>

    <!-- Beak -->
    <path d="M25 -18 L55 -15 L25 -12 Z" fill="#5C4033" stroke="#4A3728" stroke-width="1"/>
    <line x1="25" y1="-15" x2="52" y2="-15" stroke="#4A3728" stroke-width="0.5"/>

    <!-- Legs -->
    <line x1="-5" y1="45" x2="-10" y2="55" stroke="#5C4033" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="45" x2="12" y2="55" stroke="#5C4033" stroke-width="3" stroke-linecap="round"/>

    <!-- Feet -->
    <path d="M-10 55 L-18 58 M-10 55 L-14 60 M-10 55 L-6 60" stroke="#5C4033" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 55 L4 58 M12 55 L8 60 M12 55 L16 60" stroke="#5C4033" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Additional wave details behind -->
  <path d="M0 400 Q80 380 160 410 Q240 440 320 420 Q400 400 480 430 Q560 460 640 440 Q720 420 800 450 L800 600 L0 600 Z" fill="#1A5276" opacity="0.5"/>

  <!-- More wave foam in foreground -->
  <path d="M100 430 Q150 420 200 435 Q250 450 300 440 Q350 430 400 445" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
  <path d="M500 420 Q540 410 580 425 Q620 440 660 430" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>

  <!-- Water surface highlights -->
  <ellipse cx="100" cy="450" rx="30" ry="3" fill="#3498DB" opacity="0.3"/>
  <ellipse cx="550" cy="470" rx="25" ry="2" fill="#3498DB" opacity="0.3"/>
  <ellipse cx="700" cy="440" rx="35" ry="3" fill="#3498DB" opacity="0.3"/>
</svg>
