<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient (Sky) -->
  <rect width="100%" height="450" fill="#7FC8FF"/>
  <linearGradient id="skyGrad" x1="0%"/>
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" /> 
      <stop offset="50%" style="stop-color:#FFA07A;stop-opacity:1" /> 
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Sunset Sky Area (Applied over the rect for blending) -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>


  <!-- The Ocean/Water Surface -->
  <g id="ocean">
    <rect x="0" y="280" width="800" height="170" fill="#006D9A"/>
    <!-- Wave Crest (Stylized white foam/surf) -->
    <path d="M0 350 C 100 340, 300 360, 500 330 S 700 290, 800 310 L 800 450 L 0 450 Z" fill="#FFFFFF" opacity="0.2"/>
  </g>


  <!-- The Longboard -->
  <g id="surfboard">
    <rect x="250" y="290" width="350" height="20" rx="5" fill="#D2B48C" stroke="#A0522D" stroke-width="3"/>
    <!-- Nose Lift Curve -->
    <path d="M260 310 Q 300 290, 350 300 L 350 320 C 300 330, 280 320, 260 320 Z" fill="#E0FFFF" stroke="#A0522D" stroke-width="2"/>
    <!-- Fin details (optional) -->
    <rect x="310" y="315" width="10" height="8" fill="#696969"/>
    <rect x="400" y="315" width="10" height="8" fill="#696969"/>

  </g>


  <!-- The Kookaburra Surfer (Highly stylized using geometric shapes) -->
  <g id="kooka">
    <!-- Body - Main Brown Area -->
    <polygon points="280,305 320,310 340,300 325,295" fill="#A0522D" stroke="#6B3E26" stroke-width="2"/>

    <!-- Head & Beak (Distinctive Kookaburra features) -->
    <circle cx="275" cy="288" r="15" fill="#F4A460"/> 
    <polygon points="290,288 315,288 305,275" fill="#FFD700" stroke="#DAA52C" stroke-width="2"/> <!-- Beak -->

    <!-- Eye (Black dot) -->
    <circle cx="280" cy="285" r="3" fill="#111111"/>

    <!-- Wing/Feathers - Simplified yellow accents -->
    <polygon points="320,290 340,280 325,285" fill="#FFEB3B" opacity="0.8"/>

    <!-- Legs (Sticking out for balance) -->
    <rect x="315" y="325" width="10" height="10" fill="#D2B48C"/>
    <rect x="295" y="325" width="10" height="10" fill="#D2B48C"/>
  </g>

</svg>
