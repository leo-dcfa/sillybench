<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aee3ff"/>
      <stop offset="100%" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1687c7"/>
      <stop offset="100%" stop-color="#2fb3e1"/>
    </linearGradient>
    <linearGradient id="waveDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d6cae"/>
      <stop offset="100%" stop-color="#0a4f80"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8c1a"/>
      <stop offset="100%" stop-color="#e05e00"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="660" cy="110" r="55" fill="#ffd24a"/>
  <circle cx="660" cy="110" r="70" fill="#ffd24a" opacity="0.3"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="150" cy="90" rx="60" ry="22"/>
    <ellipse cx="200" cy="72" rx="45" ry="18"/>
    <ellipse cx="120" cy="78" rx="40" ry="16"/>
    <ellipse cx="450" cy="60" rx="55" ry="18"/>
    <ellipse cx="500" cy="48" rx="40" ry="15"/>
    <ellipse cx="410" cy="52" rx="35" ry="13"/>
  </g>

  <!-- Background water -->
  <rect y="380" width="800" height="220" fill="#0d6cae"/>

  <!-- Big curling wave -->
  <path d="M0,420 C80,330 180,290 300,320 C380,340 420,380 420,420 Z" fill="url(#wave)"/>
  <path d="M300,320 C340,335 380,370 400,420 L300,420 Z" fill="#2fb3e1"/>
  <!-- Wave tube depth -->
  <path d="M120,380 C200,340 290,350 348,410 L120,420 Z" fill="url(#waveDeep)"/>
  <!-- Foam / lip -->
  <path d="M0,420 C80,330 180,290 300,320 C330,328 355,342 375,365 C355,345 330,333 300,326 C200,300 110,335 40,410 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Spray / droplets -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="360" cy="300" r="5"/>
    <circle cx="378" cy="285" r="4"/>
    <circle cx="392" cy="298" r="3"/>
    <circle cx="370" cy="270" r="3"/>
    <circle cx="340" cy="290" r="4"/>
  </g>

  <!-- Foreground water -->
  <rect y="460" width="800" height="140" fill="#1687c7"/>

  <!-- Water surface highlights -->
  <g stroke="#7cc9ec" stroke-width="3" fill="none" opacity="0.6">
    <path d="M60,500 C120,494 180,506 240,500 C300,494 360,506 420,500"/>
    <path d="M400,540 C460,534 520,546 580,540 C640,534 700,546 760,540"/>
    <path d="M150,580 C210,574 270,586 330,580"/>
  </g>

  <!-- Spindrift on foreground wave line -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="120" cy="455" rx="30" ry="6"/>
    <ellipse cx="200" cy="462" rx="22" ry="5"/>
    <ellipse cx="40" cy="460" rx="20" ry="5"/>
  </g>

  <!-- Surfer + board group -->
  <g transform="translate(360,300) rotate(-8)">

    <!-- Board shadow / splash wake -->
    <path d="M-120,42 C-80,52 80,52 130,40 C90,58 -90,58 -120,42 Z" fill="#ffffff" opacity="0.7"/>

    <!-- Longboard -->
    <path d="M-150,20 C-120,4 120,4 150,20 C120,36 -120,36 -150,20 Z" fill="url(#board)" stroke="#b84c00" stroke-width="2"/>
    <!-- Fins -->
    <path d="M80,30 L88,52 L104,52 L96,32 Z" fill="#c8530a"/>
    <path d="M110,30 L114,50 L124,50 L118,32 Z" fill="#c8530a"/>
    <!-- Traction pad -->
    <rect x="-70" y="16" width="120" height="9" rx="4" fill="#2e7d32" opacity="0.85"/>
    <!-- Center stripe -->
    <path d="M-150,20 C-120,4 120,4 150,20" stroke="none" fill="none"/>
    <rect x="-140" y="19" width="280" height="2" fill="#ffffff" opacity="0.5"/>

    <!-- Tail -->
    <g fill="#1b1b3a">
      <path d="M-60,-108 L-78,-150 L-64,-115 L-72,-160 L-56,-122 L-62,-168 L-44,-120 L-52,-150 L-48,-104 Z"/>
    </g>

    <!-- Body -->
    <ellipse cx="0" cy="-78" rx="40" ry="46" fill="#8a6a3f"/>

    <!-- Left wing (behind body, folded) -->
    <path d="M-30,-70 C-55,-62 -72,-45 -70,-30 C-60,-52 -42,-62 -22,-58 Z" fill="#4a5a6a"/>

    <!-- Right wing (extended, waving) -->
    <path d="M30,-75 C60,-95 105,-105 130,-95 C108,-88 90,-84 78,-84 C88,-112 82,-130 78,-142 C86,-112 84,-90 66,-72 Z" fill="#3f4b5e"/>
    <path d="M30,-78 C70,-88 100,-96 118,-92 C100,-84 72,-76 46,-70 Z" fill="#2c3342"/>

    <!-- Belly feather pattern -->
    <path d="M-22,-62 C-8,-60 8,-60 22,-62 C22,-55 8,-52 -8,-52 C-22,-55 -22,-57 -22,-62 Z" fill="#d8d8d8" opacity="0.5"/>
    <path d="M-10,-42 C-3,-40 3,-40 10,-42 C10,-36 3,-33 -3,-33 C-10,-36 -10,-38 -10,-42 Z" fill="#e8e8e8" opacity="0.6"/>

    <!-- Wing streak (blue) -->
    <path d="M16,-52 C48,-66 88,-72 118,-66" stroke="#3a7bd5" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9"/>

    <!-- Head -->
    <ellipse cx="8" cy="-118" rx="38" ry="34" fill="#8a6a3f"/>

    <!-- Head crown feathers (darker brown/ruffled) -->
    <path d="M-18,-150 C-14,-160 -4,-162 4,-158 C8,-164 20,-162 24,-154 C26,-146 20,-140 12,-140" fill="#6b4f2c"/>
    <path d="M-10,-148 C-6,-156 4,-158 10,-154 C14,-150 10,-144 2,-142" fill="#5a4224"/>

    <!-- Eye stripe (dark) -->
    <path d="M18,-130 C10,-126 -4,-124 -14,-126" stroke="#1b1b3a" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Round head cap -->
    <ellipse cx="0" cy="-126" rx="30" ry="16" fill="#5a4224"/>

    <!-- Eye (white patch + dark eye) -->
    <circle cx="14" cy="-120" r="7" fill="#ffffff"/>
    <circle cx="16" cy="-120" r="3.4" fill="#1b1b3a"/>
    <circle cx="17" cy="-121" r="1.2" fill="#ffffff"/>

    <!-- Cheek patch (light) -->
    <ellipse cx="2" cy="-110" rx="14" ry="8" fill="#e6d7b8"/>

    <!-- Big upper beak -->
    <path d="M34,-122 C50,-136 78,-140 92,-132 C78,-124 52,-118 34,-118 Z" fill="#1b1b3a"/>
    <!-- Lower beak -->
    <path d="M34,-117 C52,-112 80,-124 90,-130 C76,-116 54,-110 34,-114 Z" fill="#2e2e4a"/>

    <!-- Nostril line -->
    <path d="M52,-132 L60,-132" stroke="#000000" stroke-width="1.5"/>

    <!-- Legs (bent surfing stance) -->
    <g stroke="#d9a441" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M-12,-50 L-24,-22 L-34,-6"/>
      <path d="M14,-48 L34,-30 L22,-10"/>
    </g>
    <g fill="#d9a441">
      <ellipse cx="-40" cy="-2" rx="8" ry="4"/>
      <ellipse cx="20" cy="-6" rx="8" ry="4"/>
    </g>

    <!-- Motion lines behind -->
    <g stroke="#ffffff" stroke-width="3" opacity="0.5" fill="none">
      <path d="M-160,10 L-210,8"/>
      <path d="M-155,24 L-225,22"/>
    </g>
  </g>
</svg>
