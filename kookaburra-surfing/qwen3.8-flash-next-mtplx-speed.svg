<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"
     role="img" aria-label="A kookaburra surfing a longboard on a curling wave">
  <title>Kook — Aussie Ripper</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1ab"/>
      <stop offset=".45" stop-color="#93d2e4"/>
      <stop offset="1" stop-color="#c3e8f0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d96ab"/>
      <stop offset="1" stop-color="#0c4258"/>
    </linearGradient>
    <linearGradient id="wave" x1=".1" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#6ac8d6"/>
      <stop offset=".55" stop-color="#2b8ba3"/>
      <stop offset="1" stop-color="#124f66"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c6c85"/>
      <stop offset="1" stop-color="#083346"/>
    </linearGradient>
    <linearGradient id="deck" x1="206" y1="440" x2="606" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8e8c6"/>
      <stop offset=".55" stop-color="#eecd97"/>
      <stop offset="1" stop-color="#d8a262"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="300" y1="230" x2="430" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9a7a4f"/>
      <stop offset="1" stop-color="#6b5031"/>
    </linearGradient>
    <linearGradient id="wingG" x1="330" y1="160" x2="400" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b6a488"/>
      <stop offset="1" stop-color="#7a5c39"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M428,278 C434,242 408,216 372,216 C334,216 300,248 294,292 C288,338 318,368 356,372 C394,376 423,342 428,278 Z"/>
    </clipPath>
    <clipPath id="headClip">
      <path d="M398,200 C398,170 420,152 448,152 C476,152 494,172 494,196 C494,224 474,246 446,246 C418,246 398,226 398,200 Z"/>
    </clipPath>
  </defs>

  <!-- ============ SKY ============ -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="74" r="66" fill="#ffd98f" opacity=".35"/>
  <circle cx="690" cy="74" r="38" fill="#fff0c8"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity=".62">
    <ellipse cx="150" cy="98" rx="54" ry="19"/>
    <circle cx="128" cy="86" r="21"/>
    <circle cx="158" cy="78" r="27"/>
    <circle cx="186" cy="92" r="17"/>
    <ellipse cx="352" cy="66" rx="40" ry="14"/>
    <circle cx="342" cy="56" r="17"/>
    <circle cx="364" cy="52" r="13"/>
  </g>

  <!-- distant gulls -->
  <g fill="none" stroke="#4f7c8a" stroke-width="2.4" stroke-linecap="round" opacity=".75">
    <path d="M224,112 C230,105 236,105 241,111"/>
    <path d="M241,111 C246,105 252,105 258,111"/>
    <path d="M276,90 C281,85 286,85 290,90"/>
    <path d="M290,90 C294,85 299,85 304,90"/>
  </g>

  <!-- ============ SEA ============ -->
  <rect x="0" y="298" width="800" height="302" fill="url(#sea)"/>
  <!-- distant headland -->
  <path d="M0,298 L0,276 C30,268 52,254 84,252 C112,250 128,262 152,266 C180,270 200,258 226,262 C252,266 268,278 296,282 L300,298 Z"
        fill="#7fa2a8" opacity=".7"/>
  <path d="M0,318 C120,312 260,316 400,320 C540,324 660,318 800,312" fill="none"
        stroke="#bfeaf1" stroke-width="2" opacity=".45"/>

  <!-- main swell / wave face -->
  <path d="M0,502 L0,600 L800,600 L800,300 L702,300 C662,314 620,336 582,356 C532,384 474,410 414,428 C352,446 286,450 202,464 C132,476 66,494 0,502 Z"
        fill="url(#wave)"/>
  <path d="M0,502 C66,494 132,476 202,464 C286,450 352,446 414,428 C474,410 532,384 582,356 C620,336 662,314 702,300"
        fill="none" stroke="#e6f8fb" stroke-width="7" opacity=".5" stroke-linecap="round"/>
  <path d="M40,514 C130,506 220,492 300,478 C380,464 440,452 500,428"
        fill="none" stroke="#c9edf3" stroke-width="3" opacity=".3" stroke-linecap="round"/>

  <!-- curling crest -->
  <path d="M604,300 C676,306 724,338 726,382 C728,418 700,446 664,450 C636,453 612,444 600,428 C622,434 644,430 658,414 C678,392 682,360 666,338 C654,320 634,308 606,304 Z"
        fill="#f0fbfd" opacity=".85"/>
  <g fill="#f4fbfd" opacity=".7">
    <circle cx="612" cy="442" r="9"/><circle cx="634" cy="452" r="7"/>
    <circle cx="658" cy="448" r="5"/><circle cx="690" cy="424" r="6"/>
    <circle cx="706" cy="400" r="4"/><circle cx="716" cy="360" r="5"/>
    <circle cx="644" cy="292" r="7"/><circle cx="672" cy="288" r="5"/>
  </g>
  <path d="M470,392 C520,372 566,346 604,314" fill="none" stroke="#8fdbe6"
        stroke-width="3" opacity=".5"/>

  <!-- board's shadow on the water -->
  <ellipse cx="384" cy="452" rx="176" ry="19" transform="rotate(-13 384 452)"
           fill="#062b3b" opacity=".3"/>

  <!-- ============ LONGBOARD ============ -->
  <g stroke-linejoin="round">
    <!-- fins -->
    <path d="M256,448 C264,462 264,480 256,494 C244,478 240,458 246,444 Z"
          fill="#d9563f" stroke="#7d3320" stroke-width="1.5"/>
    <path d="M300,436 C308,448 308,464 302,476 C292,462 290,446 294,434 Z"
          fill="#c14e39" opacity=".9"/>
    <!-- rail / underside -->
    <path transform="translate(3,10)"
          d="M206,440 C300,412 448,368 586,330 C598,327 608,332 606,340 C604,347 594,351 582,355 C448,394 302,438 214,462 C204,460 200,448 206,440 Z"
          fill="#a96a2d"/>
    <!-- deck -->
    <path d="M206,440 C300,412 448,368 586,330 C598,327 608,332 606,340 C604,347 594,351 582,355 C448,394 302,438 214,462 C204,460 200,448 206,440 Z"
          fill="url(#deck)" stroke="#7a4a1d" stroke-width="2.5"/>
    <!-- pinline + decal -->
    <path d="M222,452 C320,424 460,382 600,342" fill="none" stroke="#e0664c"
          stroke-width="4" opacity=".9" stroke-linecap="round"/>
    <path d="M236,444 C330,418 462,378 596,340" fill="none" stroke="#fff6e4"
          stroke-width="1.6" opacity=".8"/>
    <circle cx="556" cy="352" r="9" fill="#e0664c" opacity=".85"/>
    <g fill="#ffffff" opacity=".22">
      <circle cx="300" cy="422" r="3"/><circle cx="342" cy="410" r="3"/>
      <circle cx="384" cy="398" r="3"/><circle cx="426" cy="386" r="3"/>
      <circle cx="468" cy="374" r="3"/><circle cx="322" cy="430" r="2.4"/>
      <circle cx="364" cy="418" r="2.4"/><circle cx="406" cy="406" r="2.4"/>
    </g>
    <!-- bird's shadow on the deck -->
    <ellipse cx="374" cy="404" rx="54" ry="9" transform="rotate(-15 374 404)"
             fill="#6b3f14" opacity=".33"/>
  </g>

  <!-- ============ KOOKABURRA ============ -->
  <g stroke-linecap="round">

    <!-- tail feathers -->
    <path d="M302,318 C276,322 250,334 232,348 C228,352 231,357 238,355 C264,349 292,338 310,328 Z"
          fill="#7a4a28" stroke="#43291a" stroke-width="1.6"/>
    <path d="M300,300 C270,296 240,306 216,322 C210,326 212,332 220,331 C252,326 286,320 310,310 Z"
          fill="#453221" stroke="#2d1f13" stroke-width="1.6"/>
    <g stroke="#241a11" stroke-width="2.4" opacity=".6" fill="none">
      <path d="M240,330 L246,344"/><path d="M262,324 L268,338"/>
    </g>

    <!-- raised far wing -->
    <g stroke="#3a2a1c" stroke-width="1.6">
      <path d="M346,168 C334,150 324,134 318,120" fill="none" stroke="#6d5133" stroke-width="9"/>
      <path d="M342,172 C326,158 308,144 294,134" fill="none" stroke="#6d5133" stroke-width="9"/>
      <path d="M338,178 C322,168 302,158 286,152" fill="none" stroke="#7a5c39" stroke-width="8"/>
      <path d="M336,186 C318,180 298,176 282,174" fill="none" stroke="#7a5c39" stroke-width="7"/>
      <path d="M374,242 C358,224 342,200 332,176 C328,166 338,160 346,168 C362,184 380,210 392,232 C398,242 382,252 374,242 Z"
            fill="url(#wingG)"/>
      <ellipse cx="358" cy="202" rx="12" ry="19" transform="rotate(38 358 202)"
               fill="#a3b4bb" opacity=".5" stroke="none"/>
    </g>

    <!-- legs & feet gripping the deck -->
    <g fill="none" stroke="#c19377">
      <path d="M332,340 C322,360 318,382 320,400" stroke-width="8"/>
      <path d="M402,336 C405,360 405,380 404,390" stroke-width="8"/>
      <g stroke-width="4.5" stroke="#b0805f">
        <path d="M321,402 C330,408 340,410 350,408"/>
        <path d="M321,402 C318,410 316,416 314,420"/>
        <path d="M321,402 C312,402 304,404 296,406"/>
        <path d="M404,392 C412,396 420,398 428,396"/>
        <path d="M404,392 C402,400 400,406 398,410"/>
        <path d="M404,392 C396,392 388,394 380,396"/>
      </g>
    </g>

    <!-- throat / breast front -->
    <path d="M404,222 C394,244 396,268 410,282 C426,272 434,248 432,228 Z" fill="#f2ead6"/>

    <!-- body -->
    <path d="M428,278 C434,242 408,216 372,216 C334,216 300,248 294,292 C288,338 318,368 356,372 C394,376 423,342 428,278 Z"
          fill="url(#bodyG)" stroke="#3a2a1c" stroke-width="2"/>
    <g clip-path="url(#bodyClip)">
      <ellipse cx="342" cy="266" rx="46" ry="42" fill="#6d5133" opacity=".55"/>
      <ellipse cx="394" cy="330" rx="46" ry="46" fill="#f4ecd7"/>
      <g stroke="#6d5133" stroke-width="3" opacity=".7" fill="none">
        <path d="M368,282 C372,290 372,298 368,304"/>
        <path d="M380,276 C384,286 384,296 380,304"/>
        <path d="M392,284 C396,292 396,300 392,306"/>
        <path d="M356,300 C360,308 360,316 356,322"/>
      </g>
    </g>

    <!-- near wing, reaching down the line -->
    <g stroke="#3a2a1c">
      <path d="M398,270 C432,266 464,278 490,298 C502,308 500,322 486,322 C464,322 432,310 406,294 C392,286 388,274 398,270 Z"
            fill="url(#wingG)" stroke-width="2"/>
      <path d="M410,282 C432,288 456,298 476,310" fill="none" stroke="#4a3623"
            stroke-width="1.8" opacity=".6"/>
      <g stroke="#7a5c39" fill="none">
        <path d="M482,300 C496,302 508,308 514,316" stroke-width="7"/>
        <path d="M480,310 C492,316 502,324 506,334" stroke-width="7"/>
        <path d="M474,318 C482,326 488,336 490,346" stroke-width="6"/>
      </g>
    </g>

    <!-- crest -->
    <path d="M410,176 C398,164 392,146 394,132 C404,142 414,158 422,170 Z" fill="#6b4d2f"/>
    <path d="M402,196 C386,188 374,172 370,158 C384,164 398,180 406,192 Z" fill="#5b4026"/>

    <!-- head -->
    <path d="M398,200 C398,170 420,152 448,152 C476,152 494,172 494,196 C494,224 474,246 446,246 C418,246 398,226 398,200 Z"
          fill="#f6efdd" stroke="#3a2a1c" stroke-width="2"/>
    <g clip-path="url(#headClip)">
      <path d="M398,192 C406,168 428,154 452,156 C474,158 488,172 490,188 C468,178 440,174 414,182 C404,185 398,190 398,192 Z"
            fill="#7a5a36"/>
      <path d="M396,196 C420,186 448,182 474,184 C480,185 481,194 475,195 C449,199 421,203 399,208 C393,208 392,198 396,196 Z"
            fill="#2f2419" opacity=".92"/>
      <path d="M398,182 C420,175 446,173 470,176" fill="none" stroke="#ffffff"
            stroke-width="3" opacity=".45"/>
    </g>
    <circle cx="430" cy="190" r="11.5" fill="#3a2213"/>
    <circle cx="430" cy="190" r="7" fill="#161009"/>
    <circle cx="426.5" cy="186" r="2.8" fill="#ffffff" opacity=".9"/>

    <!-- open bill (mid-laugh) -->
    <path d="M466,196 L534,182 C540,188 536,198 528,203 L468,214 Z" fill="#4b2a24"/>
    <path d="M498,202 C512,200 524,200 532,202 C528,207 514,209 500,208 Z" fill="#c26b64"/>
    <path d="M466,206 C492,205 516,200 530,196 C534,203 528,212 518,215 C500,220 478,218 466,212 Z"
          fill="#c3b8a1" stroke="#7d6c52" stroke-width="1.2"/>
    <path d="M462,180 C486,168 514,158 538,156 C546,155 551,163 545,169 C538,176 526,183 510,189 C494,195 474,196 464,194 Z"
          fill="#2f2f36" stroke="#1b1b21" stroke-width="1.2"/>
    <circle cx="492" cy="170" r="2.2" fill="#14141a" opacity=".8"/>
  </g>

  <!-- ============ SPRAY & TEXT ============ -->
  <g stroke="#f4fbfc" fill="none" opacity=".7" stroke-width="2.6">
    <path d="M552,196 C568,202 578,212 582,224"/>
    <path d="M558,186 C578,194 592,206 598,222"/>
    <path d="M564,176 C590,186 608,202 614,220"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19">
    <text x="600" y="134" fill="#0f4457" opacity=".28">kook... kook...</text>
    <text x="624" y="162" fill="#0f4457" opacity=".28">kaaak!</text>
    <text x="598" y="132" fill="#fff8ea">kook... kook...</text>
    <text x="622" y="160" fill="#fff8ea">kaaak!</text>
  </g>

  <!-- spray off the tail -->
  <g fill="#eef9fb">
    <path d="M214,452 C186,438 152,434 124,442 C154,448 186,458 210,468 Z" opacity=".55"/>
    <circle cx="196" cy="436" r="8" opacity=".8"/>
    <circle cx="176" cy="428" r="6" opacity=".7"/>
    <circle cx="158" cy="421" r="4.5" opacity=".6"/>
    <circle cx="139" cy="434" r="3.5" opacity=".5"/>
    <circle cx="236" cy="470" r="10" opacity=".8"/>
    <circle cx="258" cy="479" r="6" opacity=".6"/>
    <circle cx="282" cy="486" r="4" opacity=".45"/>
    <circle cx="500" cy="352" r="4" opacity=".5"/>
  </g>
  <g stroke="#f4fbfc" stroke-width="4" fill="none" opacity=".6" stroke-linecap="round">
    <path d="M248,450 C212,438 174,434 140,442"/>
    <path d="M252,466 C214,458 176,456 142,464"/>
    <path d="M244,436 C212,420 180,412 152,414"/>
  </g>

  <!-- foreground water -->
  <path d="M0,512 C60,504 120,498 176,502 C216,505 246,516 272,530 C300,545 340,552 384,548 L800,556 L800,600 L0,600 Z"
        fill="url(#fg)" opacity=".92"/>
  <path d="M0,512 C60,504 120,498 176,502 C216,505 246,516 272,530 C300,545 340,552 384,548 L800,556"
        fill="none" stroke="#dff4f8" stroke-width="5" opacity=".4" stroke-linecap="round"/>
  <g fill="#eaf7fa" opacity=".45">
    <ellipse cx="96" cy="536" rx="34" ry="7"/>
    <ellipse cx="330" cy="566" rx="46" ry="8"/>
    <ellipse cx="600" cy="576" rx="40" ry="7"/>
  </g>

  <text x="26" y="580" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="15" fill="#e8f7fa" opacity=".75">Aussie ripper</text>
</svg>
