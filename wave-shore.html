<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waves Crashing — Shore Simulation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=Inter:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0b1628;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #dde8f0;
  }

  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    display: block;
    z-index: 1;
  }

  .overlay {
    position: fixed;
    z-index: 10;
    pointer-events: none;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 3vh 4vw;
  }

  header {
    text-align: left;
  }
  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(3rem, 7vw, 6rem);
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 20px 60px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.2);
  }
  header .sub {
    margin-top: 0.6rem;
    font-size: 0.95rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    font-weight: 300;
  }

  footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 2rem;
  }
  .info-block {
    max-width: 320px;
  }
  .info-block p {
    font-size: 0.85rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.65);
  }
  .label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-bottom: 0.25rem;
  }

  .controls {
    pointer-events: auto;
    background: rgba(11, 22, 40, 0.65);
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 0.9rem 1.2rem;
    display: flex;
    gap: 1.2rem;
    align-items: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25), inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .controls label {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.05em;
  }
  .controls input[type="range"] {
    width: 140px;
    accent-color: #7fc0e6;
    cursor: pointer;
  }

  @media (max-width: 640px) {
    .overlay { padding: 2vh 4vw; }
    .controls { flex-wrap: wrap; gap: 0.6rem; padding: 0.7rem 0.9rem; }
  }
</style>
</head>
<body>

<canvas id="sea"></canvas>

<div class="overlay" aria-label="Scene info and controls">
  <header>
    <h1>Waves crashing<br>into shore</h1>
    <div class="sub">Procedural ocean simulation</div>
  </header>

  <footer>
    <div class="info-block">
      <div class="label">Observation</div>
      <p>Each breaker is drawn with layered noise: long-period swells near the horizon collapse into turbulent foam as they reach the sand. Sunlight scatters through spray, and the shoreline draws a thin silver line where water meets earth.</p>
    </div>
    <div class="controls" role="group" aria-label="Simulation controls">
      <label for="waveHeight">Swell height <span id="valHeight">1.0</span></label>
      <input id="waveHeight" type="range" min="0.2" max="2.0" step="0.05" value="1.0">
      <label for="fog">Mist <span id="valFog">0.4</span></label>
      <input id="fog" type="range" min="0" max="1" step="0.05" value="0.4">
    </div>
  </footer>
</div>

<script>
const canvas = document.getElementById('sea');
const ctx = canvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Simple pseudo-random for deterministic behavior
function noise(x, y, t) {
  const nx = Math.sin(x * 0.05 + t * 0.8) * 0.5 + Math.sin(x * 0.12 - t * 0.3) * 0.5;
  const ny = Math.cos(y * 0.07 + t * 0.6) * 0.5 + Math.sin(y * 0.03 + t * 1.1) * 0.5;
  return nx + ny;
}

// Controls state
const state = {
  height: 1.0,
  fog: 0.4,
};
document.getElementById('waveHeight').addEventListener('input', e => { state.height = parseFloat(e.target.value); document.getElementById('valHeight').textContent = state.height.toFixed(1); });
document.getElementById('fog').addEventListener('input', e => { state.fog = parseFloat(e.target.value); document.getElementById('valFog').textContent = state.fog.toFixed(1); });

function draw() {
  const t = performance.now() * 0.001;
  const hFactor = state.height;
  const fogFactor = state.fog;

  // Clear with deep ocean
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#08142a');
  bg.addColorStop(0.55, '#0e2848');
  bg.addColorStop(1, '#15325e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Sky gradient near horizon
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  sky.addColorStop(0, '#4a6a8c');
  sky.addColorStop(0.7, '#889dbd');
  sky.addColorStop(1, '#d6dde8');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H * 0.55);

  // Draw distant mist / fog band at horizon
  const mist = ctx.createLinearGradient(0, H * 0.42, 0, H * 0.55);
  mist.addColorStop(0, 'rgba(200,210,230,0)');
  mist.addColorStop(0.5, `rgba(220,225,235,${0.15 + fogFactor * 0.4})`);
  mist.addColorStop(1, `rgba(220,225,235,${0.35 + fogFactor * 0.45})`);
  ctx.fillStyle = mist;
  ctx.fillRect(0, H * 0.42, W, H * 0.13);

  // Layered waves from back to front
  // We draw 4 wave bands with decreasing y and increasing detail
  const bands = [
    { yBase: H * 0.52, amp: 30 * hFactor, freq: 0.008, phase: 0.0, color: '#3a6b8c', alpha: 0.35, width: 3 },
    { yBase: H * 0.58, amp: 45 * hFactor, freq: 0.011, phase: 1.2, color: '#4a7fa8', alpha: 0.55, width: 4 },
    { yBase: H * 0.65, amp: 60 * hFactor, freq: 0.015, phase: 2.5, color: '#5b8fc2', alpha: 0.75, width: 5 },
    { yBase: H * 0.72, amp: 85 * hFactor, freq: 0.022, phase: 4.0, color: '#7fbad6', alpha: 0.9, width: 6 },
  ];

  for (const b of bands) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 3) {
      const n = noise(x * b.freq, b.yBase, t + b.phase);
      const y = b.yBase - Math.sin(x * 0.015 + t * 1.2 + b.phase) * b.amp * 0.7 - n * b.amp * 0.3;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();

    // Gradient fill for water body
    const grad = ctx.createLinearGradient(0, b.yBase - b.amp, 0, H);
    grad.addColorStop(0, b.color + '00');
    grad.addColorStop(0.4, b.color + '30');
    grad.addColorStop(1, '#062240');
    ctx.fillStyle = grad;
    ctx.fill();

    // Edge line (wave crest)
    ctx.beginPath();
    for (let x = 0; x <= W; x += 3) {
      const n = noise(x * b.freq, b.yBase, t + b.phase);
      const y = b.yBase - Math.sin(x * 0.015 + t * 1.2 + b.phase) * b.amp * 0.7 - n * b.amp * 0.3;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(210,230,245,${b.alpha})`;
    ctx.lineWidth = b.width;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Foam highlights near crest
    ctx.beginPath();
    for (let x = 0; x <= W; x += 6) {
      const n = noise(x * b.freq, b.yBase, t + b.phase);
      const y = b.yBase - Math.sin(x * 0.015 + t * 1.2 + b.phase) * b.amp * 0.7 - n * b.amp * 0.3;
      const foamY = y - 3 + Math.sin(x * 0.03 + t * 2.0 + b.phase * 2) * 2;
      if (x === 0) ctx.moveTo(x, foamY);
      else ctx.lineTo(x, foamY);
    }
    ctx.strokeStyle = `rgba(255,255,255,${b.alpha * 0.7})`;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  // Shore / sand line at bottom
  const shoreY = H * 0.88 + Math.sin(t * 0.8) * 4;
  ctx.beginPath();
  ctx.moveTo(0, shoreY);
  for (let x = 0; x <= W; x += 8) {
    const y = shoreY + Math.sin(x * 0.012 + t) * 3 + Math.sin(x * 0.03) * 2;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  const sandGrad = ctx.createLinearGradient(0, shoreY, 0, H);
  sandGrad.addColorStop(0, '#c8a580');
  sandGrad.addColorStop(0.3, '#b08a6a');
  sandGrad.addColorStop(1, '#7a5e42');
  ctx.fillStyle = sandGrad;
  ctx.fill();

  // Highlighted wet sand strip near edge
  ctx.beginPath();
  ctx.moveTo(0, shoreY + 2);
  for (let x = 0; x <= W; x += 4) {
    const y = shoreY + 2 + Math.sin(x * 0.01 + t * 0.9) * 2;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, shoreY + 2);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(230,215,190,0.55)';
  ctx.stroke();

  // Sparkle / spray particles near breaking zone (mid-bottom)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 120; i++) {
    const px = Math.random() * W;
    const py = H * 0.78 + Math.random() * (H * 0.12);
    const r = 0.5 + Math.random() * 2.5;
    const alpha = 0.15 + Math.sin(t * 3 + i) * 0.15;
    ctx.fillStyle = `rgba(220,235,255,${Math.max(0, alpha)})`;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
