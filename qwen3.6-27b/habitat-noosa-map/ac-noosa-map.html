<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habitat Noosa - Animal Crossing Map</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:linear-gradient(180deg,#87ceeb 0%,#b8e6cf 40%);
    display:flex;flex-direction:column;align-items:center;min-height:100vh;
    font-family:'Segoe UI',system-ui,sans-serif;padding:20px;
  }
  .title-board{
    background:linear-gradient(135deg,#ffe0b2 0%,#ffeaa7 100%);
    border:4px solid #e17055;border-radius:24px;padding:16px 40px;margin-bottom:16px;
    box-shadow:0 6px 20px rgba(0,0,0,.12);text-align:center;
  }
  .title-board h1{font-size:26px;color:#d35400;letter-spacing:.5px}
  .title-board p{font-size:13px;color:#e67e22;margin-top:6px}
  svg{max-width:820px;width:100%;height:auto;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
  .legend{
    background:#fffdf7;border:3px solid #dcb88a;border-radius:14px;
    padding:14px 22px;margin-top:16px;max-width:820px;width:100%;
    display:flex;flex-wrap:wrap;gap:10px 24px;
  }
  .legend div{display:flex;align-items:center;gap:6px;font-size:12px;color:#5a4432}
  .legend span{display:inline-block;width:14px;height:14px;border-radius:6px}
</style>
</head>

<div class="title-board">

  <pattern id="water" width="80" height="40" patternUnits="userSpaceOnUse">

  <pattern id="pathpat" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="#f5e6ca"/>
    <rect x="10" y="6" width="8" height="6" rx="2" fill="#f0d9b5" opacity=".5"/>
    <rect x="26" y="26" width="8" height="5" rx="2" fill="#f0d9b5" opacity=".35"/>

  <radialGradient id="flower" cx="40%" cy="30%">

    <stop offset="100%" stop-color="#ff6b6b"/>
  </radialGradient>
  <radialGradient id="treeGrad" cx="35%" cy="30%">

    <stop offset="100%" stop-color="#2ed573"/>

  <radialGradient id="palmGrad" cx="35%" cy="30%">

    <stop offset="100%" stop-color="#05c46b"/>
  </radialGradient>
</defs>
