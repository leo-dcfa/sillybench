<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="100%" height="100%" style="background:#c8ead6;font-family:system-ui,sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/></filter>
    <pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#c8ead6"/><circle cx="10" cy="10" r="1.5" fill="#9fdca3" opacity="0.6"/><circle cx="30" cy="30" r="2" fill="#9fdca3" opacity="0.5"/></pattern>
  </defs>

  <!-- Sky -->
  <rect width="720" height="560" fill="#d9f0e3"/>
  <circle cx="580" cy="100" r="45" fill="#fff6c5" opacity="0.9"/>
  <circle cx="580" cy="100" r="35" fill="#fff0a8" opacity="0.8"/>

  <!-- River / Everglades -->
  <path d="M -20 420 Q 120 380 200 430 T 400 400 T 620 450 T 740 410 L 740 560 L -20 560 Z" fill="#7ec8e3" opacity="0.85"/>
  <path d="M -20 430 Q 120 390 200 440 T 400 410 T 620 460 T 740 420" stroke="#4fa3ce" stroke-width="3" fill="none" opacity="0.7"/>

  <!-- Main paths -->
  <rect x="80" y="260" width="560" height="28" rx="14" fill="#eecfa1" opacity="0.9"/>
  <rect x="80" y="260" width="560" height="6" rx="3" fill="#dcb88a" opacity="0.6"/>
  <rect x="340" y="120" width="28" height="340" rx="14" fill="#eecfa1" opacity="0.9"/>
  <rect x="340" y="120" width="6" height="340" rx="3" fill="#dcb88a" opacity="0.6"/>

  <!-- Trees (AC style round) -->
  <g filter="url(#shadow)">
    <circle cx="110" cy="210" r="36" fill="#5fb57f"/><circle cx="110" cy="210" r="22" fill="#7ad18e"/>
    <rect x="105" y="240" width="10" height="24" fill="#d4a76a" rx="2"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="160" cy="190" r="32" fill="#5fb57f"/><circle cx="160" cy="190" r="20" fill="#7ad18e"/>
    <rect x="155" y="218" width="10" height="22" fill="#d4a76a" rx="2"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="620" cy="390" r="34" fill="#5fb57f"/><circle cx="620" cy="390" r="21" fill="#7ad18e"/>
    <rect x="615" y="420" width="10" height="22" fill="#d4a76a" rx="2"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="340" cy="80" r="30" fill="#5fb57f"/><circle cx="340" cy="80" r="18" fill="#7ad18e"/>
    <rect x="335" y="105" width="10" height="20" fill="#d4a76a" rx="2"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="450" cy="210" r="28" fill="#5fb57f"/><circle cx="450" cy="210" r="17" fill="#7ad18e"/>
    <rect x="445" y="235" width="10" height="18" fill="#d4a76a" rx="2"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="140" cy="420" r="30" fill="#5fb57f"/><circle cx="140" cy="420" r="18" fill="#7ad18e"/>
    <rect x="135" y="445" width="10" height="20" fill="#d4a76a" rx="2"/>
  </g>

  <!-- Glamping / Reception (cute AC-style building with curved roof) -->
  <g filter="url(#shadow)">
    <rect x="220" y="190" width="110" height="70" rx="8" fill="#f7e8c6" stroke="#e3c99a" stroke-width="2"/>
    <path d="M 215 190 Q 275 140 335 190 Z" fill="#c17a53" stroke="#a05a38" stroke-width="2"/>
    <rect x="250" y="230" width="30" height="30" rx="4" fill="#dbe8db" stroke="#9bb18a" stroke-width="2"/>
    <rect x="290" y="230" width="30" height="30" rx="4" fill="#dbe8db" stroke="#9bb18a" stroke-width="2"/>
    <rect x="230" y="260" width="90" height="16" rx="3" fill="#8fb38a"/>
    <text x="275" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a4a3a">Reception</text>
  </g>

  <!-- Eco Brewery (small roundish building) -->
  <g filter="url(#shadow)">
    <rect x="400" y="310" width="90" height="60" rx="10" fill="#eecfa1" stroke="#dcb88a" stroke-width="2"/>
    <path d="M 395 310 Q 445 270 495 310 Z" fill="#8c6d46" stroke="#6b522e" stroke-width="2"/>
    <circle cx="445" cy="345" r="10" fill="#f4b88a"/>
    <text x="445" y="365" text-anchor="middle" font-size="9" font-weight="bold" fill="#5a4432">Eco Brewery</text>
  </g>

  <!-- Coothara Bar & Bistro -->
  <g filter="url(#shadow)">
    <rect x="180" y="290" width="100" height="60" rx="10" fill="#ffeec7" stroke="#e6cfa3" stroke-width="2"/>
    <path d="M 175 290 Q 230 250 280 290 Z" fill="#c17a53" stroke="#a05a38" stroke-width="2"/>
    <rect x="210" y="320" width="22" height="30" rx="3" fill="#7ec8e3" stroke="#5da2be" stroke-width="2"/>
    <rect x="240" y="320" width="22" height="30" rx="3" fill="#7ec8e3" stroke="#5da2be" stroke-width="2"/>
    <text x="230" y="320" text-anchor="middle" font-size="9" font-weight="bold" fill="#5a4432">Coothara</text>
  </g>

  <!-- Kayak / SUP Hire (small dock + boats) -->
  <g filter="url(#shadow)">
    <rect x="520" y="420" width="110" height="40" rx="6" fill="#8fb38a" stroke="#6d8f68" stroke-width="2"/>
    <rect x="525" y="425" width="30" height="12" rx="3" fill="#5aa87c"/>
    <rect x="560" y="425" width="30" height="12" rx="3" fill="#5aa87c"/>
    <rect x="595" y="425" width="30" height="12" rx="3" fill="#5aa87c"/>
    <text x="575" y="445" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">Kayak &amp; SUP</text>
  </g>
  <rect x="510" y="440" width="15" height="25" rx="3" fill="#d4a76a"/>

  <!-- Lake Access -->
  <g filter="url(#shadow)">
    <ellipse cx="500" cy="470" rx="50" ry="22" fill="#7ec8e3" stroke="#4fa3ce" stroke-width="2" opacity="0.95"/>
    <ellipse cx="500" cy="468" rx="35" ry="14" fill="#9fdbee" opacity="0.7"/>
    <text x="500" y="475" text-anchor="middle" font-size="10" font-weight="bold" fill="#245a75">Lake Access</text>
  </g>

  <!-- Frisbee Golf -->
  <g filter="url(#shadow)">
    <circle cx="130" cy="540" r="22" fill="#4fa3ce" opacity="0.9"/>
    <circle cx="130" cy="540" r="14" fill="#7ec8e3"/>
    <path d="M 130 520 L 130 540" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="130" y="565" text-anchor="middle" font-size="9" font-weight="bold" fill="#245a75">Frisbee Golf</text>
  </g>

  <!-- Walking Paths -->
  <line x1="160" y1="210" x2="140" y2="420" stroke="#8fb38a" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="160" y1="210" x2="350" y2="310" stroke="#8fb38a" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Glamping tents / sites -->
  <g filter="url(#shadow)">
    <polygon points="330,350 350,370 370,350 370,320 350,300 330,320" fill="#d6e8d6" stroke="#9bb18a" stroke-width="2"/>
    <rect x="340" y="340" width="20" height="10" rx="2" fill="#8fb38a"/>
    <text x="350" y="335" text-anchor="middle" font-size="7" fill="#4a6a4a">Glamping</text>
  </g>
  <g filter="url(#shadow)">
    <polygon points="440,370 460,390 480,370 480,340 460,320 440,340" fill="#d6e8d6" stroke="#9bb18a" stroke-width="2"/>
    <rect x="450" y="360" width="20" height="10" rx="2" fill="#8fb38a"/>
    <text x="460" y="355" text-anchor="middle" font-size="7" fill="#4a6a4a">Site</text>
  </g>

  <!-- Restrooms / Showers -->
  <g filter="url(#shadow)">
    <rect x="560" y="310" width="70" height="40" rx="8" fill="#f0e8db" stroke="#dcb88a" stroke-width="2"/>
    <rect x="575" y="325" width="18" height="15" rx="3" fill="#eecfa1"/>
    <rect x="600" y="325" width="18" height="15" rx="3" fill="#eecfa1"/>
    <text x="595" y="345" text-anchor="middle" font-size="7" font-weight="bold" fill="#6b522e">Showers / Toilets</text>
  </g>

  <!-- Camp Kitchen -->
  <g filter="url(#shadow)">
    <rect x="300" y="410" width="80" height="40" rx="8" fill="#f8f0e0" stroke="#ddd3bf" stroke-width="2"/>
    <rect x="310" y="420" width="60" height="8" rx="4" fill="#6d5e45"/>
    <text x="340" y="445" text-anchor="middle" font-size="8" font-weight="bold" fill="#5a4432">Camp Kitchen</text>
  </g>

  <!-- Small flowers / details -->
  <circle cx="100" cy="350" r="4" fill="#e07a7a"/><circle cx="105" cy="350" r="4" fill="#e07a7a"/>
  <circle cx="350" cy="450" r="3.5" fill="#f4b88a"/><circle cx="355" cy="450" r="3.5" fill="#f4b88a"/>

  <!-- Title -->
  <rect x="40" y="20" width="640" height="50" rx="12" fill="#e8f5e9" stroke="#9bb18a" stroke-width="2"/>
  <text x="360" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e5e3e">Habitat Noosa Everglades Ecocamp</text>
  <text x="360" y="62" text-anchor="middle" font-size="13" fill="#6b8e6b">Animal Crossing Style Map • Sunshine Coast, QLD</text>

  <!-- Legend -->
  <rect x="40" y="460" width="230" height="80" rx="10" fill="#fffdf8" stroke="#ddd3bf" stroke-width="2" opacity="0.95"/>
  <text x="50" y="478" font-size="11" font-weight="bold" fill="#5a4432">Quick Guide</text>
  <rect x="55" y="488" width="12" height="12" rx="3" fill="#c17a53"/><text x="72" y="498" font-size="9" fill="#444">Reception / Glamping</text>
  <rect x="55" y="505" width="12" height="12" rx="3" fill="#4fa3ce"/><text x="72" y="515" font-size="9" fill="#444">Lake Access / Kayak</text>
  <rect x="55" y="522" width="12" height="12" rx="3" fill="#eecfa1"/><text x="72" y="532" font-size="9" fill="#444">Bar / Brewery</text>
  <rect x="160" y="488" width="12" height="12" rx="3" fill="#8fb38a"/><text x="177" y="498" font-size="9" fill="#444">Walking Paths</text>
  <rect x="160" y="505" width="12" height="12" rx="3" fill="#6b522e"/><text x="177" y="515" font-size="9" fill="#444">Camp Kitchen</text>

  <!-- Footer note -->
  <text x="360" y="545" text-anchor="middle" font-size="10" fill="#7a9e7a" font-style="italic">No pets • Check-in 3pm glamping • 30 min to Noosa Heads</text>
</svg>
