<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habitat Noosa - Stardew Valley Map</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#8b6914;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Courier New',monospace;padding:20px}
  .title-frame{background:#f5e6d0;border:4px solid #8b6914;border-radius:0;padding:14px 36px;margin-bottom:16px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 0 0 2px #d4a76a}
  .title-frame h1{font-size:24px;color:#4a2c0e;text-shadow:2px 2px 0 rgba(0,0,0,.2);letter-spacing:2px}
  .title-frame p{font-size:13px;color:#6b522e;margin-top:4px;letter-spacing:1px}
  svg{max-width:900px;width:100%;height:auto;border:6px solid #5a3a1a;box-shadow:0 8px 30px rgba(0,0,0,.3),inset 0 0 0 2px #8b6914}
  .legend{background:#f5e6d0;border:3px solid #8b6914;padding:12px 20px;margin-top:16px;max-width:900px;width:100%;display:flex;flex-wrap:wrap;gap:10px 22px}
  .legend div{display:flex;align-items:center;gap:6px;font-size:12px;color:#4a2c0e}
  .legend span{display:inline-block;width:14px;height:14px;border:1px solid #5a3a1a}
</style>
</head>
<body>
<div class="title-frame"><h1>HABITAT NOOSA EVERGLADES ECOCAMP</h1><p>Stardew Valley Style - Sunshine Coast, QLD</p></div>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 840 680" width="900" height="680">
<defs>
  <style>
    @keyframes shimmer{0%,100%{opacity:.7}50%{opacity:.4}}
    .water-shimmer{animation:shimmer 3s ease-in-out infinite}
    @keyframes flicker{0%,100%{opacity:.9}50%{opacity:.5}}
    .fire{animation:flicker 1s ease-in-out infinite}
    /* Pixel grid pattern - SV style */
  </style>

  <filter id="pixel" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="0" flood-color="#000" flood-opacity=".2"/>
  </filter>

  <!-- Ground pattern - SV earth tone -->
  <pattern id="ground" width="32" height="32" patternUnits="userSpaceOnUse">
    <rect width="32" height="32" fill="#8fbc8f"/>
    <rect x="0" y="0" width="4" height="4" fill="#7aa37a" opacity=".6"/>
    <rect x="16" y="8" width="3" height="3" fill="#7aa37a" opacity=".4"/>
    <rect x="24" y="20" width="3" height="3" fill="#7aa37a" opacity=".3"/>
    <rect x="8" y="24" width="4" height="4" fill="#7aa37a" opacity=".35"/>
  </pattern>

  <!-- Water tile pattern -->
  <pattern id="wat" width="32" height="32" patternUnits="userSpaceOnUse">
    <rect width="32" height="32" fill="#4a90b8"/>
    <rect x="0" y="8" width="32" height="3" fill="#5ba8d0" opacity=".6"/>
    <rect x="0" y="24" width="32" height="2" fill="#5ba8d0" opacity=".4"/>
  </pattern>

  <!-- Dirt path pattern -->
  <pattern id="path" width="32" height="32" patternUnits="userSpaceOnUse">
    <rect width="32" height="32" fill="#c4a46c"/>
    <rect x="4" y="4" width="6" height="4" fill="#b4945c" opacity=".5"/>
    <rect x="18" y="20" width="5" height="5" fill="#b4945c" opacity=".4"/>
  </pattern>

  <!-- Grass patch pattern (darker) -->
  <pattern id="grassdark" width="32" height="32" patternUnits="userSpaceOnUse">
    <rect width="32" height="32" fill="#6b8e23"/>
    <rect x="0" y="0" width="4" height="4" fill="#5a7d12" opacity=".5"/>
    <rect x="20" y="16" width="3" height="3" fill="#5a7d12" opacity=".4"/>
  </pattern>

  <!-- Wood plank pattern -->
  <pattern id="wood" width="32" height="32" patternUnits="userSpaceOnUse">
    <rect width="32" height="32" fill="#c4956a"/>
    <line x1="0" y1="0" x2="0" y2="32" stroke="#a87b52" stroke-width="1" opacity=".3"/>
    <line x1="16" y1="0" x2="16" y2="32" stroke="#a87b52" stroke-width="1" opacity=".2"/>
  </pattern>
</defs>

<!-- Background -->
<rect x="-20" y="-20" width="880" height="720" fill="#8fbc8f"/>

<!-- === TERRAIN VARIATION === -->
<!-- Darker grass patches -->
<rect x="40" y="40" width="80" height="60" fill="url(#grassdark)" opacity=".4"/>
<rect x="200" y="30" width="50" height="50" fill="url(#grassdark)" opacity=".3"/>
<rect x="500" y="40" width="70" height="70" fill="url(#grassdark)" opacity=".3"/>
<rect x="650" y="60" width="90" height="50" fill="url(#grassdark)" opacity=".35"/>
<rect x="100" y="400" width="100" height="80" fill="url(#grassdark)" opacity=".3"/>
<rect x="400" y="450" width="120" height="60" fill="url(#grassdark)" opacity=".25"/>

<!-- River / Canal -->
<rect x="-20" y="440" width="880" height="260" fill="url(#wat)"/>
<rect x="-20" y="440" width="880" height="8" fill="#3a7a9a" opacity=".5"/>
<path d="M 40 460 L 200 480 L 400 455 L 600 475 L 800 450" stroke="#5ba8d0" stroke-width="2" fill="none" class="water-shimmer" opacity=".5"/>
<path d="M 20 490 L 180 510 L 380 485 L 580 505 L 780 480" stroke="#5ba8d0" stroke-width="2" fill="none" class="water-shimmer" opacity=".35"/>
<path d="M 60 530 L 220 550 L 420 525 L 620 545 L 820 520" stroke="#5ba8d0" stroke-width="1.5" fill="none" class="water-shimmer" opacity=".3"/>

<!-- === DIRT PATHS (SV style - stepped/angled) === -->
<!-- Main horizontal path -->
<rect x="20" y="260" width="780" height="28" fill="url(#path)" rx="2"/>
<rect x="20" y="260" width="780" height="3" fill="#b4945c" opacity=".5"/>
<rect x="20" y="285" width="780" height="3" fill="#b4945c" opacity=".4"/>

<!-- Vertical path (N-S) -->
<rect x="380" y="80" width="28" height="360" fill="url(#path)" rx="2"/>
<rect x="380" y="80" width="3" height="360" fill="#b4945c" opacity=".4"/>

<!-- Path to dock -->
<rect x="160" y="340" width="22" height="120" fill="url(#path)" rx="2"/>

<!-- === BUILDINGS === -->

<!-- RECEPTION - SV style blocky building -->
<g filter="url(#pixel)">
  <rect x="350" y="155" width="100" height="75" fill="#d4a76a"/>
  <rect x="350" y="155" width="100" height="8" fill="#b8860b"/>
  <rect x="355" y="163" width="90" height="60" fill="#e8d5b7"/>
  <!-- Roof -->
  <rect x="340" y="135" width="120" height="20" fill="#8b4513"/>
  <rect x="345" y="130" width="110" height="10" fill="#a0522d"/>
  <rect x="350" y="126" width="100" height="8" fill="#8b4513"/>
  <!-- Roof peak -->
  <polygon points="345,135 400,110 455,135" fill="#8b4513"/>
  <polygon points="350,135 400,115 450,135" fill="#a0522d"/>
  <!-- Door -->
  <rect x="390" y="195" width="20" height="25" fill="#6b3410"/>
  <rect x="390" y="195" width="20" height="4" fill="#8b4513"/>
  <circle cx="405" cy="208" r="2" fill="#d4a76a"/>
  <!-- Windows -->
  <rect x="363" y="180" width="18" height="15" fill="#87ceeb"/>
  <rect x="363" y="180" width="18" height="15" fill="none" stroke="#6b8e23" stroke-width="2"/>
  <rect x="375" y="180" width="8" height="15" fill="none" stroke="#6b8e23" stroke-width="1.5"/>
  <rect x="363" y="187" width="18" height="2" fill="#6b8e23"/>
  <rect x="418" y="180" width="18" height="15" fill="#87ceeb"/>
  <rect x="418" y="180" width="18" height="15" fill="none" stroke="#6b8e23" stroke-width="2"/>
  <rect x="430" y="180" width="8" height="15" fill="none" stroke="#6b8e23" stroke-width="1.5"/>
  <rect x="418" y="187" width="18" height="2" fill="#6b8e23"/>
  <!-- Sign -->
  <rect x="375" y="105" width="50" height="20" fill="#f5e6d0" stroke="#8b4513" stroke-width="2"/>
  <text x="400" y="120" text-anchor="middle" font-size="10" fill="#8b4513" font-weight="bold">RECEPTION</text>
</g>

<!-- ECOCAMP BISTRO -->
<g filter="url(#pixel)">
  <rect x="100" y="200" width="120" height="70" fill="#d4a76a"/>
  <rect x="100" y="200" width="120" height="8" fill="#b8860b"/>
  <rect x="105" y="208" width="110" height="55" fill="#e8d5b7"/>
  <!-- Roof -->
  <rect x="90" y="180" width="140" height="20" fill="#8b4513"/>
  <polygon points="95,180 160,155 225,180" fill="#a0522d"/>
  <!-- Door -->
  <rect x="210" y="230" width="18" height="23" fill="#6b3410"/>
  <!-- Windows -->
  <rect x="118" y="220" width="16" height="14" fill="#87ceeb"/>
  <rect x="118" y="220" width="16" height="14" fill="none" stroke="#6b8e23" stroke-width="2"/>
  <rect x="150" y="220" width="16" height="14" fill="#87ceeb"/>
  <rect x="150" y="220" width="16" height="14" fill="none" stroke="#6b8e23" stroke-width="2"/>
  <!-- Sign -->
  <rect x="130" y="145" width="65" height="18" fill="#f5e6d0" stroke="#8b4513" stroke-width="2"/>
  <text x="162" y="159" text-anchor="middle" font-size="9" fill="#8b4513" font-weight="bold">ECOCAMP BAR</text>
</g>

<!-- COOTHARA BAR (green building) -->
<g filter="url(#pixel)">
  <rect x="480" y="220" width="90" height="60" fill="#6b8e23"/>
  <rect x="485" y="228" width="80" height="45" fill="#98c379"/>
  <!-- Roof -->
  <rect x="470" y="200" width="110" height="20" fill="#4a6b12"/>
  <polygon points="475,200 525,180 575,200" fill="#5a7d12"/>
  <!-- Door -->
  <rect x="515" y="252" width="18" height="20" fill="#3a5a00"/>
  <!-- Window -->
  <rect x="495" y="238" width="16" height="12" fill="#87ceeb"/>
  <rect x="495" y="238" width="16" height="12" fill="none" stroke="#3a5a00" stroke-width="2"/>
  <!-- Sign -->
  <rect x="500" y="170" width="50" height="16" fill="#f5e6d0" stroke="#4a6b12" stroke-width="2"/>
  <text x="525" y="183" text-anchor="middle" font-size="8" fill="#4a6b12" font-weight="bold">COOTHARA</text>
</g>

<!-- KOI BAR (tiki style) -->
<g filter="url(#pixel)">
  <rect x="620" y="340" width="70" height="50" fill="#c4a76a"/>
  <rect x="625" y="348" width="60" height="35" fill="#f5e6d0"/>
  <!-- Thatched roof -->
  <rect x="610" y="320" width="90" height="20" fill="#8b6914"/>
  <line x1="620" y1="325" x2="620" y2="340" stroke="#d4a76a" stroke-width="2"/>
  <line x1="630" y1="323" x2="630" y2="340" stroke="#d4a76a" stroke-width="2"/>
  <line x1="640" y1="323" x2="640" y2="340" stroke="#d4a76a" stroke-width="2"/>
  <line x1="650" y1="323" x2="650" y2="340" stroke="#d4a76a" stroke-width="2"/>
  <line x1="660" y1="323" x2="660" y2="340" stroke="#d4a76a" stroke-width="2"/>
  <line x1="670" y1="323" x2="670" y2="340" stroke="#d4a76a" stroke-width="2"/>
  <line x1="680" y1="323" x2="680" y2="340" stroke="#d4a76a" stroke-width="2"/>
  <line x1="690" y1="325" x2="690" y2="340" stroke="#d4a76a" stroke-width="2"/>
  <!-- Door -->
  <rect x="645" y="362" width="16" height="15" fill="#5a3a1a"/>
  <!-- Torches -->
  <rect x="615" y="345" width="4" height="12" fill="#8b6914"/>
  <circle cx="617" cy="343" r="4" fill="#ffa500" class="fire"/>
  <rect x="698" y="345" width="4" height="12" fill="#8b6914"/>
  <circle cx="700" cy="343" r="4" fill="#ffa500" class="fire"/>
  <!-- Sign -->
  <text x="655" y="378" text-anchor="middle" font-size="9" fill="#5a3a1a" font-weight="bold">KOI BAR</text>
</g>

<!-- CAMP KITCHEN -->
<g filter="url(#pixel)">
  <rect x="100" y="340" width="90" height="60" fill="#d4a76a"/>
  <rect x="105" y="348" width="80" height="45" fill="#f5e6d0"/>
  <!-- Roof -->
  <rect x="90" y="320" width="110" height="20" fill="#8b4513"/>
  <polygon points="95,320 145,300 195,320" fill="#a0522d"/>
  <!-- Door -->
  <rect x="120" y="370" width="16" height="20" fill="#6b3410"/>
  <!-- Window -->
  <rect x="152" y="358" width="14" height="12" fill="#87ceeb"/>
  <rect x="152" y="358" width="14" height="12" fill="none" stroke="#6b8e23" stroke-width="2"/>
  <!-- Chimney (cooking smoke) -->
  <rect x="175" y="305" width="12" height="20" fill="#666"/>
  <circle cx="181" cy="300" r="6" fill="#aaa" opacity=".6"/>
  <circle cx="185" cy="293" r="5" fill="#aaa" opacity=".4"/>
  <!-- Sign -->
  <text x="145" y="315" text-anchor="middle" font-size="9" fill="#f5e6d0" font-weight="bold">CAMP KITCHEN</text>
</g>

<!-- SHOWER / RESTROOM BLOCK -->
<g filter="url(#pixel)">
  <rect x="600" y="280" width="80" height="55" fill="#8fbc8f"/>
  <rect x="605" y="288" width="70" height="40" fill="#d8f5db"/>
  <!-- Roof -->
  <rect x="590" y="268" width="100" height="12" fill="#6b8e23"/>
  <!-- Windows -->
  <rect x="615" y="300" width="14" height="12" fill="#87ceeb"/>
  <rect x="615" y="300" width="14" height="12" fill="none" stroke="#6b8e23" stroke-width="2"/>
  <rect x="638" y="300" width="14" height="12" fill="#87ceeb"/>
  <rect x="638" y="300" width="14" height="12" fill="none" stroke="#6b8e23" stroke-width="2"/>
  <rect x="661" y="300" width="14" height="12" fill="#87ceeb"/>
  <rect x="661" y="300" width="14" height="12" fill="none" stroke="#6b8e23" stroke-width="2"/>
  <!-- Door -->
  <rect x="635" y="320" width="16" height="12" fill="#5a7d12"/>
  <!-- Sign -->
  <text x="640" y="346" text-anchor="middle" font-size="9" fill="#5a3a1a" font-weight="bold">SHOWER BLOCK</text>
</g>

<!-- === GLAMPING SITES === -->
<g filter="url(#pixel)">
  <!-- Site A -->
  <rect x="130" y="400" width="40" height="35" fill="#c4e0c4" stroke="#96c996" stroke-width="2"/>
  <polygon points="130,400 150,385 170,400" fill="#a8d8a8"/>
  <rect x="143" y="418" width="14" height="12" fill="#96c996"/>
  <text x="150" y="432" text-anchor="middle" font-size="8" fill="#2d5016">A</text>

  <!-- Site B -->
  <rect x="250" y="400" width="40" height="35" fill="#c4e0c4" stroke="#96c996" stroke-width="2"/>
  <polygon points="250,400 270,385 290,400" fill="#a8d8a8"/>
  <rect x="263" y="418" width="14" height="12" fill="#96c996"/>
  <text x="270" y="432" text-anchor="middle" font-size="8" fill="#2d5016">B</text>

  <!-- Site C -->
  <rect x="370" y="400" width="40" height="35" fill="#c4e0c4" stroke="#96c996" stroke-width="2"/>
  <polygon points="370,400 390,385 410,400" fill="#a8d8a8"/>
  <rect x="383" y="418" width="14" height="12" fill="#96c996"/>
  <text x="390" y="432" text-anchor="middle" font-size="8" fill="#2d5016">C</text>

  <!-- Site D -->
  <rect x="490" y="400" width="40" height="35" fill="#c4e0c4" stroke="#96c996" stroke-width="2"/>
  <polygon points="490,400 510,385 530,400" fill="#a8d8a8"/>
  <rect x="503" y="418" width="14" height="12" fill="#96c996"/>
  <text x="510" y="432" text-anchor="middle" font-size="8" fill="#2d5016">D</text>

  <!-- Site E -->
  <rect x="490" y="450" width="40" height="35" fill="#c4e0c4" stroke="#96c996" stroke-width="2"/>
  <polygon points="490,450 510,435 530,450" fill="#a8d8a8"/>
  <rect x="503" y="468" width="14" height="12" fill="#96c996"/>
  <text x="510" y="488" text-anchor="middle" font-size="8" fill="#2d5016">E</text>
</g>

<!-- === KAYAK / SUP DOCK === -->
<rect x="40" y="430" width="120" height="8" fill="#c4a76a"/>
<g filter="url(#pixel)">
  <rect x="50" y="440" width="30" height="14" fill="none" stroke="#d4a76a" stroke-width="2"/>
  <rect x="90" y="435" width="30" height="14" fill="none" stroke="#87ceeb" stroke-width="2"/>
  <text x="100" y="470" text-anchor="middle" font-size="9" fill="#5a3a1a" font-weight="bold">KAYAK / SUP</text>
</g>

<!-- LAKE ACCESS -->
<g filter="url(#pixel)">
  <rect x="170" y="455" width="20" height="30" fill="#c4a76a"/>
  <circle cx="165" cy="460" r="6" fill="none" stroke="#ff6347" stroke-width="2"/>
  <text x="180" y="495" text-anchor="middle" font-size="9" fill="#1a3a4a" font-weight="bold">LAKE ACCESS</text>
</g>

<!-- DISC GOLF HOLE -->
<g filter="url(#pixel)">
  <rect x="40" y="195" width="40" height="3" fill="#2d8040"/>
  <rect x="50" y="185" width="20" height="10" fill="none" stroke="#636e72" stroke-width="2"/>
  <text x="60" y="210" text-anchor="middle" font-size="8" fill="#636e72" font-weight="bold">DISC GOLF</text>
</g>

<!-- === TREES (SV style - blocky) === -->
<g filter="url(#pixel)">
  <!-- Tree 1 -->
  <rect x="45" y="120" width="40" height="40" fill="#228b22"/>
  <rect x="50" y="115" width="30" height="35" fill="#32cd32" opacity=".6"/>
  <rect x="58" y="155" width="8" height="18" fill="#8b4513"/>

  <!-- Tree 2 -->
  <rect x="70" y="80" width="35" height="35" fill="#228b22"/>
  <rect x="75" y="75" width="25" height="30" fill="#32cd32" opacity=".6"/>
  <rect x="83" y="110" width="8" height="15" fill="#8b4513"/>

  <!-- Tree 3 -->
  <rect x="720" y="120" width="40" height="40" fill="#228b22"/>
  <rect x="725" y="115" width="30" height="35" fill="#32cd32" opacity=".6"/>
  <rect x="738" y="155" width="8" height="18" fill="#8b4513"/>

  <!-- Tree 4 -->
  <rect x="740" y="60" width="35" height="35" fill="#228b22"/>
  <rect x="745" y="55" width="25" height="30" fill="#32cd32" opacity=".6"/>
  <rect x="753" y="90" width="8" height="15" fill="#8b4513"/>

  <!-- Tree 5 -->
  <rect x="50" y="300" width="38" height="38" fill="#228b22"/>
  <rect x="55" y="295" width="28" height="33" fill="#32cd32" opacity=".6"/>
  <rect x="66" y="335" width="8" height="18" fill="#8b4513"/>

  <!-- Tree 6 -->
  <rect x="330" y="100" width="36" height="36" fill="#228b22"/>
  <rect x="335" y="95" width="26" height="31" fill="#32cd32" opacity=".6"/>
  <rect x="344" y="132" width="8" height="16" fill="#8b4513"/>
</g>

<!-- === FLOWERS / DETAILS === -->
<circle cx="160" cy="175" r="3" fill="#ff6347"/>
<circle cx="170" cy="178" r="3" fill="#ffd700"/>
<circle cx="180" cy="176" r="3" fill="#ff6347"/>

<circle cx="450" cy="195" r="3" fill="#ffa500"/>
<circle cx="460" cy="198" r="3" fill="#ff6347"/>

<circle cx="755" cy="200" r="3" fill="#ffd700"/>
<circle cx="760" cy="208" r="3" fill="#ff6347"/>

<!-- === FENCE LINES (SV style) === -->
<line x1="180" y1="274" x2="320" y2="274" stroke="#8b4513" stroke-width="3" stroke-dasharray="8 3"/>
<line x1="370" y1="350" x2="470" y2="350" stroke="#8b4513" stroke-width="3" stroke-dasharray="8 3"/>
<line x1="580" y1="250" x2="650" y2="250" stroke="#8b4513" stroke-width="3" stroke-dasharray="8 3"/>

<!-- === TITLE (pixel-style) === -->
<rect x="300" y="12" width="240" height="32" fill="#f5e6d0" stroke="#8b4513" stroke-width="3"/>
<text x="420" y="34" text-anchor="middle" font-size="16" fill="#4a2c0e" font-weight="bold" letter-spacing="1">EVERGLADES ECOCAMP</text>

<!-- Footer -->
<text x="420" y="665" text-anchor="middle" font-size="11" fill="#5a3a1a" font-style="italic">No pets - Check-in 3pm glamping - 30min to Noosa Heads</text>
</svg>

<div class="legend">
  <div><span style="background:#87ceeb"></span> Lake &amp; Water</div>
  <div><span style="background:#c4a76a"></span> Buildings</div>
  <div><span style="background:#228b22"></span> Trees</div>
  <div><span style="background:#c4e0c4"></span> Glamping Sites</div>
  <div><span style="background:#c4a46c"></span> Dirt Paths</div>
  <div><span style="background:#6b8e23"></span> Green Space</div>
</div>
</body>
</html>
