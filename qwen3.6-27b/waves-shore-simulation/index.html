<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waves Crashing Into Shore</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, shoreY;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  shoreY = H * 0.6;
}
resize();
window.addEventListener('resize', resize);

// Particle: foam on wave crests
class Foam {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.3) * 3;
    this.vy = (Math.random() - 0.5) * 2;
    this.life = 1;
    this.decay = 0.005 + Math.random() * 0.01;
    this.radius = 2 + Math.random() * 4;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw() {
    if (this.life <= 0) return;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${this.life * 0.6})`;
    ctx.fill();
  }
}

// Particle: spray from breaking wave
class Spray {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = Math.random() * 4 + 2;
    this.vy = -(Math.random() * 6 + 2);
    this.life = 1;
    this.decay = 0.012 + Math.random() * 0.018;
    this.radius = 1 + Math.random() * 2;
    this.gravity = 0.08;
  }
  update() {
    this.x += this.vx;
    this.vy += this.gravity;
    this.y += this.vy;
    this.life -= this.decay;
    if (this.y > shoreY - 5) { this.y = shoreY - 5; this.vy = 0; this.vx *= 0.5; }
  }
  draw() {
    if (this.life <= 0) return;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * this.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,230,255,${this.life * 0.7})`;
    ctx.fill();
  }
}

// Particle: splash drops at shore impact
class Splash {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    const angle = -Math.PI * 0.2 - Math.random() * Math.PI * 0.6;
    const speed = 1 + Math.random() * 4;
    this.vx = Math.cos(angle) * speed * (Math.random() < 0.5 ? 1 : -0.3);
    this.vy = Math.sin(angle) * speed;
    this.life = 1;
    this.decay = 0.015 + Math.random() * 0.02;
    this.radius = 1.5 + Math.random() * 3;
    this.gravity = 0.1;
  }
  update() {
    this.x += this.vx;
    this.vy += this.gravity;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw() {
    if (this.life <= 0) return;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * this.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180,220,255,${this.life * 0.8})`;
    ctx.fill();
  }
}

let foamParticles = [];
let sprayParticles = [];
let splashParticles = [];
const MAX_P = 1200;

// Wave configuration
const waves = [
  { amp: 25, freq: 0.004, spd: 0.012, yBase: shoreY - 120, alpha: 0.25, r: 8,  g: 45,  b: 90  },
  { amp: 30, freq: 0.006, spd: 0.018, yBase: shoreY - 90,  alpha: 0.35, r: 12, g: 55,  b: 100 },
  { amp: 35, freq: 0.005, spd: 0.022, yBase: shoreY - 65,  alpha: 0.45, r: 18, g: 70,  b: 120 },
  { amp: 40, freq: 0.007, spd: 0.028, yBase: shoreY - 45,  alpha: 0.55, r: 25, g: 90,  b: 140 },
  { amp: 35, freq: 0.009, spd: 0.035, yBase: shoreY - 28,  alpha: 0.65, r: 35, g: 110, b: 155 },
  { amp: 28, freq: 0.012, spd: 0.042, yBase: shoreY - 12,  alpha: 0.8,  r: 55, g: 140, b: 180 },
];

function getWaveY(w, x, t) {
  return w.yBase
    + Math.sin(x * w.freq + t * w.spd) * w.amp
    + Math.sin(x * w.freq * 2.5 + t * w.spd * 1.3) * w.amp * 0.2
    + Math.sin(x * w.freq * 0.5 + t * w.spd * 0.7 + 1) * w.amp * 0.3;
}

function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, shoreY + 50);
  g.addColorStop(0,   '#000c18');
  g.addColorStop(0.3, '#0d2847');
  g.addColorStop(0.6, '#2a5a8a');
  g.addColorStop(0.85,'#5a9cc8');
  g.addColorStop(1,   '#7abbd4');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, shoreY + 50);

  // Sun
  const sx = W * 0.72, sy = shoreY * 0.3;
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 180);
  sg.addColorStop(0, 'rgba(255,235,180,0.95)');
  sg.addColorStop(0.15,'rgba(255,200,120,0.5)');
  sg.addColorStop(0.4,'rgba(255,170,80,0.15)');
  sg.addColorStop(1,  'rgba(255,140,60,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(sx - 200, sy - 200, 400, 400);

  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  for (let i = 0; i < 5; i++) {
    const cx = ((i * 337 + t * 1.5) % (W + 600)) - 300;
    const cy = 40 + i * 70 + Math.sin(t * 0.005 + i) * 5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 140 + i * 25, 22 + i * 6, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Birds
  ctx.strokeStyle = 'rgba(30,30,40,0.35)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const bx = ((i * 251 + t * 50) % (W + 300)) - 150;
    const by = 70 + i * 45 + Math.sin(t * 0.03 + i * 1.5) * 12;
    ctx.beginPath();
    ctx.moveTo(bx - 10, by + 5);
    ctx.quadraticCurveTo(bx - 3, by - 5, bx, by);
    ctx.quadraticCurveTo(bx + 3, by - 5, bx + 10, by + 5);
    ctx.stroke();
  }
}

function drawBeach() {
  // Sand
  const sg = ctx.createLinearGradient(0, shoreY + 10, 0, H);
  sg.addColorStop(0, '#c9a84c');
  sg.addColorStop(0.3,'#b89640');
  sg.addColorStop(0.7,'#9a7a35');
  sg.addColorStop(1,  '#7a6028');
  ctx.fillStyle = sg;

  ctx.beginPath();
  ctx.moveTo(0, shoreY + 5);
  for (let x = 0; x <= W; x += 4) {
    const d = Math.sin(x * 0.008 + 1.5) * 8 + Math.sin(x * 0.03) * 3;
    ctx.lineTo(x, shoreY + 10 + d);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fill();

  // Wet sand sheen
  ctx.fillStyle = 'rgba(50,80,120,0.18)';
  for (let x = 0; x <= W; x += 4) {
    const d = Math.sin(x * 0.008 + 1.5) * 8 + Math.sin(x * 0.03) * 3;
    ctx.fillRect(x, shoreY + 5 + d, 8, 35);
  }
}

function drawOcean(t) {
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];

    // Wave body fill
    const wg = ctx.createLinearGradient(0, w.yBase - w.amp * 2, 0, shoreY + 30);
    wg.addColorStop(0, `rgba(${w.r},${w.g},${w.b},${w.alpha})`);
    wg.addColorStop(1, `rgba(${w.r + 15},${w.g + 15},${w.b + 15},${w.alpha * 0.95})`);
    ctx.fillStyle = wg;

    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 2) {
      ctx.lineTo(x, getWaveY(w, x, t));
    }
    ctx.lineTo(W, H); ctx.closePath();
    ctx.fill();

    // White crest
    ctx.strokeStyle = `rgba(255,255,255,${w.alpha * 0.5})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 3) {
      const y = getWaveY(w, x, t);
      const deriv = Math.cos(x * w.freq + t * w.spd) * w.amp * w.freq;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Reflection on water
  ctx.fillStyle = 'rgba(255,220,150,0.04)';
  for (let x = 0; x < W; x += 6) {
    const rx = W * 0.72 - x;
    const ry = shoreY - 80 + Math.sin(x * 0.02 + t * 0.02) * 20;
    ctx.fillRect(W * 0.72 + x * 0.3 - 2, ry, 4, 60);
  }
}

function drawShoreFoamLine(t) {
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  for (let x = 0; x < W; x += 3) {
    const y = shoreY + 3 + Math.sin(x * 0.015 + t * 0.04) * 4;
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function spawnParticles(t) {
  // Foam on visible crests
  if (t % 3 === 0 && foamParticles.length < MAX_P * 0.4) {
    const w = waves[waves.length - 1];
    for (let x = 0; x < W; x += 20) {
      const y = getWaveY(w, x, t);
      if (Math.random() < 0.3) {
        foamParticles.push(new Foam(x, y));
      }
    }
  }

  // Breaking wave spray — crash zones move along shore
  for (let i = 0; i < 3; i++) {
    const crashX = ((t * 2 + i * W / 3) % (W + 200)) - 100;
    const w = waves[3 + i];
    const crashY = getWaveY(w, crashX, t);
    const intensity = (Math.sin(t * 0.03 + i * 2) + 1) / 2;

    if (intensity > 0.5 && sprayParticles.length < MAX_P * 0.4) {
      if (Math.random() < intensity * 0.6) {
        sprayParticles.push(new Spray(
          crashX + (Math.random() - 0.5) * 30,
          crashY
        ));
      }
    }

    // Splash where wave hits shore
    if (intensity > 0.7 && splashParticles.length < MAX_P * 0.3) {
      if (Math.random() < 0.3) {
        splashParticles.push(new Splash(
          crashX + (Math.random() - 0.5) * 15,
          shoreY - 5
        ));
      }
    }
  }

  // Foam at shore line
  if (t % 5 === 0 && foamParticles.length < MAX_P * 0.4) {
    for (let x = 0; x < W; x += 8) {
      const y = shoreY - 2 + Math.sin(x * 0.02 + t * 0.05) * 3;
      if (Math.random() < 0.25) {
        const f = new Foam(x, y);
        f.vx *= 0.3;
        f.vy *= 0.2;
        f.decay = 0.004;
        foamParticles.push(f);
      }
    }
  }
}

function drawVignette() {
  const vg = ctx.createRadialGradient(W / 2, H / 2, W * 0.2, W / 2, H / 2, W * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,15,0.3)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function animate(t) {
  ctx.clearRect(0, 0, W, H);

  drawSky(t);
  drawBeach();
  drawOcean(t);
  drawShoreFoamLine(t);

  spawnParticles(t);

  foamParticles = foamParticles.filter(p => p.life > 0);
  sprayParticles = sprayParticles.filter(p => p.life > 0);
  splashParticles = splashParticles.filter(p => p.life > 0);

  for (const p of foamParticles)   { p.update(); p.draw(); }
  for (const p of sprayParticles)  { p.update(); p.draw(); }
  for (const p of splashParticles) { p.update(); p.draw(); }

  drawVignette();

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
